function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(text,x,y,maxW,lh,color,font,align){
  ctx.font=font;ctx.fillStyle=color;
  ctx.textAlign=align||'left';ctx.textBaseline='top';
  let line='',yy=y;
  for(const ch of text){
    const test=line+ch;
    if(ctx.measureText(test).width>maxW&&line){
      ctx.fillText(line,x,yy);line=ch;yy+=lh;
    }else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy+lh;
}

const SFX={
  ac:null,master:null,muted:!!save.muted,
  ensure(){
    if(!this.ac){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=this.muted?0:0.42;
      this.master.connect(this.ac.destination);
    }
    if(this.ac.state==='suspended'){try{this.ac.resume();}catch(e){}}
  },
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.42;save.muted=m;persist();},
  tone(type,f,d,to,g){
    if(!this.ac||this.muted)return;
    const t=this.ac.currentTime,o=this.ac.createOscillator(),gn=this.ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+d);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(g||0.12,t+0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn);gn.connect(this.master);o.start(t);o.stop(t+d+0.03);
  },
  noise(d,f,g,filter){
    if(!this.ac||this.muted)return;
    const c=this.ac,t=c.currentTime,len=Math.max(1,Math.floor(c.sampleRate*d));
    const buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource();src.buffer=buf;
    const flt=c.createBiquadFilter();flt.type=filter||'lowpass';flt.frequency.setValueAtTime(f||900,t);
    const gn=c.createGain();gn.gain.setValueAtTime(g||0.18,t);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(flt);flt.connect(gn);gn.connect(this.master);src.start(t);
  },

  if(rot){const c=Math.cos(rot),s=Math.sin(rot);const nx=x*c-y*s,ny=x*s+y*c;x=nx;y=ny;}
  return {x:cx+x,y:cy+y};
}

let pathPts=[],pathCum=[],pathLen=0;
let WORM={x:20,y:300},STATION={x:1880,y:720};
let pads=[];

function roundPath(pts,radius){
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const d0=Math.hypot(p1.x-p0.x,p1.y-p0.y),d1=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    if(d0<1||d1<1)continue;
    const r=Math.min(radius,d0*0.45,d1*0.45);
    const a={x:p1.x+(p0.x-p1.x)*(r/d0),y:p1.y+(p0.y-p1.y)*(r/d0)};
    const b={x:p1.x+(p2.x-p1.x)*(r/d1),y:p1.y+(p2.y-p1.y)*(r/d1)};
    out.push(a);
    for(let t=1;t<=8;t++){
      const u=t/8,iu=1-u;
      out.push({x:iu*iu*a.x+2*iu*u*p1.x+u*u*b.x,y:iu*iu*a.y+2*iu*u*p1.y+u*u*b.y});
    }
    out.push(b);
  }
  out.push(pts[pts.length-1]);
  return out;
}
function buildPath(){
  const m=MAPS[game.map]||MAPS.snake;
  pathPts=m.smooth?m.raw.slice():roundPath(m.raw,70);
  pathCum=[0];let acc=0;
  for(let i=1;i<pathPts.length;i++){
    acc+=Math.hypot(pathPts[i].x-pathPts[i-1].x,pathPts[i].y-pathPts[i-1].y);
    pathCum.push(acc);
  }
  pathLen=acc;
  WORM=posAt(64);
  STATION=posAt(Math.max(0,pathLen-64));
}
function posAt(d){
  d=clamp(d,0,pathLen);
  let lo=0,hi=pathCum.length-1;
  while(lo<hi-1){const mid=(lo+hi)>>1;if(pathCum[mid]<=d)lo=mid;else hi=mid;}
  const span=Math.max(1e-6,pathCum[hi]-pathCum[lo]);
  const t=(d-pathCum[lo])/span;
  const a=pathPts[lo],b=pathPts[hi];
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x)};
}
function distToPath(px,py){
  let best=1e9;
  for(let i=0;i<pathPts.length-1;i++){
    const a=pathPts[i],b=pathPts[i+1];
    const vx=b.x-a.x,vy=b.y-a.y;
    const L=vx*vx+vy*vy;
    let t=L>0?((px-a.x)*vx+(py-a.y)*vy)/L:0;
    t=clamp(t,0,1);
    const dx=px-(a.x+vx*t),dy=py-(a.y+vy*t);
    const d=dx*dx+dy*dy;
    if(d<best)best=d;
  }
  return Math.sqrt(best);
}
/* ★ 建造点规则：到赛道直线距离 ≤ 0.8×射程，且不压在赛道上 */
const MAX_PADS=16;
function buildPads(){
  const REF=TOWERS.laser.range[0]*RANGE_MUL;
  const maxD=REF*0.8;
  const minD=102;
  const cands=[];
  for(let y=104;y<=1024;y+=58){
    for(let x=104;x<=1836;x+=58){
      const d=distToPath(x,y);
      if(d<minD||d>maxD)continue;
      if(Math.hypot(x-WORM.x,y-WORM.y)<180)continue;
      if(Math.hypot(x-STATION.x,y-STATION.y)<185)continue;
      cands.push({x,y,d});
    }
  }
  cands.sort((a,b)=>a.d-b.d);
  const chosen=[];
  for(const c of cands){
    let ok=true;
    for(const s of chosen){ if(Math.hypot(s.x-c.x,s.y-c.y)<126){ok=false;break;} }
    if(ok){chosen.push(c); if(chosen.length>=MAX_PADS)break;}
  }
  if(chosen.length<8){           // 兜底：放宽间距
    for(const c of cands){
      let ok=true;
      for(const s of chosen){ if(Math.hypot(s.x-c.x,s.y-c.y)<104){ok=false;break;} }
      if(ok){chosen.push(c); if(chosen.length>=MAX_PADS)break;}
    }
  }
  pads=chosen.map((p,i)=>({x:p.x,y:p.y,tower:null,idx:i}));
}

function burst(x,y,n,color,spd,life,size){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=rand(0.25,1)*(spd||150);
    game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:life||0.5,max:life||0.5,size:size||rand(2,5),color,drag:0.92});
  }
}
function ring(x,y,maxR,color,life,w){
  game.rings.push({x,y,r:6,max:maxR,life:life||0.65,max2:life||0.65,color,w:w||3});
}
function flashText(x,y,text,color){
  game.floats.push({x,y,text,color,life:0.95,max:0.95,vy:-42});
}
function shake(mag,time){game.shake=Math.max(game.shake,mag);game.shakeT=Math.max(game.shakeT,time||0.18);}
function setBanner(text,color){game.banner={text,color};game.bannerT=1.7;}

/* =========================================================
   9. 波次
   ========================================================= */
function buildWave(n){
  const q=[];
  const push=(type,count,gap)=>{for(let i=0;i<count;i++)q.push({type,gap});};
  push('scout',4+Math.floor(n*1.1),0.62);
  if(n>=2)push('swift',1+Math.floor(n/2),0.36);
  if(n>=3)push('heavy',Math.floor(n/2.2),1.1);
  if(n>=4)push('wraith',Math.floor((n-1)/3),0.82);
  if(n>=5)push('reviver',Math.floor((n-2)/3),1.0);
  if(n>=6)push('bomber',Math.floor((n-3)/2),0.88);
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=q[i];q[i]=q[j];q[j]=t;}
  if(n===10||n===20)q.push({type:'boss',gap:1.4});
  return q;
}
function startWave(early){
  if(game.waveActive||game.screen!=='playing'||game.rewardPending)return;
  if(early&&game.countdown>0.2){
    const bonus=Math.floor(game.countdown)*5;
    game.coins+=bonus;game.score+=bonus;
    flashText(WORM.x+240,WORM.y-90,'+'+bonus,'#FFD166');
  }
  game.wave++;
  game.spawnQueue=buildWave(game.wave);
  game.spawnTimer=0.25;
  game.waveActive=true;
  game.countdown=0;
  SFX.play('wave');
  if(game.wave===1){
    game.launchFx=0.001;
    setBanner('星尘发射','#55F7FF');
    SFX.play('launch');
  }else{
    setBanner('第 '+game.wave+' 波','#FFD166');
  }
  if(game.wave>save.bestWave){save.bestWave=game.wave;persist();}
}
function spawnEnemy(type){
  const def=ENEMIES[type];
  const w=game.wave;
  const hpMul=1+(w-1)*0.145;
  const spMul=Math.min(1.32,1+(w-1)*0.022);
  const e={
    type,def,dist:0,hp:def.hp*hpMul,maxHp:def.hp*hpMul,
    speed:def.speed*spMul,baseSpeed:def.speed*spMul,
    r:def.r,color:def.color,stealth:!!def.stealth,revealed:false,
    revives:def.revive||0,reviveT:0,
    dead:false,slow:1,slowT:0,vuln:0,vulnT:0,
    burnT:0,burnDps:0,burnOwner:null,
    poisonT:0,poisonDps:0,poisonOwner:null,
    trail:[],hitFlash:0,wobble:Math.random()*TAU
  };
  const p=posAt(0);
  e.x=p.x;e.y=p.y;e.ang=p.ang;
  game.enemies.push(e);
  if(def.boss){game.bossRef=e;setBanner('母舰来袭','#FF5B72');shake(5,0.3);SFX.play('bigboom');}
}

function upgradeCost(type,level){return Math.round(TOWERS[type].cost*(level===1?1.15:2.0));}
function buildTower(pad,type){
  const def=TOWERS[type];
  const free=game.freeBuild>0;
  const cost=free?0:def.cost;
  if(game.coins<cost){SFX.play('deny');flashText(pad.x,pad.y-40,'金币不足','#FF5B72');return;}
  game.coins-=cost;
  if(free)game.freeBuild--;
  pad.tower={type,level:1,x:pad.x,y:pad.y,cd:0,angle:-Math.PI/2,rotor:Math.random()*TAU,
    hp:100,maxHp:100,invested:free?Math.round(def.cost*0.4):def.cost,kills:0,damage:0,pulse:0,haste:0,hasteT:0};
  game.towers.push(pad.tower);
  burst(pad.x,pad.y,22,def.color,180,0.55);
  ring(pad.x,pad.y,90,def.color,0.5,3);
  flashText(pad.x,pad.y-46,free?'免费建造':def.name,free?'#55F7FF':def.color);
  SFX.play('build');
}
function upgradeTower(pad){
  const t=pad.tower;if(!t||t.level>=3)return;
  const cost=upgradeCost(t.type,t.level);
  if(game.coins<cost){SFX.play('deny');flashText(pad.x,pad.y-40,'金币不足','#FF5B72');return;}
  game.coins-=cost;t.invested+=cost;t.level++;
  burst(pad.x,pad.y,26,TOWERS[t.type].color,220,0.6);
  ring(pad.x,pad.y,120,'#FFD166',0.55,3);
  flashText(pad.x,pad.y-52,'升级 LV'+t.level,'#FFD166');

}
function sellTower(pad){
  const t=pad.tower;if(!t)return;
  const back=Math.floor(t.invested*0.7);
  game.coins+=back;
  flashText(pad.x,pad.y-46,'+'+back,'#FFD166');

/* =========================================================
   11. 战斗逻辑
   ========================================================= */
function damageEnemy(e,dmg,tower,noArmor){
  if(e.dead||e.reviveT>0)return;
  let d=dmg;
  if(!noArmor&&e.def.armor)d=Math.max(d*0.35,d-e.def.armor);
  d*=(1+(e.vuln||0))*(1+game.dmgBuff);
  e.hp-=d;
  e.hitFlash=0.12;
  if(tower)tower.damage+=d;
  if(e.hp<=0)killEnemy(e,tower);
}
function killEnemy(e,tower){
  if(e.dead)return;
  if(e.revives>0){                 // ★ 复活怪
    e.revives--;
    e.reviveT=1.15;
    e.hp=e.maxHp*0.55;
    e.slow=1;e.slowT=0;e.vuln=0;e.vulnT=0;e.burnT=0;e.poisonT=0;
    ring(e.x,e.y,150,'#8DFF3C',0.9,4);
    burst(e.x,e.y,28,'#8DFF3C',240,0.8,5);
    flashText(e.x,e.y-30,'复活!','#8DFF3C');
    SFX.play('repair');
    return;
  }
  e.dead=true;
  game.kills++;
  const rw=e.def.reward;
  game.coins+=rw;game.score+=rw*2;
  if(tower)tower.kills++;
  flashText(e.x,e.y-18,'+'+rw,'#FFD166');
  const big=!!e.def.boss;
  burst(e.x,e.y,big?70:16,e.color,big?320:170,big?1.1:0.6,big?7:4);
  ring(e.x,e.y,big?190:78,big?'#FF5B72':'#FFD166',big?0.95:0.55,big?5:3);
  if(big){
    shake(6,0.4);SFX.play('bigboom');
    game.bossRef=null;
    setBanner('母舰击毁','#FFD166');
    game.flash=Math.max(game.flash,0.35);
  }else{
    SFX.play('boom');
    if(e.def.boom)selfDestruct(e);
  }
}
function selfDestruct(e){
  ring(e.x,e.y,140,'#FF8A5B',0.55,4);
  burst(e.x,e.y,26,'#FF8A5B',260,0.7);
  shake(3,0.16);
  const snapshot=game.towers.slice();
  for(const t of snapshot){
    const d=Math.hypot(t.x-e.x,t.y-e.y);
    if(d<130){
      t.hp-=45;
      flashText(t.x,t.y-42,'-45','#FF5B72');
      if(t.hp<=0){
        burst(t.x,t.y,30,TOWERS[t.type].color,240,0.8);
        ring(t.x,t.y,110,'#FF5B72',0.6,4);
        const pad=pads.find(p=>p.tower===t);
        if(pad)pad.tower=null;
        const i=game.towers.indexOf(t);if(i>=0)game.towers.splice(i,1);
        setBanner('防御塔被摧毁','#FF5B72');
      }
    }
  }
}
function findTarget(t,range){
  let best=null,bd=-1;
  for(const e of game.enemies){
    if(e.dead||e.reviveT>0)continue;
    if(e.stealth&&!e.revealed)continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d>range)continue;
    if(e.dist>bd){bd=e.dist;best=e;}
  }
  return best;
}
function fireLaser(t,target){
  damageEnemy(target,TOWERS.laser.dmg[t.level-1],t);
  game.beams.push({x1:t.x,y1:t.y,x2:target.x,y2:target.y,color:'#55F7FF',
    life:0.08,max:0.08,w:2+t.level*0.8});
  burst(target.x,target.y,4,'#55F7FF',130,0.24,3);
  SFX.play('laser');
}
function fireMissile(t,target){
  const def=TOWERS.missile;
  game.projectiles.push({
    x:t.x,y:t.y,target,tx:target.x,ty:target.y,
    speed:430,dmg:def.dmg[t.level-1],splash:def.splash[t.level-1],
    angle:Math.atan2(target.y-t.y,target.x-t.x),life:4,type:'missile'
  });
  SFX.play('missile');
}
function fireTesla(t,target){
  const def=TOWERS.tesla;
  const chain=def.chain[t.level-1];
  const hits=[];
  let cur=target;
  for(let i=0;i<chain&&cur;i++){
    hits.push(cur);
    let next=null,bd=175;
    for(const e of game.enemies){
      if(e.dead||e.reviveT>0||hits.indexOf(e)>=0)continue;
      const d=Math.hypot(e.x-cur.x,e.y-cur.y);
      if(d<bd){bd=d;next=e;}
    }
    cur=next;
  }
  let sx=t.x,sy=t.y;
  hits.forEach((e,i)=>{
    const dmg=def.dmg[t.level-1]*Math.pow(0.82,i);
    game.beams.push({x1:sx,y1:sy,x2:e.x,y2:e.y,color:'#B97CFF',life:0.14,max:0.14,w:3,branch:true});
    damageEnemy(e,dmg,t);
    burst(e.x,e.y,6,'#B97CFF',160,0.3,3);
    sx=e.x;sy=e.y;
  });
  SFX.play('zap');
}
function firePoison(t,target){
  const def=TOWERS.poison;
  damageEnemy(target,def.dmg[t.level-1],t);
  if(!target.dead){
    target.poisonT=3;
    target.poisonDps=def.dot[t.level-1];
    target.poisonOwner=t;
  }
  game.beams.push({x1:t.x,y1:t.y,x2:target.x,y2:target.y,color:'#8DFF3C',life:0.17,max:0.17,w:4});
  burst(target.x,target.y,10,'#8DFF3C',150,0.5,4);
  ring(target.x,target.y,36,'#8DFF3C',0.42,2.5);
  SFX.play('poison');
}
function icePulse(t){
  const def=TOWERS.ice,range=rangeOf('ice',t.level);
  const slow=def.slow[t.level-1];
  for(const e of game.enemies){
    if(e.dead||e.reviveT>0)continue;
    if(Math.hypot(e.x-t.x,e.y-t.y)<=range){
      e.slow=Math.min(e.slow,slow);e.slowT=1.25;
      damageEnemy(e,def.dmg[t.level-1],t,true);
    }
  }
  ring(t.x,t.y,range,'#8FD8FF',0.5,2);
  SFX.play('ice');
}
function firePulse(t){
  const def=TOWERS.fire,range=rangeOf('fire',t.level);
  let hit=false;
  for(const e of game.enemies){
    if(e.dead||e.reviveT>0)continue;
    if(Math.hypot(e.x-t.x,e.y-t.y)<=range){
      damageEnemy(e,def.dmg[t.level-1],t,true);
      if(!e.dead){e.burnT=2.5;e.burnDps=def.burn[t.level-1];e.burnOwner=t;}
      burst(e.x,e.y,3,'#FF8A5B',100,0.3,3);
      hit=true;
    }
  }
  if(hit){ring(t.x,t.y,range*0.82,'#FF8A5B',0.4,3);SFX.play('fire');}
}
function gravityPulse(t){
  const def=TOWERS.gravity,range=rangeOf('gravity',t.level);
  const slow=def.slow[t.level-1],vul=def.vuln[t.level-1];
  for(const e of game.enemies){
    if(e.dead||e.reviveT>0)continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d<=range){
      e.slow=Math.min(e.slow,slow);e.slowT=1.5;
      e.vuln=Math.max(e.vuln,vul);e.vulnT=1.5;
      damageEnemy(e,def.dmg[t.level-1],t,true);
      const a=Math.atan2(t.y-e.y,t.x-e.x);
      game.parts.push({x:e.x,y:e.y,vx:Math.cos(a)*60,vy:Math.sin(a)*60,
        life:0.35,max:0.35,size:3.5,color:'#B97CFF',drag:0.94});
    }
  }
  ring(t.x,t.y,range,'#B97CFF',0.55,2.5);
  SFX.play('gravity');
}
function repairPulse(t){
  const def=TOWERS.repair,range=rangeOf('repair',t.level);
  const healPct=def.heal[t.level-1]/100,haste=def.haste[t.level-1];
  const snapshot=game.towers.slice();
  for(const o of snapshot){
    if(o===t)continue;
    if(Math.hypot(o.x-t.x,o.y-t.y)<=range){
      o.haste=haste;o.hasteT=2.0;
      if(o.hp<o.maxHp){
        const heal=o.maxHp*healPct;
        o.hp=Math.min(o.maxHp,o.hp+heal);
        flashText(o.x,o.y-46,'+'+Math.round(heal),'#7CFFB2');
      }
    }
  }
  ring(t.x,t.y,range,'#7CFFB2',0.6,2);
  SFX.play('repair');
}
function doPulse(t){
  if(t.type==='ice')icePulse(t);
  else if(t.type==='fire')firePulse(t);
  else if(t.type==='gravity')gravityPulse(t);
  else if(t.type==='repair')repairPulse(t);
}
function explodeMissile(m){
  ring(m.tx,m.ty,m.splash,'#FFD166',0.55,3);
  burst(m.tx,m.ty,18,'#FFD166',230,0.55,5);
  burst(m.tx,m.ty,10,'#FF8A5B',150,0.4,3);
  shake(2,0.12);
  SFX.play('boom');
  for(const e of game.enemies){
    if(e.dead||e.reviveT>0)continue;
    const d=Math.hypot(e.x-m.tx,e.y-m.ty);
    if(d<=m.splash+e.r*0.6)damageEnemy(e,m.dmg,null);
  }
}

/* =========================================================
   12. 主更新（固定步长）
   ========================================================= */
function update(dt){
  game.time+=dt;
  if(game.flash>0)game.flash=Math.max(0,game.flash-dt*1.6);
  if(game.shakeT>0){game.shakeT-=dt;if(game.shakeT<=0)game.shake=0;}
  if(game.bannerT>0)game.bannerT-=dt;
  if(game.launchFx>0&&game.launchFx<1)game.launchFx=Math.min(1,game.launchFx+dt*2.4);

  for(const p of game.parts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(p.drag,dt*60);p.vy*=Math.pow(p.drag,dt*60);
    p.life-=dt;
  }
  game.parts=game.parts.filter(p=>p.life>0);
  for(const r of game.rings){r.r+=(r.max-r.r)*Math.min(1,dt*7);r.life-=dt;}
  game.rings=game.rings.filter(r=>r.life>0);
  for(const b of game.beams)b.life-=dt;
  game.beams=game.beams.filter(b=>b.life>0);
  for(const f of game.floats){f.y+=f.vy*dt;f.vy*=0.94;f.life-=dt;}
  game.floats=game.floats.filter(f=>f.life>0);

  if(game.screen!=='playing')return;
  if(game.rewardPending)return;

  if(game.slowFieldT>0)game.slowFieldT=Math.max(0,game.slowFieldT-dt);

  if(!game.waveActive){
    game.countdown-=dt;
    if(game.countdown<=0){game.countdown=0;startWave(false);}
  }

  if(game.waveActive&&game.spawnQueue.length){
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0){
      const item=game.spawnQueue.shift();
      spawnEnemy(item.type);
      game.spawnTimer=item.gap;
    }
  }

  // 反隐
  for(const e of game.enemies)e.revealed=false;
  for(const t of game.towers){
    if(t.type!=='tesla')continue;
    const range=rangeOf('tesla',t.level)*1.15;
    for(const e of game.enemies){
      if(e.stealth&&Math.hypot(e.x-t.x,e.y-t.y)<=range)e.revealed=true;
    }
  }

  const fieldSlow=game.slowFieldT>0?0.5:1;

  // 敌人
  for(const e of game.enemies){
    if(e.dead)continue;
    if(e.reviveT>0){                    // 复活中：静止无敌
      e.reviveT-=dt;
      e.wobble+=dt*2;
      if(Math.random()<dt*26)
        game.parts.push({x:e.x+rand(-e.r,e.r),y:e.y+rand(-e.r,e.r),vx:rand(-20,20),vy:rand(-90,-30),
          life:0.5,max:0.5,size:3.4,color:'#8DFF3C',drag:0.95});
      continue;
    }
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=1;}
    if(e.vulnT>0){e.vulnT-=dt;if(e.vulnT<=0)e.vuln=0;}
    if(e.burnT>0){
      e.burnT-=dt;
      damageEnemy(e,e.burnDps*dt,e.burnOwner,true);
      if(e.dead)continue;
      if(Math.random()<dt*22)
        game.parts.push({x:e.x+rand(-e.r,e.r),y:e.y+rand(-e.r,e.r),vx:rand(-16,16),vy:rand(-70,-26),
          life:0.4,max:0.4,size:3.2,color:'#FF8A5B',drag:0.94});
    }
    if(e.poisonT>0){
      e.poisonT-=dt;
      damageEnemy(e,e.poisonDps*dt,e.poisonOwner,true);
      if(e.dead)continue;
      if(Math.random()<dt*18)
        game.parts.push({x:e.x+rand(-e.r*0.8,e.r*0.8),y:e.y+rand(-e.r*0.8,e.r*0.8),
          vx:rand(-14,14),vy:rand(16,58),life:0.55,max:0.55,size:3.4,color:'#8DFF3C',drag:0.96});
    }
    e.hitFlash=Math.max(0,e.hitFlash-dt);
    e.wobble+=dt*3;
    e.dist+=e.speed*e.slow*fieldSlow*dt;
    const p=posAt(e.dist);
    e.x=p.x;e.y=p.y;e.ang=p.ang;
    const trRate=e.def.swift?52:30;
    if(Math.random()<dt*trRate){
      e.trail.push({x:e.x-Math.cos(e.ang)*e.r*1.1,y:e.y-Math.sin(e.ang)*e.r*1.1,life:0.42,max:0.42});
    }
    for(const tr of e.trail)tr.life-=dt;
    e.trail=e.trail.filter(t=>t.life>0);
    if(e.dist>=pathLen){
      e.dead=true;
      game.lives-=e.def.damage;
      game.flash=Math.max(game.flash,0.4);
      game.stationHit=0.5;
      shake(6,0.22);
      SFX.play('hurt');
      flashText(STATION.x-40,STATION.y-70,'-'+e.def.damage,'#FF5B72');
      if(game.lives<=0){
        game.lives=0;game.screen='over';
        save.highScore=Math.max(save.highScore,game.score);persist();
      }
    }
  }
  game.enemies=game.enemies.filter(e=>!e.dead);
  if(game.bossRef&&game.bossRef.dead)game.bossRef=null;

  // 防御塔
  const towers=game.towers.slice();
  for(const t of towers){
    if(game.towers.indexOf(t)<0)continue;
    const def=TOWERS[t.type];
    const range=rangeOf(t.type,t.level);
    t.rotor+=dt*(t.type==='tesla'?2.4:1.1);
    if(t.hasteT>0){t.hasteT-=dt;if(t.hasteT<=0)t.haste=0;}
    const hs=1+(t.haste||0)+game.hasteBuff;

    if(PULSE_TYPES[t.type]){
      t.pulse=Math.max(0,t.pulse-dt*hs);
      if(t.pulse<=0){t.pulse=1/(def.rate[t.level-1]*hs);doPulse(t);}
      continue;
    }
    t.cd-=dt*hs;
    const target=findTarget(t,range);
    if(target){
      t.angle=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cd<=0){
        t.cd=1/(def.rate[t.level-1]*hs);
        if(t.type==='laser')fireLaser(t,target);
        else if(t.type==='missile')fireMissile(t,target);
        else if(t.type==='poison')firePoison(t,target);
        else fireTesla(t,target);
      }
    }else{
      t.angle+=dt*0.35;
    }
  }

  // 导弹
  for(const m of game.projectiles){
    m.life-=dt;
    if(m.target&&!m.target.dead){m.tx=m.target.x;m.ty=m.target.y;}
    const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);
    const step=m.speed*dt;
    m.angle=Math.atan2(dy,dx);
    if(d<=step+6){
      m.life=0;
      explodeMissile(m);
    }else{
      m.x+=dx/d*step;m.y+=dy/d*step;
      if(Math.random()<dt*40)
        game.parts.push({x:m.x,y:m.y,vx:-Math.cos(m.angle)*40,vy:-Math.sin(m.angle)*40,
          life:0.3,max:0.3,size:4,color:'#FF8A5B',drag:0.9});
    }
  }
  game.projectiles=game.projectiles.filter(m=>m.life>0);

  // 波次完成
  if(game.waveActive&&game.spawnQueue.length===0&&game.enemies.length===0){
    game.waveActive=false;
    const bonus=60+game.wave*8+game.bounty;
    game.coins+=bonus;game.score+=bonus;
    flashText(960,300,'波次奖励 +'+bonus,'#FFD166');
    setBanner('波次完成','#7CFFB2');
    SFX.play('coin');
    if(game.wave>=20){
      game.screen='win';
      save.highScore=Math.max(save.highScore,game.score);persist();
      SFX.play('victory');
    }else if(game.wave%5===0){
      openRewards();
    }else{
      game.countdown=10;
    }
  }
}

function openRewards(){
  const keys=Object.keys(REWARDS);
  for(let i=keys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=keys[i];keys[i]=keys[j];keys[j]=t;}
  game.rewardChoices=keys.slice(0,3);
  game.rewardPending=true;
  setBanner('🎁 选择一项奖励','#FFD166');
  SFX.play('gift');
}
function takeReward(id){
  const R=REWARDS[id];
  if(!R)return;
  R.apply();
  game.rewardPending=false;
  game.countdown=9;
  setBanner('获得：'+R.name,R.color);
  SFX.play('upgrade');
}

}

function hexPath(x,y,r,rotA){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*TAU+(rotA||0);
    const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}

function drawTowerHead(t,def){
  const col=def.color;
  ctx.save();
  if(t.type==='laser'){
    ctx.rotate(t.angle);
    ctx.beginPath();
    ctx.moveTo(30,0);ctx.lineTo(-14,-15);ctx.lineTo(-6,0);ctx.lineTo(-14,15);
    ctx.closePath();
    ctx.fillStyle=col;ctx.globalAlpha=0.85;ctx.fill();
  }else if(t.type==='missile'){
    ctx.rotate(t.angle);
    ctx.fillStyle=col;ctx.globalAlpha=0.85;
    ctx.fillRect(-16,-16,26,32);
    ctx.fillStyle='#FF8A5B';ctx.fillRect(10,-9,12,18);
  }else if(t.type==='poison'){
    ctx.rotate(t.angle);
    ctx.fillStyle=col;ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.moveTo(31,0);
    ctx.quadraticCurveTo(19,-11,4,-10);
    ctx.lineTo(-8,-14);ctx.lineTo(-17,-9);ctx.lineTo(-17,9);ctx.lineTo(-8,14);
    ctx.lineTo(4,10);
    ctx.quadraticCurveTo(19,11,31,0);
    ctx.closePath();ctx.fill();
    const dp=0.5+0.5*Math.sin(game.time*4+t.rotor);
    ctx.beginPath();ctx.arc(32,0,4+dp*3.5,0,TAU);ctx.fill();
  }else if(t.type==='ice'){
    ctx.rotate(t.rotor*0.4);
    ctx.strokeStyle=col;ctx.globalAlpha=0.8;ctx.lineWidth=5;
    for(let i=0;i<3;i++){
      ctx.rotate(TAU/3);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(26,0);
      ctx.moveTo(16,0);ctx.lineTo(22,-7);
      ctx.moveTo(16,0);ctx.lineTo(22,7);
      ctx.stroke();
    }
  }else if(t.type==='fire'){
    const pulse=0.6+0.4*Math.sin(game.time*6+t.rotor);
    ctx.rotate(t.rotor*0.6);
    for(let i=0;i<8;i++){
      const a=i/8*TAU;
      const l=22+pulse*11;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10);
      ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l);
      ctx.strokeStyle=i%2?'#FFD166':'#FF8A5B';ctx.globalAlpha=0.85;ctx.lineWidth=4;
      ctx.stroke();
    }
  }else if(t.type==='tesla'){
    ctx.rotate(t.rotor*0.5);
    ctx.strokeStyle=col;ctx.globalAlpha=0.85;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,23,0,TAU);ctx.stroke();
    for(let i=0;i<4;i++){
      const a=i/4*TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);
      ctx.lineTo(Math.cos(a)*28,Math.sin(a)*28);
      ctx.stroke();
    }
  }else if(t.type==='gravity'){
    ctx.rotate(t.rotor*0.6);
    for(let i=0;i<3;i++){
      ctx.save();ctx.rotate(i*TAU/3);
      ctx.beginPath();ctx.ellipse(0,0,27,11,0,0,TAU);
      ctx.strokeStyle=col;ctx.globalAlpha=0.8;ctx.lineWidth=3;ctx.stroke();
      ctx.restore();
    }
  }else if(t.type==='repair'){
    ctx.rotate(t.rotor*0.5);
    ctx.strokeStyle=col;ctx.globalAlpha=0.75;ctx.lineWidth=5;
    for(let i=0;i<4;i++){
      const a=i/4*TAU+Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18);
      ctx.lineTo(Math.cos(a)*27,Math.sin(a)*27);
      ctx.stroke();
    }
  }
  ctx.restore();

  ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(0,0,19,0,TAU);
  ctx.fillStyle='rgba(11,13,18,0.94)';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.stroke();
  ctx.font='700 '+(22)+'px '+UI_FONT;

    ctx.fillStyle='#FFD166';
    ctx.fillRect(-16+i*12,27,8,5);
  }
}

function drawEnemyBody(e,body,edge,P){
  const t=e.type;
  if(t==='scout'){
    ctx.beginPath();
    ctx.moveTo(8,-6);ctx.lineTo(-12,-21);ctx.lineTo(-25,-21);ctx.lineTo(-15,-5);
    ctx.closePath();
    ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8,6);ctx.lineTo(-12,21);ctx.lineTo(-25,21);ctx.lineTo(-15,5);
    ctx.closePath();
    ctx.fillStyle=body;ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(25,0);
    ctx.quadraticCurveTo(13,-10,-3,-8);
    ctx.lineTo(-17,-6);ctx.lineTo(-21,0);ctx.lineTo(-17,6);
    ctx.lineTo(-3,8);
    ctx.quadraticCurveTo(13,10,25,0);
    ctx.closePath();
    ctx.fillStyle=body;ctx.fill();
    ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.ellipse(5,0,9,5.5,0,0,TAU);
    ctx.fillStyle=P?'#2E8B3D':'#55F7FF';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.stroke();
    const eg=ctx.createRadialGradient(-23,0,1,-23,0,13);
    eg.addColorStop(0,'rgba(255,255,255,0.95)');
    eg.addColorStop(1,P?'rgba(141,255,60,0)':'rgba(85,247,255,0)');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(-23,0,13,0,TAU);ctx.fill();
  }
  else if(t==='heavy'){                 /* ★ 重甲：装甲板 + 铆钉 */
    hexPath(0,0,27,Math.PI/6);
    ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle=P?'#2E8B3D':'#F2F7FF';ctx.lineWidth=4.5;ctx.stroke();
    hexPath(0,0,18,Math.PI/6);
    ctx.fillStyle='rgba(11,13,18,0.55)';ctx.fill();
    ctx.strokeStyle=edge;ctx.lineWidth=2.5;ctx.stroke();
    for(let i=0;i<6;i++){
      const a=i/6*TAU;
      ctx.fillStyle=P?'#2E8B3D':'#FFD166';
      ctx.beginPath();ctx.arc(Math.cos(a)*22.5,Math.sin(a)*22.5,3.6,0,TAU);ctx.fill();
    }
    ctx.fillStyle='rgba(11,13,18,0.5)';
    ctx.fillRect(-9,-17,18,34);
    const cg=ctx.createRadialGradient(0,0,1,0,0,14);
    cg.addColorStop(0,'rgba(255,220,150,0.95)');
    cg.addColorStop(1,'rgba(255,209,102,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();
  }
  else if(t==='wraith'){
    ctx.beginPath();
    ctx.moveTo(22,0);ctx.lineTo(0,-16);ctx.lineTo(-18,0);ctx.lineTo(0,16);
    ctx.closePath();
    ctx.fillStyle=P?'rgba(95,216,107,0.6)':'rgba(185,124,255,0.55)';ctx.fill();
    ctx.strokeStyle=P?'#5FD86B':'#B97CFF';ctx.lineWidth=2.5;
    ctx.setLineDash([7,6]);ctx.lineDashOffset=-game.time*30;ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#F2F7FF';ctx.beginPath();ctx.arc(4,0,5,0,TAU);ctx.fill();
  }
  else if(t==='swift'){                 /* ★ 疾速：细长飞梭 */
    ctx.beginPath();
    ctx.moveTo(31,0);ctx.lineTo(-4,-11);ctx.lineTo(-22,-5);ctx.lineTo(-13,0);
    ctx.lineTo(-22,5);ctx.lineTo(-4,11);
    ctx.closePath();
    ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle=P?'#5FD86B':'#7CFFB2';ctx.lineWidth=2.4;
    const al=ctx.globalAlpha;
    ctx.globalAlpha=al*0.85;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(-22-i*3,-8+i*8);ctx.lineTo(-42-i*9,-8+i*8);ctx.stroke();
    }
    ctx.globalAlpha=al;
    ctx.beginPath();ctx.ellipse(11,0,7,4.5,0,0,TAU);
    ctx.fillStyle=P?'#2E8B3D':'#F2F7FF';ctx.fill();
  }
  else if(t==='reviver'){               /* ★ 复活：绿色核心 + 复活环 */
    const pulse=0.5+0.5*Math.sin(game.time*5+e.wobble);
    ctx.beginPath();ctx.arc(0,0,21,0,TAU);
    ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle=P?'#2E8B3D':'#F2F7FF';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='rgba(11,13,18,0.5)';ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(-13,-9);ctx.lineTo(-2,-1);ctx.lineTo(-10,8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(9,-13);ctx.lineTo(2,-2);ctx.lineTo(12,7);ctx.stroke();
    const g=ctx.createRadialGradient(0,0,1,0,0,15+pulse*5);
    g.addColorStop(0,'rgba(226,255,205,'+(0.72+pulse*0.28)+')');
    g.addColorStop(1,'rgba(141,255,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,17,0,TAU);ctx.fill();
    for(let i=0;i<e.revives;i++){
      const a=i*2.2+game.time*0.6;
      ctx.strokeStyle='rgba(141,255,60,0.9)';ctx.lineWidth=2.2;
      ctx.beginPath();ctx.arc(Math.cos(a)*31,Math.sin(a)*31,5.2,0,TAU);ctx.stroke();
    }
    if(e.reviveT>0){
      const p=1-e.reviveT/1.15;
      ctx.strokeStyle='rgba(141,255,60,'+(1-p*0.85)+')';ctx.lineWidth=4.5;
      ctx.beginPath();ctx.arc(0,0,18+p*86,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(226,255,205,0.9)';
      ctx.font='700 26px '+UI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✚',0,-38);
    }
  }
  else if(t==='bomber'){
    const pulse=0.5+0.5*Math.sin(game.time*8+e.wobble);
    ctx.beginPath();ctx.arc(0,0,18,0,TAU);
    ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle=P?'#2E8B3D':'#F2F7FF';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(255,91,114,'+(0.45+pulse*0.55)+')';
    ctx.beginPath();ctx.arc(0,0,10+pulse*3,0,TAU);ctx.fill();
  }
  else{                                  /* 母舰 */
    for(let i=0;i<3;i++){
      hexPath(0,0,48+i*16,game.time*0.25*(i%2?1:-1));
      ctx.strokeStyle=i===0?body:'rgba(255,91,114,0.32)';
      ctx.lineWidth=i===0?5:3;ctx.stroke();
    }
    const g=ctx.createRadialGradient(-12,-12,6,0,0,46);
    g.addColorStop(0,P?'#22351F':'#4A2231');g.addColorStop(1,'#1B2130');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,44,0,TAU);ctx.fill();
    for(let i=0;i<4;i++){
      const a=i/4*TAU+game.time*0.6;
      ctx.fillStyle='rgba(185,124,255,0.9)';
      ctx.beginPath();ctx.arc(Math.cos(a)*58,Math.sin(a)*58,8,0,TAU);ctx.fill();
    }
    const weak=0.6+0.4*Math.sin(game.time*4);
    const cg=ctx.createRadialGradient(0,0,2,0,0,26);
    cg.addColorStop(0,'rgba(255,255,255,'+weak+')');
    cg.addColorStop(1,P?'rgba(95,216,107,0)':'rgba(255,91,114,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.fill();
    ctx.fillStyle=body;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();
    ctx.strokeStyle=P?'#2E8B3D':'#F2F7FF';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.moveTo(0,-14);ctx.lineTo(0,14);ctx.stroke();
  }
}
function drawEnemies(){
  for(const e of game.enemies){
    const hidden=e.stealth&&!e.revealed;
    const P=e.poisonT>0;
    const body=P?'#5FD86B':e.color;
    const edge=P?'#2E8B3D':'#55F7FF';
    ctx.save();
    for(const tr of e.trail){
      const a=tr.life/tr.max;
      ctx.globalAlpha=(hidden?0.2:1)*a*0.55;
      ctx.fillStyle=P?'#8DFF3C':'#FF8A5B';
      const s=e.r*0.85*a+2;
      ctx.beginPath();ctx.arc(tr.x,tr.y,s,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=hidden?0.26:1;

    ctx.translate(e.x,e.y);
    const wob=Math.sin(e.wobble)*0.12;
    ctx.rotate(e.ang+wob);

    if(e.hitFlash>0){
      const fg=ctx.createRadialGradient(0,0,2,0,0,e.r*2.4);
      fg.addColorStop(0,'rgba(255,255,255,0.8)');
      fg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,e.r*2.4,0,TAU);ctx.fill();
    }
    drawEnemyBody(e,body,edge,P);
    ctx.restore();

    if(e.hp<e.maxHp&&!e.def.boss){
      const w=e.r*2.2;
      ctx.fillStyle='rgba(11,13,18,0.75)';
      ctx.fillRect(e.x-w/2,e.y-e.r-14,w,5);
      ctx.fillStyle=e.hp/e.maxHp>0.35?'#7CFFB2':'#FF5B72';
      ctx.fillRect(e.x-w/2,e.y-e.r-14,w*clamp(e.hp/e.maxHp,0,1),5);
    }
    if(e.slowT>0&&e.slow<1){
      ctx.strokeStyle='rgba(143,216,255,0.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+7,0,TAU);ctx.stroke();
    }
    if(e.vulnT>0&&e.vuln>0){
      ctx.strokeStyle='rgba(255,209,102,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+11,0,TAU);ctx.stroke();
    }
    if(e.burnT>0){
      ctx.strokeStyle='rgba(255,138,91,0.7)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,TAU);ctx.stroke();
    }
    if(e.poisonT>0){
      const pg=ctx.createRadialGradient(e.x,e.y,e.r*0.5,e.x,e.y,e.r*2.1);
      pg.addColorStop(0,'rgba(141,255,60,0.16)');
      pg.addColorStop(1,'rgba(141,255,60,0)');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(e.x,e.y,e.r*2.1,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(141,255,60,0.85)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+13,0,TAU);ctx.stroke();
    }
  }
}
function drawEffects(){
  for(const b of game.beams){
    const a=clamp(b.life/b.max,0,1);
    ctx.save();
    ctx.globalAlpha=a;
    if(b.branch){
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w+6;ctx.globalAlpha=a*0.22;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.globalAlpha=a;
      const seg=7;
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w;
      ctx.beginPath();
      for(let i=0;i<=seg;i++){
        const t=i/seg;
        const px=lerp(b.x1,b.x2,t)+(i===0||i===seg?0:rand(-14,14));
        const py=lerp(b.y1,b.y2,t)+(i===0||i===seg?0:rand(-14,14));
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.stroke();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=1.6;ctx.stroke();
    }else{
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w+7;ctx.globalAlpha=a*0.22;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.globalAlpha=a;
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.4;ctx.stroke();
    }
    ctx.restore();
  }
  for(const r of game.rings){
    const a=clamp(r.life/r.max2,0,1);
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=r.color;ctx.lineWidth=r.w;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
    ctx.restore();
  }
  for(const p of game.parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a*0.95;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  for(const f of game.floats){
    const a=clamp(f.life/f.max,0,1);
    ctx.globalAlpha=a;
    ctx.font='700 26px '+UI_FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(11,13,18,0.85)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function drawLaunchFx(){
  if(game.launchFx<=0||game.launchFx>=1)return;
  const t=game.launchFx;
  const d=t*pathLen*0.42;
  for(let i=22;i>=0;i--){
    const dd=Math.max(0,d-i*20);
    const q=posAt(dd);
    const a=(1-i/22)*0.85;
    const g=ctx.createRadialGradient(q.x,q.y,1,q.x,q.y,26);
    g.addColorStop(0,'rgba(242,247,255,'+a+')');
    g.addColorStop(1,'rgba(85,247,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,26,0,TAU);ctx.fill();
  }
  const p=posAt(d);
  const gg=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,70);
  gg.addColorStop(0,'rgba(255,255,255,0.95)');
  gg.addColorStop(0.4,'rgba(85,247,255,0.55)');
  gg.addColorStop(1,'rgba(85,247,255,0)');
  ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,70,0,TAU);ctx.fill();
}

/* =========================================================
   14. UI（屏幕坐标系）
   ========================================================= */
function statBlock(x,cy,ch,value,color){
  const r=14*k;
  ctx.beginPath();ctx.arc(x+r,cy,r,0,TAU);
  ctx.fillStyle=color+'22';ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=color;ctx.font='700 '+(15*k)+'px '+UI_FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ch,x+r,cy+1);
  const tx=x+r*2+8*k;
  const size=2.3*k;
  pixText(String(value),tx,cy-8*k,size,'#F2F7FF');
  return (tx-x)+pixWidth(String(value),size)+18*k;
}
function button(x,y,w,h,label,act,o){
  o=o||{};
  const r=Math.min(10*k,h/2);
  roundRect(x,y,w,h,r);
  ctx.fillStyle=o.active?'rgba(85,247,255,0.24)':(o.bg||'rgba(27,33,48,0.92)');
  ctx.fill();
  ctx.strokeStyle=o.color||'rgba(132,144,168,0.55)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=o.tcolor||'#F2F7FF';
  ctx.font='700 '+(o.fs||15*k)+'px '+UI_FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+1);
  if(act)game.ui.push({x,y,w,h,act});
  return {x,y,w,h};
}
function drawUI(){
  game.ui=[];
  /* 顶栏 */
  ctx.fillStyle='rgba(11,13,18,0.94)';ctx.fillRect(0,0,W,topH);
  ctx.strokeStyle='rgba(85,247,255,0.22)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,topH-1);ctx.lineTo(W,topH-1);ctx.stroke();
  game.ui.push({x:0,y:0,w:W,h:topH,act:'block'});

  const cy=topH/2;
  let x=12*k;
  x+=statBlock(x,cy,'金',game.coins,'#FFD166');
  x+=statBlock(x,cy,'命',game.lives,'#FF5B72');
  x+=statBlock(x,cy,'波',game.wave+'/20','#55F7FF');
  if(W>560)x+=statBlock(x,cy,'分',game.score,'#B97CFF');

  /* 右侧按钮 */
  const bw=Math.max(38,42*k),bh=Math.max(26,topH-16*k),by=(topH-bh)/2;
  let rx=W-10*k;
  rx-=bw+6*k;
  button(rx,by,bw,bh,game.muted?'✕':'♪','mute',{fs:16*k});
  rx-=bw+6*k;
  button(rx,by,bw,bh,game.speed+'x','speed',{active:game.speed>1,fs:14*k});
  if(!game.waveActive&&!game.rewardPending&&game.screen==='playing'){
    rx-=Math.max(84,104*k)+6*k;
    button(rx,by,Math.max(84,104*k),bh,game.countdown>0?'出战 '+Math.ceil(game.countdown):'出战','next',
      {color:'#55F7FF',tcolor:'#55F7FF',fs:14*k});
  }

  /* 状态提示 */
  const chips=[];
  if(game.freeBuild>0)chips.push({t:'免费建造 ×'+game.freeBuild,c:'#55F7FF'});
  if(game.slowFieldT>0)chips.push({t:'全场减速 '+game.slowFieldT.toFixed(0)+'s',c:'#8FD8FF'});
  if(game.dmgBuff>0)chips.push({t:'伤害 +'+Math.round(game.dmgBuff*100)+'%',c:'#FF8A5B'});
  if(game.hasteBuff>0)chips.push({t:'攻速 +'+Math.round(game.hasteBuff*100)+'%',c:'#B97CFF'});
  if(game.bounty>0)chips.push({t:'赏金 +'+game.bounty,c:'#FFD166'});
  let chy=topH+12*k;
  for(const c of chips){
    ctx.font='600 '+(12*k)+'px '+UI_FONT;
    const w=ctx.measureText(c.t).width+18*k;
    roundRect(W-10*k-w,chy,w,22*k,8*k);
    ctx.fillStyle='rgba(11,13,18,0.8)';ctx.fill();
    ctx.strokeStyle=c.c;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=c.c;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.t,W-10*k-w/2,chy+11*k);
    chy+=26*k;
  }

  /* 底栏：塔商店 */
  ctx.fillStyle='rgba(11,13,18,0.94)';ctx.fillRect(0,H-botH,W,botH);
  ctx.strokeStyle='rgba(85,247,255,0.22)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H-botH+1);ctx.lineTo(W,H-botH+1);ctx.stroke();
  game.ui.push({x:0,y:H-botH,w:W,h:botH,act:'block'});

  const pad=game.sel>=0&&pads[game.sel]?pads[game.sel]:null;
  const canBuild=pad&&!pad.tower;
  const n=TOWER_ORDER.length;
  const gap=6*k,margin=10*k;
  const cw=(W-margin*2-gap*(n-1))/n;
  const chh=botH-22*k;
  const cyc=H-botH+11*k;
  for(let i=0;i<n;i++){
    const type=TOWER_ORDER[i],def=TOWERS[type];
    const cx=margin+i*(cw+gap);
    const free=game.freeBuild>0;
    const afford=game.coins>=def.cost||free;
    roundRect(cx,cyc,cw,chh,10*k);
    ctx.fillStyle=canBuild&&afford?'rgba(85,247,255,0.12)':'rgba(27,33,48,0.92)';
    ctx.fill();
    ctx.strokeStyle=canBuild&&afford?def.color:'rgba(132,144,168,0.4)';
    ctx.lineWidth=canBuild&&afford?2.5:1.6;ctx.stroke();

    const fs=Math.min(19*k,cw*0.42);
    ctx.font='700 '+fs+'px '+UI_FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=afford?def.color:'#5B6478';
    ctx.fillText(def.icon,cx+cw/2,cyc+chh*0.36);
    const cs=Math.min(2.0*k,cw*0.055);
    pixText(String(free?0:def.cost),cx+cw/2,cyc+chh*0.70-7*cs/2,cs,afford?(free?'#55F7FF':'#FFD166'):'#5B6478','center');
    game.ui.push({x:cx,y:cyc,w:cw,h:chh,act:'build:'+type});
  }

  /* 选中塔的操作面板 */
  if(pad&&pad.tower){
    const t=pad.tower,def=TOWERS[t.type];
    const sp=toScreen(t.x,t.y);
    const pw=Math.min(320*k,W-24*k),ph=112*k;
    let px=clamp(sp.x-pw/2,12*k,W-12*k-pw);
    let py=clamp(sp.y-ph-58*k,arena.y+10*k,H-botH-ph-10*k);
    roundRect(px,py,pw,ph,14*k);
    ctx.fillStyle='rgba(15,19,28,0.96)';ctx.fill();
    ctx.strokeStyle=def.color;ctx.lineWidth=2.5;ctx.stroke();

    ctx.fillStyle=def.color;ctx.font='700 '+(17*k)+'px '+UI_FONT;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(def.name+'  LV'+t.level,px+16*k,py+22*k);
    ctx.fillStyle='#7C87A0';ctx.font='500 '+(12*k)+'px '+UI_FONT;
    ctx.fillText('击杀 '+t.kills+'   伤害 '+Math.round(t.damage),px+16*k,py+44*k);

    const bh2=34*k,by2=py+ph-bh2-12*k;
    const canUp=t.level<3;
    const upCost=canUp?upgradeCost(t.type,t.level):0;
    button(px+14*k,by2,pw*0.42,bh2,canUp?('升级 '+upCost):'已满级','upgrade',
      {color:canUp?'#FFD166':'#5B6478',tcolor:canUp?'#FFD166':'#5B6478',fs:14*k});
    button(px+pw*0.52,by2,pw*0.30,bh2,'出售 +'+Math.floor(t.invested*0.7),'sell',
      {color:'#FF8A5B',tcolor:'#FF8A5B',fs:14*k});
    button(px+pw*0.86,by2,pw*0.12,bh2,'✕','close',{fs:14*k});
  }
}
function drawBanner(){
  if(!game.banner)return;
  const a=clamp(game.bannerT/0.5,0,1);
  ctx.globalAlpha=a;
  const y=topH+40*k;
  ctx.font='800 '+(25*k)+'px '+UI_FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const w=Math.min(W-30*k,ctx.measureText(game.banner.text).width+64*k);
  roundRect(W/2-w/2,y-23*k,w,46*k,13*k);
  ctx.fillStyle='rgba(11,13,18,0.88)';ctx.fill();
  ctx.strokeStyle=game.banner.color;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=game.banner.color;

}

/* —— 奖励三选一 —— */
function drawReward(){
  ctx.fillStyle='rgba(6,8,14,0.86)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFD166';ctx.font='800 '+(28*k)+'px '+UI_FONT;
  ctx.fillText('波次奖励 · 选择一项',W/2,H*0.20);
  ctx.fillStyle='#7C87A0';ctx.font='500 '+(14*k)+'px '+UI_FONT;
  ctx.fillText('每 5 波可获得一次强化补给',W/2,H*0.20+34*k);

  const n=game.rewardChoices.length;
  const gap=18*k;
  const cw=Math.min(250*k,(W-40*k-gap*(n-1))/n);
  const chh=Math.min(330*k,H*0.46);
  const total=n*cw+(n-1)*gap;
  let x=W/2-total/2;
  const y=H*0.30;
  for(const id of game.rewardChoices){
    const R=REWARDS[id];
    roundRect(x,y,cw,chh,16*k);
    const g=ctx.createLinearGradient(x,y,x,y+chh);
    g.addColorStop(0,'rgba(30,37,52,0.98)');
    g.addColorStop(1,'rgba(17,21,31,0.98)');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=R.color;ctx.lineWidth=3;ctx.stroke();

    const r=cw*0.26;
    ctx.beginPath();ctx.arc(x+cw/2,y+chh*0.26,r,0,TAU);
    ctx.fillStyle=R.color+'26';ctx.fill();
    ctx.strokeStyle=R.color;ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle=R.color;ctx.font='700 '+(r*1.1)+'px '+UI_FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(R.ch,x+cw/2,y+chh*0.26+2);

    ctx.fillStyle='#F2F7FF';ctx.font='700 '+(18*k)+'px '+UI_FONT;
    ctx.fillText(R.name,x+cw/2,y+chh*0.52);
    wrapText(R.desc,x+cw/2,y+chh*0.62,cw-28*k,20*k,'#9BA6BC','500 '+(13*k)+'px '+UI_FONT,'center');

    roundRect(x+cw*0.18,y+chh-52*k,cw*0.64,36*k,10*k);
    ctx.fillStyle=R.color+'26';ctx.fill();
    ctx.strokeStyle=R.color;ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle=R.color;ctx.font='700 '+(15*k)+'px '+UI_FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('选择',x+cw/2,y+chh-34*k);

    game.ui.push({x,y,w:cw,h:chh,act:'reward:'+id});
    x+=cw+gap;
  }
}

/* =========================================================
   15. 标题 / 结算
   ========================================================= */
function drawMiniPath(raw,x,y,w,h,color){
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of raw){
    if(p.x<minx)minx=p.x;if(p.x>maxx)maxx=p.x;
    if(p.y<miny)miny=p.y;if(p.y>maxy)maxy=p.y;
  }
  const s=Math.min(w/Math.max(1,maxx-minx),h/Math.max(1,maxy-miny));
  const ox=x+(w-(maxx-minx)*s)/2-minx*s;
  const oy=y+(h-(maxy-miny)*s)/2-miny*s;
  ctx.beginPath();
  for(let i=0;i<raw.length;i++){
    const px=raw[i].x*s+ox,py=raw[i].y*s+oy;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
}
function drawTitle(){
  game.ui=[];
  ctx.fillStyle='#0B0D12';ctx.fillRect(0,0,W,H);
  for(const s of STARS){
    const tw=0.55+0.45*Math.sin(game.time*s.s+s.ph);
    ctx.globalAlpha=s.a*tw*0.8;
    ctx.fillStyle=s.r>1.5?'#F2F7FF':'#8490A8';
    ctx.fillRect((s.x/1920)*W,(s.y/1080)*H,s.r*1.4,s.r*1.4);
  }
  ctx.globalAlpha=1;
  const neb=ctx.createRadialGradient(W*0.5,H*0.32,10,W*0.5,H*0.32,Math.max(W,H)*0.6);
  neb.addColorStop(0,'rgba(85,247,255,0.13)');
  neb.addColorStop(1,'rgba(85,247,255,0)');
  ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
  const neb2=ctx.createRadialGradient(W*0.22,H*0.78,10,W*0.22,H*0.78,Math.max(W,H)*0.5);
  neb2.addColorStop(0,'rgba(185,124,255,0.13)');
  neb2.addColorStop(1,'rgba(185,124,255,0)');
  ctx.fillStyle=neb2;ctx.fillRect(0,0,W,H);

  const ts=Math.min(4.6*k,Math.min(W/240,7));
  pixText('NEBULA',W/2,H*0.10,ts,'#55F7FF','center');
  pixText('DEFENSE',W/2,H*0.10+ts*9,ts,'#B97CFF','center');
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#F2F7FF';ctx.font='800 '+(30*k)+'px '+UI_FONT;
  ctx.fillText('星 际 塔 防',W/2,H*0.10+ts*19);

  /* 地图选择 */
  const my=H*0.42;
  ctx.fillStyle='#7C87A0';ctx.font='600 '+(15*k)+'px '+UI_FONT;
  ctx.fillText('选 择 赛 道',W/2,my-42*k);
  const n=MAP_ORDER.length;
  const gap=12*k;
  const cw=Math.min(190*k,(W-40*k-gap*(n-1))/n);
  const chh=Math.min(150*k,H*0.19);
  const total=n*cw+(n-1)*gap;
  let x=W/2-total/2;
  for(const id of MAP_ORDER){
    const m=MAPS[id];
    const active=game.map===id;
    roundRect(x,my,cw,chh,14*k);
    ctx.fillStyle=active?'rgba(85,247,255,0.16)':'rgba(27,33,48,0.9)';
    ctx.fill();
    ctx.strokeStyle=active?'#55F7FF':'rgba(132,144,168,0.42)';
    ctx.lineWidth=active?3:1.6;ctx.stroke();
    drawMiniPath(m.raw,x+14*k,my+14*k,cw-28*k,chh*0.52,active?'#55F7FF':'#6C7891');
    ctx.fillStyle=active?'#55F7FF':'#F2F7FF';
    ctx.font='700 '+(17*k)+'px '+UI_FONT;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.name,x+cw/2,my+chh*0.70);
    ctx.fillStyle='#7C87A0';ctx.font='500 '+(12*k)+'px '+UI_FONT;
    ctx.fillText(m.desc,x+cw/2,my+chh*0.86);
    game.ui.push({x,y:my,w:cw,h:chh,act:'map:'+id});
    x+=cw+gap;
  }

  /* 开始按钮 */
  const bw=Math.min(320*k,W-60*k),bh=62*k;
  button(W/2-bw/2,my+chh+34*k,bw,bh,'开 始 游 戏','startgame',
    {color:'#55F7FF',tcolor:'#55F7FF',fs:22*k,bg:'rgba(85,247,255,0.14)'});

  ctx.fillStyle='#5B6478';ctx.font='500 '+(13*k)+'px '+UI_FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('最高分 '+save.highScore+'   ·   最佳波次 '+save.bestWave,W/2,my+chh+124*k);
  ctx.fillText('轻触空地选择建造点 · 底部选择塔型建造 · 每 5 波可领取奖励',W/2,my+chh+150*k);

  button(W-10*k-46*k,12*k,46*k,32*k,save.muted?'✕':'♪','mute',{fs:15*k});
}
function drawEnd(){
  ctx.fillStyle='rgba(6,8,14,0.86)';ctx.fillRect(0,0,W,H);
  const win=game.screen==='win';
  const pw=Math.min(460*k,W-40*k),ph=Math.min(420*k,H*0.7);
  const px=W/2-pw/2,py=H/2-ph/2;
  roundRect(px,py,pw,ph,20*k);
  const g=ctx.createLinearGradient(px,py,px,py+ph);
  g.addColorStop(0,'rgba(30,37,52,0.98)');
  g.addColorStop(1,'rgba(15,19,28,0.98)');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=win?'#FFD166':'#FF5B72';ctx.lineWidth=3;ctx.stroke();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=win?'#FFD166':'#FF5B72';
  ctx.font='800 '+(32*k)+'px '+UI_FONT;
  ctx.fillText(win?'防 御 成 功':'基 地 失 守',W/2,py+56*k);

  ctx.fillStyle='#7C87A0';ctx.font='600 '+(15*k)+'px '+UI_FONT;
  ctx.fillText('本局得分',W/2,py+110*k);
  pixText(String(game.score),W/2,py+126*k,4.2*k,'#F2F7FF','center');

  const rows=[['消灭敌人',game.kills],['到达波次',game.wave+'/20'],['历史最高',save.highScore]];
  let ry=py+210*k;
  for(const r of rows){
    ctx.fillStyle='#7C87A0';ctx.font='500 '+(14*k)+'px '+UI_FONT;
    ctx.textAlign='left';ctx.fillText(r[0],px+40*k,ry);
    ctx.fillStyle='#F2F7FF';ctx.textAlign='right';
    ctx.font='700 '+(16*k)+'px '+UI_FONT;ctx.fillText(String(r[1]),px+pw-40*k,ry);
    ry+=32*k;
  }
  button(px+34*k,py+ph-96*k,pw*0.44,52*k,'再来一局','restart',{color:'#55F7FF',tcolor:'#55F7FF',fs:17*k});
  button(px+pw*0.56,py+ph-96*k,pw*0.36,52*k,'选择地图','title',{fs:17*k});
}

/* =========================================================
   16. 输入
   ========================================================= */
function doAction(act){
  if(!act||act==='block')return;
  if(act.indexOf('build:')===0){
    const type=act.slice(6);
    const pad=game.sel>=0&&pads[game.sel]?pads[game.sel]:null;
    if(!pad){setBanner('请先选择一个建造点','#FF5B72');SFX.play('deny');return;}
    if(pad.tower){setBanner('该位置已有防御塔','#FF5B72');SFX.play('deny');return;}
    buildTower(pad,type);
    return;
  }
  if(act.indexOf('reward:')===0){takeReward(act.slice(7));return;}
  if(act.indexOf('map:')===0){
    game.map=act.slice(4);save.map=game.map;persist();
    buildPath();buildPads();SFX.play('ui');
    return;
  }
  switch(act){
    case 'speed': game.speed=game.speed>=3?1:game.speed+1;SFX.play('ui');break;
    case 'mute': SFX.setMuted(!SFX.muted);SFX.play('ui');break;
    case 'next': startWave(true);break;
    case 'upgrade':{
      const pad=game.sel>=0&&pads[game.sel]?pads[game.sel]:null;
      if(pad&&pad.tower)upgradeTower(pad);
      break;}
    case 'sell':{
      const pad=game.sel>=0&&pads[game.sel]?pads[game.sel]:null;
      if(pad&&pad.tower){sellTower(pad);game.sel=-1;}
      break;}
    case 'close': game.sel=-1;SFX.play('ui');break;
    case 'startgame': resetGame();SFX.play('ui');break;
    case 'restart': resetGame();SFX.play('ui');break;
    case 'title': game.screen='title';game.sel=-1;SFX.play('ui');break;
  }
}
function handleTap(sx,sy){
  SFX.ensure();
  for(let i=game.ui.length-1;i>=0;i--){
    const b=game.ui[i];
    if(sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h){
      doAction(b.act);return;
    }
  }
  if(game.screen!=='playing'||game.rewardPending)return;
  if(sy<arena.y||sy>arena.y+arena.h)return;
  const w=toWorld(sx,sy);
  let best=-1,bd=54;
  for(const p of pads){
    const d=Math.hypot(p.x-w.x,p.y-w.y);
    if(d<bd){bd=d;best=p.idx;}
  }
  if(best>=0){
    game.sel=(game.sel===best?-1:best);
    SFX.play('ui');
    const pad=pads[best];
    if(game.sel===best&&!pad.tower)setBanner('选择塔型进行建造','#55F7FF');
  }else{
    game.sel=-1;
  }
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  handleTap(e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});

/* =========================================================
   17. 主循环
   ========================================================= */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0B0D12';ctx.fillRect(0,0,W,H);
  if(game.screen==='title'){drawTitle();return;}
  drawWorld();
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  drawUI();
  drawBanner();
  if(game.rewardPending){game.ui=[];drawReward();}
  if(game.screen==='over'||game.screen==='win'){game.ui=[];drawEnd();}
  if(game.flash>0){
    ctx.fillStyle='rgba(255,91,114,'+(game.flash*0.30)+')';
    ctx.fillRect(0,0,W,H);
  }
}

const STEP=1/60;
let last=0,acc=0;
function frame(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.25)dt=0.25;
  acc+=dt*game.speed;
  let guard=0;
  while(acc>=STEP&&guard<12){update(STEP);acc-=STEP;guard++;}
  if(guard>=12)acc=0;
  render();
  requestAnimationFrame(frame);
}

resize();
buildPath();buildPads();
requestAnimationFrame(frame);

})();
</script>
