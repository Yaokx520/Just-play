function pixWidth(str,size){let w=0;for(const ch of str)w+=((FONT[ch]?5:3)+1)*size;return w-size;}
function pixText(str,x,y,size,color,align){
  str=String(str);
  let sx=x;
  const total=pixWidth(str,size);
  if(align==='center')sx=x-total/2;
  else if(align==='right')sx=x-total;
  ctx.fillStyle=color;
  for(const ch of str){
    const g=FONT[ch.toUpperCase()];
    if(g){
      for(let r=0;r<7;r++){const row=g[r];
        for(let c=0;c<5;c++){ if(row[c]==='1') ctx.fillRect(sx+c*size,y+r*size,size,size); }}
      sx+=6*size;
    }else sx+=4*size;
  }
  return total;
}

/* =========================================================
   3. 合成音效（Web Audio）
   ========================================================= */
const SFX={
  ac:null,master:null,muted:!!save.muted,
  ensure(){
    if(!this.ac){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=this.muted?0:0.42;
      this.master.connect(this.ac.destination);
    }
    if(this.ac.state==='suspended'){try{this.ac.resume();}catch(e){}}
  },
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.42;save.muted=m;persist();},
  tone(type,f,d,to,g){
    if(!this.ac||this.muted)return;
    const t=this.ac.currentTime,o=this.ac.createOscillator(),gn=this.ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+d);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(g||0.12,t+0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn);gn.connect(this.master);o.start(t);o.stop(t+d+0.03);
  },
  noise(d,f,g,filter){
    if(!this.ac||this.muted)return;
    const c=this.ac,t=c.currentTime,len=Math.max(1,Math.floor(c.sampleRate*d));
    const buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource();src.buffer=buf;
    const flt=c.createBiquadFilter();flt.type=filter||'lowpass';flt.frequency.setValueAtTime(f||900,t);
    const gn=c.createGain();gn.gain.setValueAtTime(g||0.18,t);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(flt);flt.connect(gn);gn.connect(this.master);src.start(t);
  },
  play(n){
    this.ensure();
    if(!this.ac||this.muted)return;
    switch(n){
      case 'laser': this.tone('sine',1300,0.07,620,0.075); break;
      case 'missile': this.tone('sawtooth',260,0.18,90,0.10); this.noise(0.12,1600,0.06,'bandpass'); break;
      case 'zap': this.tone('square',880,0.11,220,0.075); this.noise(0.10,2600,0.07,'highpass'); break;
      case 'ice': this.tone('sine',720,0.16,1500,0.055); break;
      case 'boom': this.noise(0.34,420,0.24,'lowpass'); this.tone('triangle',150,0.22,52,0.13); break;
      case 'bigboom': this.noise(0.62,320,0.32,'lowpass'); this.tone('triangle',110,0.5,40,0.18); break;
      case 'coin': this.tone('triangle',720,0.07,1180,0.10); this.tone('triangle',1180,0.08,1620,0.06); break;
      case 'build': this.tone('square',300,0.12,760,0.10); this.tone('sine',520,0.14,1040,0.07); break;
      case 'upgrade': this.tone('square',420,0.10,900,0.09); this.tone('square',620,0.14,1320,0.08); break;
      case 'sell': this.tone('triangle',620,0.12,300,0.10); break;
      case 'hurt': this.tone('sawtooth',190,0.32,62,0.16); this.noise(0.22,600,0.12,'lowpass'); break;
      case 'wave': this.tone('square',330,0.11,440,0.10); this.tone('square',494,0.16,660,0.09); break;
      case 'launch': this.tone('sawtooth',180,0.30,1200,0.11); this.tone('sine',240,0.36,1400,0.08); break;
      case 'ui': this.tone('square',600,0.045,760,0.055); break;
      case 'deny': this.tone('square',180,0.10,120,0.09); break;
      case 'victory': [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone('square',f,0.22,f*1.01,0.10),i*110)); break;
    }
  }
};

/* =========================================================
   4. 布局（响应式 / 竖屏旋转）
   ========================================================= */
let k=1,topH=58,botH=86;
let arena={x:0,y:0,w:0,h:0},rot=0,vscale=1;
function computeLayout(){
  k=clamp(Math.min(W/1100,H/720),0.72,1.5);
  topH=58*k;botH=86*k;
  if(H<430){topH*=0.82;botH*=0.82;}
  arena={x:0,y:topH,w:W,h:Math.max(90,H-topH-botH)};
  const portrait=arena.h>arena.w*1.05;
  rot=portrait?-Math.PI/2:0;
  vscale=portrait?Math.min(arena.w/1080,arena.h/1920):Math.min(arena.w/1920,arena.h/1080);
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  computeLayout();buildVignette();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

function toScreen(wx,wy){
  const cx=arena.x+arena.w/2,cy=arena.y+arena.h/2;
  let x=(wx-960)*vscale,y=(wy-540)*vscale;
  if(rot){const c=Math.cos(rot),s=Math.sin(rot);const nx=x*c-y*s,ny=x*s+y*c;x=nx;y=ny;}
  return {x:cx+x,y:cy+y};
}
function toWorld(sx,sy){
  const cx=arena.x+arena.w/2,cy=arena.y+arena.h/2;
  let x=(sx-cx)/vscale,y=(sy-cy)/vscale;
  if(rot){const c=Math.cos(rot),s=Math.sin(rot);const nx=x*c+y*s,ny=-x*s+y*c;x=nx;y=ny;}
  return {x:x+960,y:y+540};
}

/* =========================================================
   5. 路径与地图
   ========================================================= */
const PATH_RAW=[
  {x:0,y:300},{x:430,y:300},{x:430,y:620},{x:1000,y:620},
  {x:1000,y:300},{x:1520,y:300},{x:1520,y:720},{x:1920,y:720}
];
let pathPts=[],pathCum=[],pathLen=0;
function roundPath(pts,radius){
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const d0=Math.hypot(p1.x-p0.x,p1.y-p0.y),d1=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const r=Math.min(radius,d0*0.45,d1*0.45);
    const a={x:p1.x+(p0.x-p1.x)*(r/d0),y:p1.y+(p0.y-p1.y)*(r/d0)};
    const b={x:p1.x+(p2.x-p1.x)*(r/d1),y:p1.y+(p2.y-p1.y)*(r/d1)};
    out.push(a);
    for(let t=1;t<=10;t++){
      const u=t/10,iu=1-u;
      out.push({x:iu*iu*a.x+2*iu*u*p1.x+u*u*b.x,y:iu*iu*a.y+2*iu*u*p1.y+u*u*b.y});
    }
    out.push(b);
  }
  out.push(pts[pts.length-1]);
  return out;
}
function buildPath(){
  pathPts=roundPath(PATH_RAW,70);
  pathCum=[0];let acc=0;
  for(let i=1;i<pathPts.length;i++){
    acc+=Math.hypot(pathPts[i].x-pathPts[i-1].x,pathPts[i].y-pathPts[i-1].y);
    pathCum.push(acc);
  }
  pathLen=acc;
}
function posAt(d){
  d=clamp(d,0,pathLen);
  let lo=0,hi=pathCum.length-1;
  while(lo<hi-1){const mid=(lo+hi)>>1;if(pathCum[mid]<=d)lo=mid;else hi=mid;}
  const span=Math.max(1e-6,pathCum[hi]-pathCum[lo]);
  const t=(d-pathCum[lo])/span;
  const a=pathPts[lo],b=pathPts[hi];
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x)};
}

function resetGame(){

  game.coins=500;game.lives=20;game.wave=0;game.score=0;game.kills=0;

/* =========================================================
   8. 特效工具
   ========================================================= */
function burst(x,y,n,color,spd,life,size){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=rand(0.25,1)*(spd||150);
    game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:life||0.5,max:life||0.5,size:size||rand(2,5),color,drag:0.92});
  }
}
function ring(x,y,maxR,color,life,w){
  game.rings.push({x,y,r:6,max:maxR,life:life||0.65,max2:life||0.65,color,w:w||3});
}
function flashText(x,y,text,color){
  game.floats.push({x,y,text,color,life:0.95,max:0.95,vy:-42});
}
function shake(mag,time){game.shake=Math.max(game.shake,mag);game.shakeT=Math.max(game.shakeT,time||0.18);}

/* =========================================================
   9. 波次
   ========================================================= */
function buildWave(n){
  const q=[];
  const push=(type,count,gap)=>{for(let i=0;i<count;i++)q.push({type,gap});};
  push('scout',4+Math.floor(n*1.15),0.62);
  if(n>=3)push('armor',Math.floor(n/2),1.05);
  if(n>=4)push('wraith',Math.floor((n-1)/3),0.82);
  if(n>=6)push('bomber',Math.floor((n-3)/2),0.88);
  if(n===10||n===20)q.push({type:'boss',gap:1.4});
  return q;
}
function startWave(early){
  if(game.waveActive||game.screen!=='playing')return;
  if(early&&game.countdown>0.2){
    const bonus=Math.floor(game.countdown)*5;
    game.coins+=bonus;game.score+=bonus;
    flashText(1700,180,'+'+bonus,'#FFD166');
  }
  game.wave++;
  game.spawnQueue=buildWave(game.wave);
  game.spawnTimer=0.25;
  game.waveActive=true;
  game.countdown=0;
  SFX.play('wave');
  if(game.wave===1){
    game.launchFx=0.001;
    setBanner('星尘发射','#55F7FF');
    SFX.play('launch');
  }else{
    setBanner('第 '+game.wave+' 波','#FFD166');
  }
  if(game.wave>save.bestWave){save.bestWave=game.wave;persist();}
}
function setBanner(text,color){
  game.banner={text,color};game.bannerT=1.6;
}
function spawnEnemy(type){
  const def=ENEMIES[type];
  const w=game.wave;
  const hpMul=1+(w-1)*0.145;
  const spMul=Math.min(1.32,1+(w-1)*0.022);
  const e={
    type,def,dist:0,hp:def.hp*hpMul,maxHp:def.hp*hpMul,
    speed:def.speed*spMul,baseSpeed:def.speed*spMul,
    r:def.r,color:def.color,stealth:!!def.stealth,revealed:false,
    dead:false,slow:1,slowT:0,trail:[],hitFlash:0,wobble:Math.random()*TAU
  };
  const p=posAt(0);
  e.x=p.x;e.y=p.y;e.ang=p.ang;
  game.enemies.push(e);
  if(def.boss){game.bossRef=e;setBanner('母舰来袭','#FF5B72');shake(5,0.3);SFX.play('bigboom');}
}

/* =========================================================
   10. 建塔 / 升级 / 出售
   ========================================================= */
function towerAt(pad){return pad.tower;}
function upgradeCost(type,level){return Math.round(TOWERS[type].cost*(level===1?1.15:2.0));}
function buildTower(pad,type){
  const def=TOWERS[type];
  if(game.coins<def.cost){SFX.play('deny');flashText(pad.x,pad.y-40,'金币不足','#FF5B72');return;}
  game.coins-=def.cost;
  pad.tower={type,level:1,x:pad.x,y:pad.y,cd:0,angle:-Math.PI/2,rotor:Math.random()*TAU,
    hp:100,maxHp:100,invested:def.cost,kills:0,damage:0,pulse:0,charge:0};
  game.towers.push(pad.tower);
  burst(pad.x,pad.y,22,def.color,180,0.55);
  ring(pad.x,pad.y,90,def.color,0.5,3);
  SFX.play('build');
}
function upgradeTower(pad){
  const t=pad.tower;if(!t||t.level>=3)return;
  const cost=upgradeCost(t.type,t.level);
  if(game.coins<cost){SFX.play('deny');flashText(pad.x,pad.y-40,'金币不足','#FF5B72');return;}
  game.coins-=cost;t.invested+=cost;t.level++;
  burst(pad.x,pad.y,26,TOWERS[t.type].color,220,0.6);
  ring(pad.x,pad.y,120,'#FFD166',0.55,3);
  flashText(pad.x,pad.y-52,'升级 LV'+t.level,'#FFD166');
  SFX.play('upgrade');
}
function sellTower(pad){
  const t=pad.tower;if(!t)return;
  const back=Math.floor(t.invested*0.7);
  game.coins+=back;
  flashText(pad.x,pad.y-46,'+'+back,'#FFD166');
  burst(pad.x,pad.y,18,'#8490A8',150,0.5);
  pad.tower=null;
  const i=game.towers.indexOf(t);if(i>=0)game.towers.splice(i,1);
  SFX.play('sell');
}

/* =========================================================
   11. 战斗逻辑
   ========================================================= */
function damageEnemy(e,dmg,tower){
  if(e.dead)return;
  e.hp-=dmg;
  e.hitFlash=0.12;
  if(tower)tower.damage+=dmg;
  if(e.hp<=0)killEnemy(e,tower);
}
function killEnemy(e,tower){
  if(e.dead)return;
  e.dead=true;
  game.kills++;
  const rw=e.def.reward;
  game.coins+=rw;game.score+=rw*2;
  if(tower)tower.kills++;
  flashText(e.x,e.y-18,'+'+rw,'#FFD166');
  const big=e.def.boss;
  burst(e.x,e.y,big?70:16,e.color,big?320:170,big?1.1:0.6,big?7:4);
  ring(e.x,e.y,big?190:78,big?'#FF5B72':'#FFD166',big?0.95:0.55,big?5:3);
  if(big){
    shake(6,0.4);SFX.play('bigboom');
    game.bossRef=null;
    setBanner('母舰击毁','#FFD166');
    game.flash=Math.max(game.flash,0.35);
  }else{
    SFX.play('boom');
    if(e.def.boom)selfDestruct(e);
  }
}
function selfDestruct(e){
  ring(e.x,e.y,140,'#FF8A5B',0.55,4);
  burst(e.x,e.y,26,'#FF8A5B',260,0.7);
  shake(3,0.16);
  for(const t of game.towers){
    const d=Math.hypot(t.x-e.x,t.y-e.y);
    if(d<130){
      t.hp-=45;
      flashText(t.x,t.y-42,'-45','#FF5B72');
      if(t.hp<=0){
        burst(t.x,t.y,30,TOWERS[t.type].color,240,0.8);
        ring(t.x,t.y,110,'#FF5B72',0.6,4);
        const pad=pads.find(p=>p.tower===t);
        if(pad)pad.tower=null;
        const i=game.towers.indexOf(t);if(i>=0)game.towers.splice(i,1);
        setBanner('防御塔被摧毁','#FF5B72');
      }
    }
  }
}
function findTarget(t,range){
  let best=null,bd=-1;
  for(const e of game.enemies){
    if(e.dead)continue;
    if(e.stealth&&!e.revealed)continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d>range)continue;
    if(e.dist>bd){bd=e.dist;best=e;}
  }
  return best;
}
function fireLaser(t,target){
  const dmg=TOWERS.laser.dmg[t.level-1];
  damageEnemy(target,dmg,t);
  game.beams.push({x1:t.x,y1:t.y,x2:target.x,y2:target.y,color:'#55F7FF',
    life:0.08,max:0.08,w:2+t.level*0.8});
  burst(target.x,target.y,4,'#55F7FF',130,0.24,3);
  SFX.play('laser');
}
function fireMissile(t,target){
  const def=TOWERS.missile;
  game.projectiles.push({
    x:t.x,y:t.y,target,tx:target.x,ty:target.y,
    speed:430,dmg:def.dmg[t.level-1],splash:def.splash[t.level-1],
    angle:Math.atan2(target.y-t.y,target.x-t.x),life:4,type:'missile'
  });
  SFX.play('missile');
}
function fireTesla(t,target){
  const def=TOWERS.tesla;
  const chain=def.chain[t.level-1];
  const hits=[];
  let cur=target;
  for(let i=0;i<chain&&cur;i++){
    hits.push(cur);
    let next=null,bd=175;
    for(const e of game.enemies){
      if(e.dead||hits.indexOf(e)>=0)continue;
      const d=Math.hypot(e.x-cur.x,e.y-cur.y);
      if(d<bd){bd=d;next=e;}
    }
    cur=next;
  }
  let sx=t.x,sy=t.y;
  hits.forEach((e,i)=>{
    const dmg=def.dmg[t.level-1]*Math.pow(0.82,i);
    game.beams.push({x1:sx,y1:sy,x2:e.x,y2:e.y,color:'#B97CFF',
      life:0.14,max:0.14,w:3,branch:true});
    damageEnemy(e,dmg,t);
    burst(e.x,e.y,6,'#B97CFF',160,0.3,3);
    sx=e.x;sy=e.y;
  });
  SFX.play('zap');
}
function icePulse(t){
  const def=TOWERS.ice;
  const range=def.range[t.level-1];
  const slow=def.slow[t.level-1];
  for(const e of game.enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d<=range){
      e.slow=Math.min(e.slow,slow);e.slowT=1.25;
      damageEnemy(e,def.dmg[t.level-1],t);
    }
  }
  ring(t.x,t.y,range,'#8FD8FF',0.5,2);
  SFX.play('ice');
}

/* =========================================================
   12. 主更新（固定步长）
   ========================================================= */
function update(dt){
  game.time+=dt;
  if(game.flash>0)game.flash=Math.max(0,game.flash-dt*1.6);
  if(game.shakeT>0){game.shakeT-=dt;if(game.shakeT<=0)game.shake=0;}
  if(game.bannerT>0)game.bannerT-=dt;
  if(game.launchFx>0&&game.launchFx<1)game.launchFx=Math.min(1,game.launchFx+dt*2.4);

  // 粒子
  for(const p of game.parts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(p.drag,dt*60);p.vy*=Math.pow(p.drag,dt*60);
    p.life-=dt;
  }
  game.parts=game.parts.filter(p=>p.life>0);
  for(const r of game.rings){r.r+=(r.max-r.r)*Math.min(1,dt*7);r.life-=dt;}
  game.rings=game.rings.filter(r=>r.life>0);
  for(const b of game.beams)b.life-=dt;
  game.beams=game.beams.filter(b=>b.life>0);
  for(const f of game.floats){f.y+=f.vy*dt;f.vy*=0.94;f.life-=dt;}
  game.floats=game.floats.filter(f=>f.life>0);

  if(game.screen!=='playing')return;

  // 倒计时
  if(!game.waveActive){
    game.countdown-=dt;
    if(game.countdown<=0){game.countdown=0;startWave(false);}
  }

  // 出怪
  if(game.waveActive&&game.spawnQueue.length){
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0){
      const item=game.spawnQueue.shift();
      spawnEnemy(item.type);
      game.spawnTimer=item.gap;
    }
  }

  // 反隐
  for(const e of game.enemies)e.revealed=false;
  for(const t of game.towers){
    if(t.type!=='tesla')continue;
    const range=TOWERS.tesla.range[t.level-1]*1.15;
    for(const e of game.enemies){
      if(e.stealth&&Math.hypot(e.x-t.x,e.y-t.y)<=range)e.revealed=true;
    }
  }

  // 敌人
  for(const e of game.enemies){
    if(e.dead)continue;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=1;}
    e.hitFlash=Math.max(0,e.hitFlash-dt);
    e.wobble+=dt*3;
    e.dist+=e.speed*e.slow*dt;
    const p=posAt(e.dist);
    e.x=p.x;e.y=p.y;e.ang=p.ang;
    if(Math.random()<dt*30){
      e.trail.push({x:e.x-Math.cos(e.ang)*e.r*1.1,y:e.y-Math.sin(e.ang)*e.r*1.1,life:0.42,max:0.42});
    }
    for(const tr of e.trail)tr.life-=dt;
    e.trail=e.trail.filter(t=>t.life>0);
    if(e.dist>=pathLen){
      e.dead=true;
      game.lives-=e.def.damage;
      game.flash=Math.max(game.flash,0.4);
      game.stationHit=0.5;
      shake(6,0.22);
      SFX.play('hurt');
      flashText(STATION.x-40,STATION.y-70,'-'+e.def.damage,'#FF5B72');
      if(game.lives<=0){
        game.lives=0;game.screen='over';
        save.highScore=Math.max(save.highScore,game.score);persist();
      }
    }
  }
  game.enemies=game.enemies.filter(e=>!e.dead);
  if(game.bossRef&&game.bossRef.dead)game.bossRef=null;

  // 塔
  for(const t of game.towers){
    const def=TOWERS[t.type];
    const range=def.range[t.level-1];
    t.rotor+=dt*(t.type==='tesla'?2.4:1.1);
    t.pulse=Math.max(0,t.pulse-dt);
    if(t.type==='ice'){
      if(t.pulse<=0){t.pulse=1/def.rate[t.level-1];icePulse(t);}
      continue;
    }
    t.cd-=dt;
    const target=findTarget(t,range);
    if(target){
      t.angle=Math.atan2(target.y-t.y,target.x-t.x);
      if(t.cd<=0){
        t.cd=1/def.rate[t.level-1];
        if(t.type==='laser')fireLaser(t,target);
        else if(t.type==='missile')fireMissile(t,target);
        else fireTesla(t,target);
      }
    }else{
      t.angle+=dt*0.35;
    }
  }

  // 导弹
  for(const m of game.projectiles){
    m.life-=dt;
    if(m.target&&!m.target.dead){m.tx=m.target.x;m_ty=m.target.y;m.tx=m.target.x;m.ty=m.target.y;}
    const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);
    const step=m.speed*dt;
    m.angle=Math.atan2(dy,dx);
    if(d<=step+6){
      m.life=0;
      explodeMissile(m);
    }else{
      m.x+=dx/d*step;m.y+=dy/d*step;
      if(Math.random()<dt*40)
        game.parts.push({x:m.x,y:m.y,vx:-Math.cos(m.angle)*40,vy:-Math.sin(m.angle)*40,
          life:0.3,max:0.3,size:4,color:'#FF8A5B',drag:0.9});
    }
  }
  game.projectiles=game.projectiles.filter(m=>m.life>0);

  // 波次完成
  if(game.waveActive&&game.spawnQueue.length===0&&game.enemies.length===0){
    game.waveActive=false;
    const bonus=60+game.wave*8;
    game.coins+=bonus;game.score+=bonus;
    flashText(1120,240,'波次奖励 +'+bonus,'#FFD166');
    setBanner('波次完成','#7CFFB2');
    SFX.play('coin');
    if(game.wave>=20){
      game.screen='win';
      save.highScore=Math.max(save.highScore,game.score);persist();
      SFX.play('victory');
    }else{
      game.countdown=10;
    }
  }
}
function explodeMissile(m){
  ring(m.tx,m.ty,m.splash,'#FFD166',0.55,3);
  burst(m.tx,m.ty,18,'#FFD166',230,0.55,5);
  burst(m.tx,m.ty,10,'#FF8A5B',150,0.4,3);
  shake(2,0.12);
  SFX.play('boom');
  for(const e of game.enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.x-m.tx,e.y-m.ty);
    if(d<=m.splash+e.r*0.6)damageEnemy(e,m.dmg,null);
  }
}

let vignette=null;
function buildVignette(){
  vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.78);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(0,0,0,0.42)');
}
let scanPattern=null;
function scanlinePattern(){
  if(scanPattern)return scanPattern;
  const c=document.createElement('canvas');
  c.width=2;c.height=3;
  const g=c.getContext('2d');
  g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(0,0,2,1);
  g.fillStyle='rgba(255,255,255,0.012)';g.fillRect(0,2,2,1);
  scanPattern=ctx.createPattern(c,'repeat');
  return scanPattern;
}
function drawWorld(){
  ctx.save();
  ctx.translate(arena.x+arena.w/2,arena.y+arena.h/2);
  if(rot)ctx.rotate(rot);
  ctx.scale(vscale,vscale);
  ctx.translate(-960,-540);

  // 背景
  ctx.fillStyle='#12141c';
  ctx.fillRect(-200,-200,2320,1480);

  // 星云
  const neb=ctx.createRadialGradient(520,300,20,520,300,720);
  neb.addColorStop(0,'rgba(85,247,255,0.10)');
  neb.addColorStop(1,'rgba(85,247,255,0)');
  ctx.fillStyle=neb;ctx.fillRect(-200,-200,2320,1480);
  const neb2=ctx.createRadialGradient(1380,760,20,1380,760,760);
  neb2.addColorStop(0,'rgba(185,124,255,0.11)');
  neb2.addColorStop(1,'rgba(185,124,255,0)');
  ctx.fillStyle=neb2;ctx.fillRect(-200,-200,2320,1480);
  const neb3=ctx.createRadialGradient(960,540,20,960,540,900);
  neb3.addColorStop(0,'rgba(255,91,114,0.05)');
  neb3.addColorStop(1,'rgba(255,91,114,0)');
  ctx.fillStyle=neb3;ctx.fillRect(-200,-200,2320,1480);

  // 建造网格
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(59,67,88,0.30)';
  ctx.beginPath();
  for(let x=0;x<=1920;x+=80){ctx.moveTo(x,0);ctx.lineTo(x,1080);}
  for(let y=0;y<=1080;y+=80){ctx.moveTo(0,y);ctx.lineTo(1920,y);}
  ctx.stroke();
  ctx.strokeStyle='rgba(59,67,88,0.5)';
  ctx.beginPath();
  for(let x=0;x<=1920;x+=320){ctx.moveTo(x,0);ctx.lineTo(x,1080);}
  for(let y=0;y<=1080;y+=320){ctx.moveTo(0,y);ctx.lineTo(1920,y);}
  ctx.stroke();

  // 星点
  for(const s of STARS){
    const tw=0.65+0.35*Math.sin(game.time*s.s+s.ph);
    ctx.globalAlpha=s.a*tw;
    ctx.fillStyle=s.r>1.5?'#F2F7FF':'#8490A8';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;

  drawPath();
  drawWormhole();
  drawStation();
  drawPads();
  drawTowers();
  drawProjectiles();
  drawEnemies();
  drawEffects();

}

function tracePath(){
  ctx.beginPath();
  ctx.moveTo(pathPts[0].x,pathPts[0].y);
  for(let i=1;i<pathPts.length;i++)ctx.lineTo(pathPts[i].x,pathPts[i].y);
}
function drawPath(){
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='rgba(11,13,18,0.92)';ctx.lineWidth=152;tracePath();ctx.stroke();
  ctx.strokeStyle='rgba(85,247,255,0.055)';ctx.lineWidth=168;tracePath();ctx.stroke();
  ctx.strokeStyle='#1B2130';ctx.lineWidth=132;tracePath();ctx.stroke();
  ctx.strokeStyle='rgba(85,247,255,0.10)';ctx.lineWidth=126;tracePath();ctx.stroke();
  ctx.setLineDash([30,26]);
  ctx.lineDashOffset=-game.time*22;
  ctx.strokeStyle='rgba(132,144,168,0.34)';ctx.lineWidth=3;tracePath();ctx.stroke();
  ctx.setLineDash([]);
}
function drawWormhole(){
  const {x,y}=WORM;
  ctx.save();
  ctx.translate(x,y);
  for(let i=0;i<5;i++){
    const r=48+i*17+Math.sin(game.time*1.6+i)*3;
    ctx.beginPath();ctx.arc(0,0,r,0,TAU);
    ctx.strokeStyle=i%2?'rgba(85,247,255,0.55)':'rgba(185,124,255,0.5)';
    ctx.lineWidth=4-i*0.5;ctx.stroke();
  }
  const g=ctx.createRadialGradient(0,0,4,0,0,52);
  g.addColorStop(0,'rgba(11,13,18,1)');
  g.addColorStop(0.62,'rgba(185,124,255,0.42)');
  g.addColorStop(1,'rgba(185,124,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,52,0,TAU);ctx.fill();
  ctx.restore();
}
function drawStation(){
  const {x,y}=STATION;
  const hurt=game.stationHit>0?1:0;
  if(game.stationHit>0)game.stationHit-=0.016;
  ctx.save();ctx.translate(x,y);
  // 外环
  for(let i=0;i<3;i++){
    const r=96+i*26;
    ctx.beginPath();
    for(let a=0;a<6;a++){
      const ang=a/6*TAU+game.time*0.12*(i%2?1:-1);
      const px=Math.cos(ang)*r,py=Math.sin(ang)*r;
      a?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
    ctx.strokeStyle=i===0?(hurt?'#FF5B72':'rgba(85,247,255,0.85)'):'rgba(59,67,88,0.9)';
    ctx.lineWidth=i===0?5:3;ctx.stroke();
  }
  // 主体
  const g=ctx.createRadialGradient(-18,-18,6,0,0,74);
  g.addColorStop(0,'#2A3346');g.addColorStop(1,'#151A26');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,70,0,TAU);ctx.fill();
  ctx.strokeStyle=hurt?'#FF5B72':'#55F7FF';ctx.lineWidth=3;ctx.stroke();
  // 核心
  const core=ctx.createRadialGradient(0,0,2,0,0,30);
  core.addColorStop(0,hurt?'#FF5B72':'#F2F7FF');
  core.addColorStop(1,hurt?'rgba(255,91,114,0)':'rgba(85,247,255,0)');
  ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,32,0,TAU);ctx.fill();
  // 雷达
  ctx.save();ctx.rotate(game.time*0.9);
  ctx.strokeStyle='rgba(124,255,178,0.85)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-92);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,92,-1.05,-0.05);ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  // 灯
  for(let a=0;a<6;a++){
    const ang=a/6*TAU+game.time*0.5;
    const on=Math.sin(game.time*3+a)>0.2;
    ctx.fillStyle=on?'#7CFFB2':'#3B4358';
    ctx.beginPath();ctx.arc(Math.cos(ang)*70,Math.sin(ang)*70,5,0,TAU);ctx.fill();
  }
  if(hurt){
    ctx.strokeStyle='rgba(255,91,114,0.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-42,-24);ctx.lineTo(-12,2);ctx.lineTo(-30,30);ctx.stroke();
    ctx.beginPath();ctx.moveTo(30,-38);ctx.lineTo(12,-6);ctx.lineTo(40,16);ctx.stroke();
  }
  ctx.restore();
}
function hexPath(x,y,r,rotA){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*TAU+(rotA||0);
    const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function drawPads(){
  for(const p of pads){

function drawTowers(){
  for(const t of game.towers){
    const def=TOWERS[t.type];
    // 射程圈
    if(game.sel>=0&&pads[game.sel]&&pads[game.sel].tower===t){
      const range=def.range[t.level-1];

      ctx.strokeStyle='rgba(85,247,255,0.55)';ctx.lineWidth=2;
      ctx.setLineDash([14,12]);ctx.lineDashOffset=-game.time*30;
      ctx.beginPath();ctx.arc(t.x,t.y,range,0,TAU);ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.save();
    ctx.translate(t.x,t.y);
    // 底座
    hexPath(0,0,32,Math.PI/6);
    ctx.fillStyle='#1B2130';ctx.fill();
    ctx.strokeStyle='rgba(132,144,168,0.55)';ctx.lineWidth=2.5;ctx.stroke();

    const col=def.color;
    const glow=ctx.createRadialGradient(0,0,2,0,0,42);
    glow.addColorStop(0,col+'55');glow.addColorStop(1,col+'00');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,42,0,TAU);ctx.fill();

    if(t.type==='laser'){
      ctx.rotate(t.angle);
      ctx.beginPath();
      ctx.moveTo(30,0);ctx.lineTo(-16,-16);ctx.lineTo(-8,0);ctx.lineTo(-16,16);
      ctx.closePath();
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#0B0D12';
      ctx.fillRect(-4,-4,12,8);
    }else if(t.type==='missile'){
      ctx.rotate(t.angle);
      ctx.fillStyle=col;
      ctx.fillRect(-16,-16,26,32);
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=2.5;ctx.strokeRect(-16,-16,26,32);
      ctx.fillStyle='#FF8A5B';
      ctx.fillRect(10,-9,12,18);
      ctx.fillStyle='#0B0D12';
      for(let i=-1;i<=1;i+=2)ctx.fillRect(-11,i*11-3,8,6);
    }else if(t.type==='ice'){
      ctx.rotate(t.rotor*0.4);
      ctx.strokeStyle=col;ctx.lineWidth=5;
      for(let i=0;i<3;i++){
        ctx.rotate(TAU/3);
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24,0);
        ctx.moveTo(15,0);ctx.lineTo(21,-7);
        ctx.moveTo(15,0);ctx.lineTo(21,7);
        ctx.stroke();
      }
      ctx.fillStyle='#F2F7FF';
      ctx.beginPath();ctx.arc(0,0,7,0,TAU);ctx.fill();
    }else{
      ctx.rotate(t.rotor*0.5);
      ctx.strokeStyle=col;ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(0,0,21,0,TAU);ctx.stroke();
      for(let i=0;i<4;i++){
        const a=i/4*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);
        ctx.lineTo(Math.cos(a)*27,Math.sin(a)*27);
        ctx.stroke();
      }
      const p=0.55+0.45*Math.sin(game.time*7);
      ctx.fillStyle='rgba(185,124,255,'+p+')';
      ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();
    }

    // 等级点
    for(let i=0;i<t.level;i++){
      ctx.fillStyle='#FFD166';
      ctx.fillRect(-16+i*12,26,8,5);
    }
    // 受损
    if(t.hp<t.maxHp){
      ctx.fillStyle='rgba(11,13,18,0.8)';
      ctx.fillRect(-26,-38,52,6);
      ctx.fillStyle=t.hp>50?'#7CFFB2':(t.hp>22?'#FFD166':'#FF5B72');
      ctx.fillRect(-26,-38,52*(t.hp/t.maxHp),6);
    }
    ctx.restore();
  }
}
function drawProjectiles(){
  for(const m of game.projectiles){
    ctx.save();
    ctx.translate(m.x,m.y);ctx.rotate(m.angle);
    const g=ctx.createRadialGradient(0,0,1,0,0,22);
    g.addColorStop(0,'rgba(255,209,102,0.85)');
    g.addColorStop(1,'rgba(255,138,91,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-9,-8);ctx.lineTo(-5,0);ctx.lineTo(-9,8);
    ctx.closePath();
    ctx.fillStyle='#FFD166';ctx.fill();
    ctx.strokeStyle='#F2F7FF';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
}
function drawEnemies(){
  for(const e of game.enemies){
    const hidden=e.stealth&&!e.revealed;
    ctx.save();
    ctx.globalAlpha=hidden?0.24:1;
    // 尾焰
    for(const tr of e.trail){
      const a=tr.life/tr.max;
      ctx.globalAlpha=(hidden?0.2:1)*a*0.55;
      ctx.fillStyle='#FF8A5B';
      const s=e.r*0.85*a+2;
      ctx.beginPath();ctx.arc(tr.x,tr.y,s,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=hidden?0.26:1;

    ctx.translate(e.x,e.y);
    const wob=Math.sin(e.wobble)*0.12;
    ctx.rotate(e.ang+wob);

    if(e.hitFlash>0){
      const fg=ctx.createRadialGradient(0,0,2,0,0,e.r*2.4);
      fg.addColorStop(0,'rgba(255,255,255,0.8)');
      fg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,e.r*2.4,0,TAU);ctx.fill();
    }

    if(e.type==='scout'){
      ctx.beginPath();
      ctx.moveTo(20,0);ctx.lineTo(-12,-12);ctx.lineTo(-6,0);ctx.lineTo(-12,12);
      ctx.closePath();
      ctx.fillStyle='#F2F7FF';ctx.fill();
      ctx.strokeStyle='#55F7FF';ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#55F7FF';ctx.fillRect(-2,-4,10,8);
    }else if(e.type==='armor'){
      hexPath(0,0,23,Math.PI/6);
      ctx.fillStyle='#FF5B72';ctx.fill();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='rgba(11,13,18,0.55)';
      ctx.fillRect(-8,-14,16,28);
      ctx.fillStyle='#FFD166';
      for(let i=-1;i<=1;i+=2)ctx.fillRect(-3,i*11-3,14,6);
    }else if(e.type==='wraith'){
      ctx.beginPath();
      ctx.moveTo(22,0);ctx.lineTo(0,-16);ctx.lineTo(-18,0);ctx.lineTo(0,16);
      ctx.closePath();
      ctx.fillStyle='rgba(185,124,255,0.55)';ctx.fill();
      ctx.strokeStyle='#B97CFF';ctx.lineWidth=2.5;
      ctx.setLineDash([7,6]);ctx.lineDashOffset=-game.time*30;ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#F2F7FF';ctx.beginPath();ctx.arc(4,0,5,0,TAU);ctx.fill();
    }else if(e.type==='bomber'){
      const pulse=0.5+0.5*Math.sin(game.time*8+e.wobble);
      ctx.beginPath();ctx.arc(0,0,18,0,TAU);
      ctx.fillStyle='#FFD166';ctx.fill();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='rgba(255,91,114,'+(0.45+pulse*0.55)+')';
      ctx.beginPath();ctx.arc(0,0,10+pulse*3,0,TAU);ctx.fill();
    }else{
      // BOSS
      for(let i=0;i<3;i++){
        hexPath(0,0,48+i*16,game.time*0.25*(i%2?1:-1));
        ctx.strokeStyle=i===0?'#FF5B72':'rgba(255,91,114,0.32)';
        ctx.lineWidth=i===0?5:3;ctx.stroke();
      }
      const g=ctx.createRadialGradient(-12,-12,6,0,0,46);
      g.addColorStop(0,'#4A2231');g.addColorStop(1,'#1B2130');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,44,0,TAU);ctx.fill();
      // 护盾节点
      for(let i=0;i<4;i++){
        const a=i/4*TAU+game.time*0.6;
        ctx.fillStyle='rgba(185,124,255,0.9)';
        ctx.beginPath();ctx.arc(Math.cos(a)*58,Math.sin(a)*58,8,0,TAU);ctx.fill();
      }
      // 弱点核心
      const weak=0.6+0.4*Math.sin(game.time*4);
      const cg=ctx.createRadialGradient(0,0,2,0,0,26);
      cg.addColorStop(0,'rgba(255,255,255,'+weak+')');
      cg.addColorStop(1,'rgba(255,91,114,0)');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.fill();
      ctx.fillStyle='#FF5B72';ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.moveTo(0,-14);ctx.lineTo(0,14);ctx.stroke();
    }
    ctx.restore();

    // 血条
    if(e.hp<e.maxHp&&!e.def.boss){
      const w=e.r*2.2;
      ctx.fillStyle='rgba(11,13,18,0.75)';
      ctx.fillRect(e.x-w/2,e.y-e.r-14,w,5);
      ctx.fillStyle=e.hp/e.maxHp>0.35?'#7CFFB2':'#FF5B72';
      ctx.fillRect(e.x-w/2,e.y-e.r-14,w*clamp(e.hp/e.maxHp,0,1),5);
    }
    if(e.slowT>0&&e.slow<1){
      ctx.strokeStyle='rgba(143,216,255,0.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+7,0,TAU);ctx.stroke();
    }
  }
}
function drawEffects(){
  for(const b of game.beams){
    const a=b.life/b.max;
    ctx.save();
    ctx.globalAlpha=clamp(a,0,1);
    if(b.branch){
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w+6;ctx.globalAlpha=a*0.22;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.globalAlpha=a;
      const seg=7;
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w;
      ctx.beginPath();
      for(let i=0;i<=seg;i++){
        const t=i/seg;
        const px=lerp(b.x1,b.x2,t)+(i===0||i===seg?0:rand(-14,14));
        const py=lerp(b.y1,b.y2,t)+(i===0||i===seg?0:rand(-14,14));
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.stroke();
      ctx.strokeStyle='#F2F7FF';ctx.lineWidth=1.6;ctx.stroke();
    }else{
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w+7;ctx.globalAlpha=a*0.22;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.globalAlpha=a;
      ctx.strokeStyle=b.color;ctx.lineWidth=b.w;
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
      ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.4;ctx.stroke();
    }
    ctx.restore();
  }
  for(const r of game.rings){
    const a=clamp(r.life/r.max2,0,1);
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=r.color;ctx.lineWidth=r.w;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
    ctx.restore();
  }
  for(const p of game.parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a*0.95;
    ctx.fillStyle=p.color;
    const s=p.size*(0.45+a*0.75);
    ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  ctx.globalAlpha=1;
  for(const f of game.floats){
    const a=clamp(f.life/f.max,0,1);
    ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);
    ctx.font='700 '+(15*k)+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(11,13,18,0.9)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
    ctx.restore();
  }
}
function drawLaunchFx(){
  if(game.launchFx<=0)return;
  const t=game.launchFx;
  const d=t*pathLen;
  ctx.save();
  for(let i=0;i<26;i++){
    const dd=d-i*22;
    if(dd<0)continue;
    const p=posAt(dd);
    const a=(1-i/26)*(1-Math.abs(t-0.5)*1.1);
    ctx.globalAlpha=clamp(a,0,1);
    ctx.fillStyle=i<6?'#F2F7FF':'#55F7FF';
    const s=14-i*0.32;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,s),0,TAU);ctx.fill();
  }
  ctx.restore();
}

/* =========================================================
   14. 渲染 —— HUD / 面板
   ========================================================= */
let hotspots=[];
function hotspot(x,y,w,h,fn){hotspots.push({x,y,w,h,fn});}

function uiFont(size,bold){return (bold?'700 ':'400 ')+(size)+'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';}

function drawButton(x,y,w,h,label,opts){
  opts=opts||{};
  const disabled=!!opts.disabled;
  const active=!!opts.active;
  const hot=opts.hot;
  ctx.save();
  const r=8*k;
  // 阴影
  ctx.fillStyle='rgba(11,13,18,'+(disabled?0.25:0.55)+')';
  roundRect(x,y+3*k,w,h,r);ctx.fill();
  // 面板
  const g=ctx.createLinearGradient(x,y,x,y+h);
  if(opts.danger){g.addColorStop(0,'#3A1F27');g.addColorStop(1,'#22141B');}
  else if(active){g.addColorStop(0,'#22303F');g.addColorStop(1,'#16222C');}
  else{g.addColorStop(0,'#232B3B');g.addColorStop(1,'#161B27');}
  ctx.fillStyle=disabled?'rgba(27,33,48,0.6)':g;
  roundRect(x,y,w,h,r);ctx.fill();
  ctx.lineWidth=2*k;
  ctx.strokeStyle=disabled?'rgba(132,144,168,0.28)':(opts.danger?'#FF5B72':(active||hot?'#55F7FF':'rgba(132,144,168,0.55)'));
  roundRect(x,y,w,h,r);ctx.stroke();
  // 高光
  ctx.fillStyle='rgba(255,255,255,0.06)';
  roundRect(x+2*k,y+2*k,w-4*k,h*0.42,6*k);ctx.fill();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=uiFont(opts.size||14*k,true);
  ctx.fillStyle=disabled?'rgba(132,144,168,0.75)':(opts.color||'#F2F7FF');
  ctx.fillText(label,x+w/2,y+h/2+1*k);
  ctx.restore();
  if(!disabled&&opts.fn)hotspot(x,y,w,h,opts.fn);
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function panel(x,y,w,h,accent){
  ctx.save();
  ctx.fillStyle='rgba(11,13,18,0.72)';
  roundRect(x-6*k,y-6*k,w+12*k,h+12*k,18*k);ctx.fill();
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#1B2130');g.addColorStop(1,'#12141c');
  ctx.fillStyle=g;roundRect(x,y,w,h,12*k);ctx.fill();
  ctx.lineWidth=2*k;ctx.strokeStyle=accent||'rgba(85,247,255,0.6)';
  roundRect(x,y,w,h,12*k);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.05)';
  roundRect(x+3*k,y+3*k,w-6*k,26*k,10*k);ctx.fill();
  ctx.restore();
}

function drawHUD(){
  const pad=14*k;
  // ---- 顶栏 ----
  ctx.fillStyle='#0B0D12';ctx.fillRect(0,0,W,topH);
  ctx.fillStyle='rgba(85,247,255,0.22)';ctx.fillRect(0,topH-2,W,2);

  let x=pad;
  // 金币
  drawCoinIcon(x+12*k,topH/2,11*k);
  x+=30*k;
  pixText(Math.floor(game.coins),x,topH/2-8*k,3*k,'#FFD166');
  x+=pixWidth(String(Math.floor(game.coins)),3*k)+22*k;

  // 生命
  drawHullIcon(x+11*k,topH/2,10*k);
  x+=30*k;
  pixText(game.lives,x,topH/2-8*k,3*k,game.lives>6?'#F2F7FF':'#FF5B72');
  x+=pixWidth(String(game.lives),3*k)+24*k;

  // 波次
  if(W>430){
    ctx.font=uiFont(12*k,true);ctx.fillStyle='#8490A8';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('波次',x,topH/2-8*k);
    x+=34*k;
  }
  pixText(game.wave+'/20',x,topH/2-8*k,3*k,'#55F7FF');
  x+=pixWidth((game.wave+'/20'),3*k)+24*k;

  // 得分
  if(W>560){
    ctx.font=uiFont(11*k,true);ctx.fillStyle='#8490A8';ctx.textAlign='left';
    ctx.fillText('SCORE',x,topH/2-8*k);
    x+=46*k;
    pixText(String(Math.floor(game.score)),x,topH/2-8*k,2.4*k,'#F2F7FF');
    x+=pixWidth(String(Math.floor(game.score)),2.4*k);
  }

  // BOSS 血条
  if(game.bossRef&&!game.bossRef.dead){
    const bw=Math.min(360*k,W*0.32),bx=W/2-bw/2,by=topH/2-8*k;
    ctx.fillStyle='rgba(11,13,18,0.9)';roundRect(bx,by,bw,16*k,4*k);ctx.fill();
    const ratio=clamp(game.bossRef.hp/game.bossRef.maxHp,0,1);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,'#FF5B72');g.addColorStop(1,'#FFD166');
    ctx.fillStyle=g;roundRect(bx+2*k,by+2*k,(bw-4*k)*ratio,12*k,3*k);ctx.fill();
    ctx.strokeStyle='rgba(255,91,114,0.8)';ctx.lineWidth=2*k;roundRect(bx,by,bw,16*k,4*k);ctx.stroke();
    ctx.font=uiFont(11*k,true);ctx.fillStyle='#FF5B72';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('母舰',bx+bw/2,by+8*k);
  }

  // 右侧：静音 / 帮助
  let rx=W-pad;
  const bs=32*k;
  drawIconButton(rx-bs,topH/2-bs/2,bs,bs,SFX.muted?'mute':'sound',()=>{
    SFX.setMuted(!SFX.muted);SFX.play('ui');
  });
  rx-=bs+8*k;
  drawIconButton(rx-bs,topH/2-bs/2,bs,bs,'help',()=>{game.menu='help';SFX.play('ui');});

  // ---- 底栏 ----
  const by0=H-botH;
  ctx.fillStyle='#0B0D12';ctx.fillRect(0,by0,W,botH);
  ctx.fillStyle='rgba(85,247,255,0.22)';ctx.fillRect(0,by0,W,2);

  const btnH=Math.min(botH-22*k,44*k);
  const by=by0+(botH-btnH)/2;
  let bxs=W-pad;
  const mkBtn=(label,fn,opts)=>{
    const w=Math.max(64*k,Math.min(160*k,label.length*15*k+30*k));
    bxs-=w;
    drawButton(bxs,by,w,btnH,label,Object.assign({fn},opts||{}));
    bxs-=8*k;
    return w;
  };
  mkBtn(SFX.muted?'音效关':'音效开',()=>{SFX.setMuted(!SFX.muted);SFX.play('ui');},{active:!SFX.muted,size:12*k});
  mkBtn('暂停',()=>{
    if(game.screen==='playing'){game.screen='paused';}
    else if(game.screen==='paused'){game.screen='playing';}
    SFX.play('ui');
  },{size:12*k});
  mkBtn(game.speed>=2?'2x':'1x',()=>{
    game.speed=game.speed>=2?1:2;SFX.play('ui');
  },{active:game.speed>=2,size:13*k});

  if(!game.waveActive&&game.screen==='playing'){
    const sec=Math.ceil(game.countdown);
    mkBtn('提前开战 +'+(sec*5),()=>startWave(true),{active:true,size:12*k,color:'#FFD166'});
    const w=Math.max(92*k,120*k);
    bxs-=w;
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.font=uiFont(12*k,true);ctx.fillStyle='#8490A8';
    ctx.fillText('下一波 '+sec+'s',bxs-8*k,by+btnH/2);
  }else{
    const w=120*k;bxs-=w;
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.font=uiFont(12*k,true);ctx.fillStyle='#55F7FF';
    ctx.fillText(game.waveActive?('敌军 '+game.enemies.length):'备战中',bxs-8*k,by+btnH/2);
  }

  // 提示文字（左侧，空间足够时）
  const hintW=bxs-16*k;
  if(hintW>180*k){
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.font=uiFont(12.5*k,true);
    ctx.fillStyle='rgba(132,144,168,0.95)';
    const hint=game.menu==='build'?'选择塔型，点击购买':
               game.menu==='tower'?'升级 / 出售防御塔':
               game.sel>=0?'点击建造点建塔，方向键切换':'建造防御塔，拦截敌军！';
    ctx.fillText(hint,14*k,by+btnH/2);
  }
}

function drawCoinIcon(x,y,r){
  ctx.save();
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.15,x,y,r);
  g.addColorStop(0,'#FFF0B8');g.addColorStop(1,'#FFD166');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle='#B98526';ctx.lineWidth=Math.max(1.5,r*0.18);ctx.stroke();
  ctx.fillStyle='#B98526';
  ctx.fillRect(x-r*0.16,y-r*0.42,r*0.32,r*0.84);
  ctx.restore();
}
function drawHullIcon(x,y,r){
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=i/6*TAU;
    const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.15,x,y,r);
  g.addColorStop(0,'#FFC2CC');g.addColorStop(1,'#FF5B72');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#8C2C3B';ctx.lineWidth=Math.max(1.5,r*0.18);ctx.stroke();
  ctx.restore();
}
function drawIconButton(x,y,w,h,kind,fn){

    ctx.lineTo(cx-s*0.6,cy+s*0.5);ctx.lineTo(cx-s*1.5,cy+s*0.5);

      ctx.beginPath();ctx.arc(cx+s*0.4,cy,s*1.1,-0.9,0.9);ctx.stroke();

      ctx.moveTo(cx+s*2,cy-s*1.1);ctx.lineTo(cx+s*0.7,cy+s*1.1);ctx.stroke();
    }
  }else{
    ctx.fillStyle='#F2F7FF';

  hotspot(x,y,w,h,fn);
}

function drawTowerIcon(x,y,r,type){
  ctx.save();
  const col=TOWERS[type].color;
  const g=ctx.createRadialGradient(x,y,1,x,y,r*1.7);
  g.addColorStop(0,col+'66');g.addColorStop(1,col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.7,0,TAU);ctx.fill();
  ctx.fillStyle=col;
  if(type==='laser'){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x-r*0.7,y-r*0.8);ctx.lineTo(x-r*0.3,y);ctx.lineTo(x-r*0.7,y+r*0.8);
    ctx.closePath();ctx.fill();
  }else if(type==='missile'){
    ctx.fillRect(x-r*0.75,y-r*0.75,r*1.25,r*1.5);
    ctx.fillStyle='#FF8A5B';ctx.fillRect(x+r*0.45,y-r*0.4,r*0.55,r*0.8);
  }else if(type==='ice'){
    ctx.strokeStyle=col;ctx.lineWidth=3*k;
    for(let i=0;i<3;i++){
      ctx.save();ctx.translate(x,y);ctx.rotate(i/3*TAU);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r,0);ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(x,y,r*0.3,0,TAU);ctx.fill();
  }else{
    ctx.strokeStyle=col;ctx.lineWidth=3*k;
    ctx.beginPath();ctx.arc(x,y,r*0.85,0,TAU);ctx.stroke();
    for(let i=0;i<4;i++){
      const a=i/4*TAU;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a)*r*0.35,y+Math.sin(a)*r*0.35);
      ctx.lineTo(x+Math.cos(a)*r*1.15,y+Math.sin(a)*r*1.15);
      ctx.stroke();
    }
    ctx.beginPath();ctx.arc(x,y,r*0.35,0,TAU);ctx.fill();
  }
  ctx.restore();
}

   17. 输入
   ========================================================= */
function pt(e){
  if(e.touches&&e.touches.length)return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length)return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}
function hitTest(sx,sy){
  for(let i=hotspots.length-1;i>=0;i--){
    const b=hotspots[i];
    if(sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h)return b;
  }
  return null;
}
function nearestPad(wx,wy){
  let best=-1,bd=Infinity;
  for(const p of pads){
    const d=Math.hypot(p.x-wx,p.y-wy);
    if(d<bd){bd=d;best=p.idx;}
  }
  return {idx:best,dist:bd};
}
function selectPadAt(wx,wy){
  const n=nearestPad(wx,wy);
  if(n.dist<64){game.sel=n.idx;SFX.play('ui');return true;}
  return false;
}
function moveSel(dx,dy){
  const cur=game.sel>=0?pads[game.sel]:{x:960,y:540};
  let best=-1,bestScore=Infinity;
  for(const p of pads){
    if(p.idx===game.sel)continue;
    const vx=p.x-cur.x,vy=p.y-cur.y;
    const dot=vx*dx+vy*dy;
    if(dot<=1)continue;
    const perp=Math.abs(vx*dy-vy*dx);
    const score=perp*2.2+Math.hypot(vx,vy);
    if(score<bestScore){bestScore=score;best=p.idx;}
  }
  if(best>=0){game.sel=best;SFX.play('ui');}
}
function confirmAction(){
  if(game.screen==='title'){resetGame();SFX.play('launch');return;}
  if(game.screen==='over'||game.screen==='win'){resetGame();return;}
  if(game.screen==='paused'){game.screen='playing';return;}
  if(game.sel<0){moveSel(0,0);if(game.sel<0)game.sel=0;return;}
  const pad=pads[game.sel];
  if(!pad)return;
  if(pad.tower){
    if(game.menu==='tower'){
      if(pad.tower.level<3&&game.coins>=upgradeCost(pad.tower.type,pad.tower.level))upgradeTower(pad);
      else{SFX.play('deny');}
    }else{game.menu='tower';SFX.play('ui');}
  }else{
    if(game.menu==='build'){
      if(game.menuType&&game.coins>=TOWERS[game.menuType].cost){buildTower(pad,game.menuType);game.menu=null;}
      else SFX.play('deny');
    }else{
      game.menu='build';game.menuType='laser';SFX.play('ui');
    }
  }
}

let pDown=false,pStartX=0,pStartY=0,pMoved=false;
function onDown(e){
  SFX.ensure();
  const p=pt(e);
  pDown=true;pStartX=p.x;pStartY=p.y;pMoved=false;
  const b=hitTest(p.x,p.y);
  if(b){b.fn();if(e.cancelable)e.preventDefault();return;}
  if(game.screen!=='playing'&&game.screen!=='paused'){
    if(game.menu!=='help'&&game.screen==='title'){/* 标题点击空白也可开始 */}
    if(e.cancelable)e.preventDefault();
    return;
  }
  if(p.y<topH||p.y>H-botH){if(e.cancelable)e.preventDefault();return;}
  if(game.menu==='help'){if(e.cancelable)e.preventDefault();return;}

  const w=toWorld(p.x,p.y);
  if(selectPadAt(w.x,w.y)){
    const pad=pads[game.sel];
    game.menu=pad.tower?'tower':'build';
    if(!pad.tower)game.menuType=game.menuType||'laser';
    SFX.play('ui');
  }else{
    // 左半屏点击：光标向点击方向移动；右半屏：确认
    const localX=p.x-arena.x;
    if(localX<arena.w*0.5){
      const dx=w.x-960,dy=w.y-540;
      if(Math.abs(dx)>Math.abs(dy))moveSel(Math.sign(dx),0);
      else moveSel(0,Math.sign(dy));
    }else{
      confirmAction();
    }
  }
  if(e.cancelable)e.preventDefault();
}
function onMove(e){
  if(!pDown)return;
  const p=pt(e);
  const dx=p.x-pStartX,dy=p.y-pStartY;
  if(!pMoved&&Math.hypot(dx,dy)>22*k){
    pMoved=true;
    const localX=pStartX-arena.x;
    if(localX<arena.w*0.62&&game.screen==='playing'){
      if(Math.abs(dx)>Math.abs(dy))moveSel(Math.sign(dx),0);
      else moveSel(0,Math.sign(dy));
    }
  }
}
function onUp(e){
  if(!pDown)return;
  pDown=false;
  if(!pMoved&&game.menu==='build'&&game.sel>=0){
    // 轻点不重复处理
  }
  if(e.cancelable)e.preventDefault();
}
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',e=>{if(pDown)onMove(e);});
window.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});
canvas.addEventListener('touchcancel',onUp,{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  SFX.ensure();
  const key=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(key)>=0)e.preventDefault();
  if(key==='m'){SFX.setMuted(!SFX.muted);SFX.play('ui');return;}
  if(key==='r'){resetGame();return;}
  if(key==='p'||key==='escape'){
    if(game.menu){game.menu=null;return;}
    if(game.screen==='playing')game.screen='paused';
    else if(game.screen==='paused')game.screen='playing';
    SFX.play('ui');return;
  }
  if(key==='enter'||key===' '){
    if(game.menu==='build'&&game.menuType&&key!==' '){return;}
    if(game.menu==='help'){game.menu=null;return;}
    confirmAction();return;
  }
  if(key==='1'||key==='2'||key==='3'||key==='4'){
    if(game.menu==='build'){
      const i=parseInt(key,10)-1;
      game.menuType=TOWER_ORDER[i];
      if(game.sel>=0&&!pads[game.sel].tower&&game.coins>=TOWERS[game.menuType].cost){
        buildTower(pads[game.sel],game.menuType);game.menu=null;
      }else SFX.play('ui');
    }else{
      game.speed=(key==='2')?2:1;SFX.play('ui');
    }
    return;
  }
  if(key==='arrowleft'||key==='a')moveSel(-1,0);
  else if(key==='arrowright'||key==='d')moveSel(1,0);
  else if(key==='arrowup'||key==='w')moveSel(0,-1);
  else if(key==='arrowdown'||key==='s')moveSel(0,1);
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&game.screen==='playing')game.screen='paused';
});

/* =========================================================
   18. 主循环
   ========================================================= */
const STEP=1/60;
let lastT=0,acc=0;
function frame(ts){
  const now=ts/1000;
  let dt=now-lastT;
  if(!isFinite(dt)||dt<0)dt=0;
  lastT=now;
  dt=Math.min(dt,0.1);
  acc+=dt;
  let guard=0;
  while(acc>=STEP&&guard<8){
    update(STEP*game.speed);
    acc-=STEP;guard++;
  }
  if(guard>=8)acc=0;
  render();
  requestAnimationFrame(frame);
}

function render(){
  hotspots=[];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0B0D12';
  ctx.fillRect(0,0,W,H);

  // 世界裁剪
  ctx.save();
  ctx.beginPath();
  ctx.rect(arena.x,arena.y,arena.w,arena.h);
  ctx.clip();

  let sx=0,sy=0;
  if(game.shake>0){
    sx=rand(-game.shake,game.shake)*k;
    sy=rand(-game.shake,game.shake)*k;
    ctx.translate(sx,sy);
  }
  drawWorld();
  ctx.restore();

  // 命中闪光 / 受击红晕
  if(game.flash>0){
    const g=ctx.createRadialGradient(W/2,arena.y+arena.h/2,Math.min(W,arena.h)*0.2,W/2,arena.y+arena.h/2,Math.max(W,arena.h)*0.8);
    g.addColorStop(0,'rgba(255,91,114,0)');
    g.addColorStop(1,'rgba(255,91,114,'+(game.flash*0.5)+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // 边框
  ctx.strokeStyle='rgba(59,67,88,0.75)';ctx.lineWidth=2;
  ctx.strokeRect(1,arena.y+1,W-2,arena.h-2);
  drawCorners();

  drawHUD();
  drawMenu();
  drawOverlay();

  // CRT
  const pat=scanlinePattern();
  if(pat){ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);}
  if(vignette){ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);}
}
function drawCorners(){
  const s=18*k,p=8*k;
  ctx.strokeStyle='rgba(85,247,255,0.30)';ctx.lineWidth=2*k;
  const corners=[[p,arena.y+p,1,1],[W-p,arena.y+p,-1,1],[p,arena.y+arena.h-p,1,-1],[W-p,arena.y+arena.h-p,-1,-1]];
  for(const c of corners){
    ctx.beginPath();
    ctx.moveTo(c[0]+c[2]*s,c[1]);
    ctx.lineTo(c[0],c[1]);
    ctx.lineTo(c[0],c[1]+c[3]*s);
    ctx.stroke();
  }
}

/* =========================================================
   19. 启动
   ========================================================= */
buildPath();
resize();
pads=PAD_POS.map((p,i)=>({x:p.x,y:p.y,tower:null,idx:i}));
requestAnimationFrame(frame);

})();
</script>
