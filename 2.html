<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>砖块破坏者</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#0b0d18;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    width:100%; height:100%; display:flex;
    align-items:center; justify-content:center;
  }
  canvas {
    display:block; border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06);
    cursor:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<script>
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = a => a[(Math.random() * a.length) | 0];

/* ================= 基本配置 ================= */
const CFG = {
  W: 800, H: 1000,
  PADDLE_W: 132, PADDLE_H: 20,
  BALL_R: 10, BALL_SPD: 620, BALL_SPD_MAX: 940,
  PADDLE_ACCEL: 4200, PADDLE_SPEED: 860, PADDLE_FRICTION: 7,
  BRICK_TOP: 118, BRICK_H: 34, BRICK_PAD: 6,
  BULLET_SPD: 330, BOSS_HP: 24
};
const STATE = { MENU:0, PLAY:1, PAUSE:2, CLEAR:3, OVER:4 };

/* 道具定义 */
const PWR = {
  wide:   { label:'长', color:'#b24dff', name:'光板加长 15s' },
  multi:  { label:'散', color:'#22d3ee', name:'多球分裂'     },
  pierce: { label:'穿', color:'#ffa62b', name:'穿透球 9s'    },
  shield: { label:'盾', color:'#4dff9e', name:'护盾 +1'      },
};

/* ================= 音效（WebAudio 极简合成） ================= */
const Sfx = (() => {
  let ac = null, master = null;
  function init() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.22;
      master.connect(ac.destination);
    } catch (e) { /* 无音频环境时静默 */ }
  }
  function beep(freq, dur = 0.07, type = 'square', vol = 1, slide = 0) {
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol * 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    init,
    paddle(){ beep(260, 0.07, 'square', 1, 60); },
    brick(){ beep(320 + Math.random()*160, 0.06, 'triangle', 1, -120); },
    tough(){ beep(520, 0.05, 'square', 0.7); },
    wall(){ beep(200, 0.06, 'triangle', 1, -40); },
    power(){ beep(660, 0.09, 'sine', 1, 320); },
    shieldBlock(){ beep(420, 0.12, 'sine', 1, -220); },
    hit(){ beep(150, 0.12, 'sawtooth', 1, -60); },
    shoot(){ beep(880, 0.05, 'square', 0.6, -300); },
    boom(){ beep(90, 0.35, 'sawtooth', 1, -50); },
    clear(){ beep(520, 0.12, 'sine', 1, 220); setTimeout(()=>beep(720,0.14,'sine',1,260), 120); },
    over(){ beep(220, 0.5, 'sawtooth', 1, -160); }
  };
})();

/* ================= 输入 ================= */
const Input = {
  left:false, right:false,
  keys:{},
};
function bindInput(canvas) {
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width  * CFG.W,
      y: (e.clientY - r.top)  / r.height * CFG.H
    };
  };

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    Sfx.init();
    const p = pos(e);
    Game.onPointerDown(p.x, p.y, e.pointerId);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });

  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    const p = pos(e);
    Game.onPointerMove(p.x, p.y, e.pointerId);
  });

  const up = e => {
    Game.onPointerUp(e.pointerId);
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowleft','arrowright',' ','arrowup','p','escape','enter','a','d'].includes(k)) e.preventDefault();
    Sfx.init();
    if (Input.keys[k]) return;
    Input.keys[k] = true;
    if (k === 'arrowleft' || k === 'a') Input.left = true;
    if (k === 'arrowright' || k === 'd') Input.right = true;
    if (k === ' ' || k === 'arrowup')   Game.mainAction();
    if (k === 'p' || k === 'escape')    Game.togglePause();
    if (k === 'enter')                  Game.mainAction();
  }, { passive:false });

  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    Input.keys[k] = false;
    if (k === 'arrowleft' || k === 'a') Input.left = false;
    if (k === 'arrowright' || k === 'd') Input.right = false;
  });
}

/* ================= 画布适配 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / CFG.W, vh / CFG.H) * 0.97;
  const cssW = Math.round(CFG.W * scale);
  const cssH = Math.round(CFG.H * scale);
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(canvas.width / CFG.W, 0, 0, canvas.height / CFG.H, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ================= 工具 ================= */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ================= 光板 ================= */
class Paddle {
  constructor() {
    this.w = CFG.PADDLE_W; this.h = CFG.PADDLE_H;
    this.x = CFG.W / 2;
    this.y = CFG.H - 108;
    this.vx = 0;
    this.targetX = null;
    this.shield = 0;
    this.wideT = 0;
    this.flash = 0;
    this.mouseDrive = false;
  }
  reset() {
    this.x = CFG.W / 2; this.vx = 0; this.targetX = null;
    this.shield = 0; this.wideT = 0;
  }
  update(dt) {
    if (this.wideT > 0) {
      this.wideT -= dt;
      const k = clamp(this.wideT / 1.2, 0, 1);
      this.w += (CFG.PADDLE_W * (1 + 0.45 * k) - this.w) * 0.15;
    } else {
      this.w += (CFG.PADDLE_W - this.w) * 0.15;
    }

    const kb = (Input.left ? -1 : 0) + (Input.right ? 1 : 0);
    if (kb !== 0) {
      this.targetX = null;
      this.vx += kb * CFG.PADDLE_ACCEL * dt;
    } else if (this.targetX !== null) {
      const d = this.targetX - this.x;
      if (Math.abs(d) < 1.5) { this.x = this.targetX; this.vx = 0; }
      else this.vx = clamp(d * 16, -CFG.PADDLE_SPEED * 2, CFG.PADDLE_SPEED * 2);
    } else {
      this.vx *= Math.exp(-CFG.PADDLE_FRICTION * dt);
    }
    this.vx = clamp(this.vx, -CFG.PADDLE_SPEED * 2, CFG.PADDLE_SPEED * 2);

    this.x += this.vx * dt;
    const half = this.w / 2;
    if (this.x < half) { this.x = half; this.vx = 0; }
    if (this.x > CFG.W - half) { this.x = CFG.W - half; this.vx = 0; }
    if (this.flash > 0) this.flash -= dt * 3;
  }
  draw() {
    const { x, y, w, h } = this;
    ctx.save();

    if (this.shield > 0) {
      ctx.strokeStyle = 'rgba(80,240,255,0.85)';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#22e6ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(x, y + h / 2, w / 2 + 22, 36, 0, 0, TAU);
      ctx.stroke();
    }

    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, '#ff2fb3');
    g.addColorStop(0.5, '#b24dff');
    g.addColorStop(1, '#22e6ff');

    ctx.shadowColor = this.flash > 0 ? '#ffffff' : 'rgba(178,77,255,0.9)';
    ctx.shadowBlur = this.flash > 0 ? 26 : 16;
    ctx.fillStyle = g;
    rr(ctx, x - w / 2, y, w, h, h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rr(ctx, x - w / 2 + 8, y + 3, w - 16, h * 0.34, h * 0.17);
    ctx.fill();

    const glow = ctx.createRadialGradient(x, y + h, 2, x, y + h, w * 0.55);
    glow.addColorStop(0, 'rgba(178,77,255,0.35)');
    glow.addColorStop(1, 'rgba(178,77,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - w * 0.6, y + h, w * 1.2, 34);
    ctx.restore();
  }
}

/* ================= 小球 ================= */
class Ball {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.r = CFG.BALL_R;
    this.pierce = 0;
    this.stuck = true;      // 停在光板上等待发射
    this.stickOffset = 0;
    this.alive = true;
    this.trail = [];
  }
  update(dt, g) {
    if (this.stuck) {
      this.x = g.paddle.x + this.stickOffset;
      this.y = g.paddle.y - this.r - 2;
      return;
    }

    const steps = Math.max(1, Math.ceil(Math.hypot(this.vx, this.vy) * dt / (this.r * 0.9)));
    const sdt = dt / steps;

    for (let s = 0; s < steps && this.alive; s++) {
      this.x += this.vx * sdt;
      this.y += this.vy * sdt;

      if (this.x - this.r < 0) {
        this.x = this.r;
        this.vx = Math.abs(this.vx);
        Sfx.wall();
        g.spawnBurst(this.x, this.y, '#22e6ff', 5, 120);
      } else if (this.x + this.r > CFG.W) {
        this.x = CFG.W - this.r;
        this.vx = -Math.abs(this.vx);
        Sfx.wall();
        g.spawnBurst(this.x, this.y, '#22e6ff', 5, 120);
      }
      if (this.y - this.r < 0) {
        this.y = this.r;
        this.vy = Math.abs(this.vy);
        Sfx.wall();
        g.spawnBurst(this.x, this.y, '#22e6ff', 5, 120);
      }

      // 光板碰撞
      const p = g.paddle;
      if (this.vy > 0 &&
          this.y + this.r > p.y && this.y - this.r < p.y + p.h &&
          this.x > p.x - p.w / 2 - this.r && this.x < p.x + p.w / 2 + this.r) {
        this.y = p.y - this.r;
        const off = clamp((this.x - p.x) / (p.w / 2), -1, 1);
        const angle = off * 1.02;
        const speed = clamp(Math.hypot(this.vx, this.vy) * 1.012, CFG.BALL_SPD, CFG.BALL_SPD_MAX);
        this.vx = Math.sin(angle) * speed + p.vx * 0.14;
        this.vy = -Math.abs(Math.cos(angle) * speed);
        const cur = Math.hypot(this.vx, this.vy);
        if (cur > CFG.BALL_SPD_MAX) {
          this.vx *= CFG.BALL_SPD_MAX / cur;
          this.vy *= CFG.BALL_SPD_MAX / cur;
        }
        Sfx.paddle();
        g.spawnBurst(this.x, p.y, '#b24dff', 6, 150);
        p.flash = 1;
      }

      // 砖块碰撞
      for (const b of g.bricks) {
        if (!b.alive) continue;
        const cx = clamp(this.x, b.x, b.x + b.w);
        const cy = clamp(this.y, b.y, b.y + b.h);
        const dx = this.x - cx, dy = this.y - cy;
        if (dx * dx + dy * dy <= this.r * this.r) {
          const overlapX = this.r - Math.abs(dx);
          const overlapY = this.r - Math.abs(dy);
          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx === 0) { this.vy *= -1; }
            else {
              this.vx = Math.abs(this.vx) * Math.sign(dx);
              this.x += overlapX * Math.sign(dx);
            }
          } else {
            if (dy === 0) { this.vx *= -1; }
            else {
              this.vy = Math.abs(this.vy) * Math.sign(dy);
              this.y += overlapY * Math.sign(dy);
            }
          }
          if (this.pierce > 0 && b.hp > 0 && b.tough === 0) {
            // 穿透球不反弹
          }
          b.hit(g);
          if (this.pierce <= 0) break;
        }
      }

      // 护盾：接住落球并弹回（消耗一次护盾）
      if (this.vy > 0 && this.y > g.paddle.y + g.paddle.h + 6 && g.paddle.shield > 0) {
        const pad = g.paddle;
        pad.shield = 0;
        this.y = pad.y + pad.h + this.r + 2;
        this.vy = -Math.abs(this.vy) * 1.02;
        const off = clamp((this.x - pad.x) / (pad.w / 2), -1, 1);
        this.vx = off * Math.abs(this.vy) * 0.85 + pad.vx * 0.12;
        g.spawnBurst(this.x, this.y, '#50f0ff', 22, 300);
        g.addFloat('护盾救球', this.x, this.y - 22, '#50f0ff');
        g.addShake(0.5);
        Sfx.power();
      }

      // 落底
      if (this.y - this.r > CFG.H + 26) this.alive = false;
    }

    // 轨迹
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 9) this.trail.shift();
    if (this.pierce > 0) this.pierce -= dt;
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length) * 0.28;
      ctx.fillStyle = this.pierce > 0 ? `rgba(255,166,43,${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.r * (0.35 + i / this.trail.length * 0.55), 0, TAU);
      ctx.fill();
    }

    ctx.save();
    const col = this.pierce > 0 ? '#ffa62b' : '#ffd98a';
    ctx.shadowColor = col;
    ctx.shadowBlur = this.pierce > 0 ? 24 : 14;
    const g = ctx.createRadialGradient(
      this.x - this.r * 0.35, this.y - this.r * 0.4, this.r * 0.1,
      this.x, this.y, this.r
    );
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.42, col);
    g.addColorStop(1, this.pierce > 0 ? 'rgba(255,140,20,0.85)' : 'rgba(255,190,110,0.85)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ================= 砖块 ================= */
class Brick {
  constructor(x, y, w, h, hp, color, tough = 0) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.hp = hp; this.maxHp = hp;
    this.color = color;
    this.tough = tough;      // 0 普通, 1 强化(铁), 2 不可破坏
    this.alive = true;
    this.shake = 0;
    this.drop = null;
    this.flash = 0;
  }
  hit(g) {
    if (this.tough === 2) {
      this.shake = 1;
      Sfx.tough();
      g.spawnBurst(g.ballPreviewX || this.x + this.w / 2, this.y + this.h, '#9aa6c2', 5, 160);
      return;
    }
    this.hp -= 1;
    this.shake = 1;
    this.flash = 1;
    if (this.hp <= 0) {
      this.alive = false;
      g.addShake(this.tough === 1 ? 0.42 : 0.22);
      g.spawnBurst(this.x + this.w / 2, this.y + this.h / 2, this.color,
        this.tough === 1 ? 18 : 12,
        this.tough === 1 ? 260 : 190);
      g.addScore(this.tough === 1 ? 30 : 10);
      if (this.drop) g.spawnPowerUp(this.x + this.w / 2, this.y + this.h / 2, this.drop);
      if (this.tough === 1) Sfx.boom(); else Sfx.brick();
    } else {
      Sfx.tough();
    }
  }
  draw() {
    if (!this.alive) return;
    const sx = this.shake > 0 ? (Math.random() - 0.5) * 6 * this.shake : 0;
    const x = this.x + sx, y = this.y;

    ctx.save();
    if (this.tough === 2) {
      const g = ctx.createLinearGradient(x, y, x, y + this.h);
      g.addColorStop(0, '#3a4361');
      g.addColorStop(0.5, '#232a41');
      g.addColorStop(1, '#161c2c');
      ctx.fillStyle = g;
      rr(ctx, x, y, this.w, this.h, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(120,140,180,0.55)'; ctx.lineWidth = 2;
      rr(ctx, x, y, this.w, this.h, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(160,180,220,0.35)'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + 8, y + this.h * 0.62);
      ctx.lineTo(x + this.w * 0.35, y + this.h * 0.36);
      ctx.lineTo(x + this.w * 0.58, y + this.h * 0.62);
      ctx.lineTo(x + this.w - 8, y + this.h * 0.34);
      ctx.stroke();
    } else if (this.tough === 1) {
      const g = ctx.createLinearGradient(x, y, x + this.w, y + this.h);
      g.addColorStop(0, '#98a6c8');
      g.addColorStop(0.5, this.color);
      g.addColorStop(1, '#5c6a92');
      ctx.fillStyle = g;
      rr(ctx, x, y, this.w, this.h, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      rr(ctx, x + 5, y + 4, this.w - 10, this.h * 0.3, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
      rr(ctx, x, y, this.w, this.h, 7); ctx.stroke();
    } else {
      const g = ctx.createLinearGradient(x, y, x, y + this.h);
      const hpK = this.hp / this.maxHp;
      g.addColorStop(0, this.flash > 0 ? '#ffffff' : this.color);
      g.addColorStop(1, shade(this.color, -0.32 - (1 - hpK) * 0.18));
      ctx.fillStyle = g;
      rr(ctx, x, y, this.w, this.h, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      rr(ctx, x + 5, y + 4, this.w - 10, this.h * 0.32, 4); ctx.fill();
    }

    if (this.drop) {
      const pulse = 0.55 + Math.sin(Game.t * 6) * 0.25;
      ctx.fillStyle = PWR[this.drop].color;
      ctx.globalAlpha = pulse;
      ctx.beginPath();
      ctx.arc(x + this.w - 11, y + 11, 4.2, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.12);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.18);
  }
}

function shade(hex, amt) {
  const c = hex.replace('#','');
  const n = parseInt(c.length === 3 ? c.split('').map(x=>x+x).join('') : c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r + 255 * amt), 0, 255);
  g = clamp(Math.round(g + 255 * amt), 0, 255);
  b = clamp(Math.round(b + 255 * amt), 0, 255);
  return `rgb(${r},${g},${b})`;
}

/* ================= 弹幕 ================= */
class Bullet {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = 7; this.alive = true;
  }
  update(dt, g) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.y > CFG.H + 30 || this.x < -30 || this.x > CFG.W + 30) {
      this.alive = false;
      return;
    }
    const p = g.paddle;
    const dx = this.x - p.x, dy = this.y - (p.y + p.h / 2);
    const inShieldBand = this.y > p.y - 42 && this.y < p.y + 6 && Math.abs(dx) < p.w / 2 + 22;

    if (p.shield > 0 && inShieldBand) {
      p.shield = 0;
      this.alive = false;
      g.spawnBurst(this.x, this.y, '#50f0ff', 14, 240);
      g.addFloat('护盾抵挡!', p.x, p.y - 40, '#50f0ff');
      Sfx.shieldBlock();
      return;
    }

    if (this.y + this.r > p.y && this.y - this.r < p.y + p.h &&
        this.x > p.x - p.w / 2 && this.x < p.x + p.w / 2) {
      this.alive = false;
      g.loseLife();
    }
  }
  draw() {
    ctx.save();
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 18;
    const g = ctx.createRadialGradient(this.x - 2, this.y - 2, 1, this.x, this.y, this.r + 3);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, '#ff7b8e');
    g.addColorStop(1, 'rgba(255,40,80,0.2)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ================= 道具图标：气泡里包裹“变化后的小球/光板” ================= */
function drawPowerIcon(ctx, type, S) {
  const def = PWR[type];
  const R = S * 0.5;
  ctx.save();

  // 气泡外壳
  ctx.shadowColor = def.color;
  ctx.shadowBlur = 18;
  const bg = ctx.createRadialGradient(-R * 0.35, -R * 0.45, R * 0.1, 0, 0, R);
  bg.addColorStop(0, 'rgba(255,255,255,0.26)');
  bg.addColorStop(0.55, 'rgba(20,26,42,0.88)');
  bg.addColorStop(1, 'rgba(12,16,28,0.95)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = def.color;
  ctx.beginPath();
  ctx.arc(0, 0, R - 1, 0, TAU);
  ctx.stroke();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.34)';
  ctx.beginPath();
  ctx.ellipse(-R * 0.34, -R * 0.44, R * 0.26, R * 0.15, -0.6, 0, TAU);
  ctx.fill();

  const c = def.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (type === 'wide') {
    /* 加长光板 + 两端外扩箭头 */
    const w = R * 1.42, h = R * 0.3;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#ff2fb3');
    g.addColorStop(0.5, '#b24dff');
    g.addColorStop(1, '#22e6ff');
    ctx.fillStyle = g;
    rr(ctx, -w / 2, R * 0.1, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * R * 0.34, -R * 0.3);
      ctx.lineTo(s * R * 0.76, -R * 0.3);
      ctx.lineTo(s * R * 0.6, -R * 0.45);
      ctx.moveTo(s * R * 0.76, -R * 0.3);
      ctx.lineTo(s * R * 0.6, -R * 0.15);
      ctx.stroke();
    }
  } else if (type === 'multi') {
    /* 三颗分裂小球 */
    const pts = [[0, -R * 0.34], [-R * 0.5, R * 0.3], [R * 0.5, R * 0.3]];
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.02); ctx.lineTo(-R * 0.5, R * 0.22);
    ctx.moveTo(0, -R * 0.02); ctx.lineTo(R * 0.5, R * 0.22);
    ctx.stroke();
    for (let i = 0; i < pts.length; i++) {
      const px = pts[i][0], py = pts[i][1];
      const g = ctx.createRadialGradient(px - 1, py - 1, 0.5, px, py, R * 0.3);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.42, i === 0 ? '#ff9ee6' : '#7df9ff');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, R * 0.3, 0, TAU);
      ctx.fill();
    }
  } else if (type === 'pierce') {
    /* 小球 + 贯穿箭 + 被打穿的砖 */
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    rr(ctx, R * 0.12, -R * 0.62, R * 0.78, R * 0.28, 3);
    ctx.fill();

    const g = ctx.createRadialGradient(-R * 0.36, R * 0.2, 1, -R * 0.22, R * 0.28, R * 0.36);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, '#ffd98a');
    g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(-R * 0.22, R * 0.28, R * 0.34, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = c;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-R * 0.8, R * 0.66);
    ctx.lineTo(R * 0.58, -R * 0.32);
    ctx.stroke();
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(R * 0.72, -R * 0.48);
    ctx.lineTo(R * 0.36, -R * 0.3);
    ctx.lineTo(R * 0.58, -R * 0.02);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'shield') {
    /* 光板 + 护罩气泡 + 被弹开的小球 */
    const w = R * 1.02, h = R * 0.26;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#ff2fb3');
    g.addColorStop(1, '#22e6ff');
    ctx.fillStyle = g;
    rr(ctx, -w / 2, R * 0.36, w, h, h / 2);
    ctx.fill();

    ctx.strokeStyle = c;
    ctx.lineWidth = 2.6;
    ctx.shadowColor = c;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, R * 0.3, R * 0.82, R * 0.66, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(-R * 0.58, -R * 0.24, R * 0.16, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-R * 0.38, -R * 0.42);
    ctx.lineTo(-R * 0.12, -R * 0.6);
    ctx.stroke();
  }
  ctx.restore();
}

/* ================= 掉落道具 ================= */
class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.w = 34; this.h = 34;
    this.vy = 165;
    this.t = 0;
    this.alive = true;
  }
  update(dt) {
    this.t += dt;
    this.y += this.vy * dt;
    if (this.y > CFG.H + 40) this.alive = false;
  }
  draw(ctx) {
    const bob = Math.sin(this.t * 3) * 2.5;
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    drawPowerIcon(ctx, this.type, this.w);
    ctx.restore();
  }
}

/* ================= Boss ================= */
class Boss {
  constructor(level) {
    this.w = 150; this.h = 92;
    this.x = CFG.W / 2; this.y = 200;
    this.dir = 1;
    this.speed = 78 + level * 6;
    this.hp = CFG.BOSS_HP + level * 8;
    this.maxHp = this.hp;
    this.phase = 0;
    this.rageT = 0;
    this.flash = 0;
    this.alive = true;
  }
  update(dt, g) {
    this.x += this.dir * this.speed * dt;
    if (this.x < this.w / 2 + 20) { this.x = this.w / 2 + 20; this.dir = 1; }
    if (this.x > CFG.W - this.w / 2 - 20) { this.x = CFG.W - this.w / 2 - 20; this.dir = -1; }

    this.phase += dt;
    this.rageT += dt;
    this.flash = Math.max(0, this.flash - dt * 3);

    const hpK = this.hp / this.maxHp;
    const interval = hpK > 0.5 ? 1.15 : 0.7;

    if (this.phase > interval) {
      this.phase = 0;
      const px = g.paddle.x;
      const spread = hpK > 0.5 ? 0.22 : 0.38;

      const a1 = Math.atan2(g.paddle.y - this.y, px - this.x);
      g.bullets.push(new Bullet(this.x, this.y + this.h / 2,
        Math.cos(a1) * CFG.BULLET_SPD, Math.sin(a1) * CFG.BULLET_SPD));
      for (const o of [-spread, spread]) {
        const a = a1 + o;
        g.bullets.push(new Bullet(this.x, this.y + this.h / 2,
          Math.cos(a) * CFG.BULLET_SPD * 0.92, Math.sin(a) * CFG.BULLET_SPD * 0.92));
      }
      Sfx.shoot();
      this.flash = 1;
    }

    if (this.rageT > 3.2 && hpK < 0.45) {
      this.rageT = 0;
      for (let i = -2; i <= 2; i++) {
        const a = Math.PI / 2 + i * 0.26;
        g.bullets.push(new Bullet(this.x, this.y + this.h / 2,
          Math.cos(a) * CFG.BULLET_SPD * 0.85, Math.sin(a) * CFG.BULLET_SPD * 0.85));
      }
      g.addShake(0.4);
    }

    for (const b of g.balls) {
      if (b.stuck) continue;
      const cx = clamp(b.x, this.x - this.w / 2, this.x + this.w / 2);
      const cy = clamp(b.y, this.y - this.h / 2, this.y + this.h / 2);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy < b.r * b.r) {
        b.vy = Math.abs(b.vy) * (b.y > this.y ? 1 : -1);
        if (b.y > this.y) b.y = this.y + this.h / 2 + b.r;
        this.hp -= b.pierce > 0 ? 3 : 2;
        g.spawnBurst(b.x, b.y, '#ffe28a', 10, 220);
        Sfx.tough();
        if (this.hp <= 0) {
          this.alive = false;
          g.addScore(600);
          g.addShake(1.1);
          g.spawnBurst(this.x, this.y, '#ff5b6e', 60, 420);
          g.spawnPowerUp(this.x - 30, this.y, pick(['multi','shield','wide','pierce']));
          g.spawnPowerUp(this.x + 30, this.y, pick(['multi','shield','wide','pierce']));
          Sfx.boom();
          setTimeout(() => Sfx.clear(), 200);
        }
      }
    }
  }
  draw() {
    const { x, y, w, h } = this;
    ctx.save();
    ctx.translate(x, y);

    const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    g.addColorStop(0, this.flash > 0 ? '#ffffff' : '#7b2d8e');
    g.addColorStop(0.5, this.flash > 0 ? '#ffd7e6' : '#c23c72');
    g.addColorStop(1, '#2c2b8a');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(220,70,140,0.8)';
    ctx.shadowBlur = 26;
    rr(ctx, -w / 2, -h / 2, w, h, 16);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    rr(ctx, -w / 2 + 12, -h / 2 + 10, w - 24, h * 0.28, 10);
    ctx.fill();

    for (const s of [-1, 1]) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(s * w * 0.22, -h * 0.06, 11, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#3a1020';
      ctx.beginPath();
      ctx.arc(s * w * 0.22 + this.dir * 3, -h * 0.06, 5, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    rr(ctx, -w * 0.18, h * 0.2, w * 0.36, 8, 4);
    ctx.fill();

    ctx.restore();

    const bw = 240, bh = 10, bx = CFG.W / 2 - bw / 2, by = 52;
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(ctx, bx, by, bw, bh, 5); ctx.fill();
    const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    gg.addColorStop(0, '#ff5b6e'); gg.addColorStop(1, '#ffb04d');
    ctx.fillStyle = gg;
    rr(ctx, bx, by, bw * clamp(this.hp / this.maxHp, 0, 1), bh, 5); ctx.fill();
    ctx.fillStyle = '#9aa6c2';
    ctx.font = 'bold 16px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('关卡 Boss', CFG.W / 2, 42);
    ctx.textAlign = 'left';
  }
}

/* ================= 游戏主逻辑 ================= */
const Game = {
  /* 输入 / 指针状态 */
  pointer: { down:false, id:null, startX:0, startY:0, startT:0, moved:0, half:'left', prevTarget:null },

  /* 资源 */
  paddle: new Paddle(),
  balls: [], bricks: [], bullets: [], powerups: [],
  particles: [], floats: [], boss: null,
  level: 1,
  maxLevel: 1,
  score: 0,
  lives: 3,
  state: STATE.MENU,
  t: 0,
  shake: 0,
  shakeMag: 0,

  /* ---------- 关卡生成 ---------- */
  buildLevel(n) {
    this.bricks = [];
    this.bullets = [];
    this.powerups = [];
    this.boss = null;

    const rows = clamp(6 + Math.floor(n / 2), 6, 10);
    const cols = 9;
    const totalW = CFG.W - 36;
    const bw = (totalW - CFG.BRICK_PAD * (cols - 1)) / cols;
    const bh = CFG.BRICK_H;
    const palette = ['#22e6ff','#22d3ee','#b24dff','#ff2fb3','#ff6b6b','#ffa62b','#ffd93d','#4dff9e','#3ba7ff','#7c5cff'];

    let dropQueue = ['wide','multi','pierce','shield','multi','wide','shield','pierce'];
    dropQueue = dropQueue.sort(() => Math.random() - 0.5);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = 18 + c * (bw + CFG.BRICK_PAD);
        const y = CFG.BRICK_TOP + r * (bh + CFG.BRICK_PAD);
        const toughChance = n >= 2 ? Math.min(0.1 + n * 0.02, 0.26) : 0.07;

        let hp = 1;
        let tough = 0;
        const roll = Math.random();
        if (roll < toughChance) { tough = 1; hp = 3; }
        else if (n >= 2 && roll > 0.93) { tough = 2; hp = 999; }
        else { hp = Math.random() < 0.18 + n * 0.02 ? 2 : 1; }

        const color = palette[(r + c + n) % palette.length];
        const b = new Brick(x, y, bw, bh, hp, color, tough);
        if (dropQueue.length && Math.random() < 0.13) b.drop = dropQueue.pop();
        this.bricks.push(b);
      }
    }

    /* 第 3 关起加入 Boss */
    if (n >= 3) this.boss = new Boss(n);
  },

  start(level = 1) {
    Sfx.init();
    this.level = level;
    this.maxLevel = Math.max(this.maxLevel, level);
    this.score = this.score;      // 续关保留分数
    this.lives = 3;
    this.paddle.reset();
    this.paddle.x = CFG.W / 2;
    this.balls = [new Ball(CFG.W / 2, CFG.H - 130, 0, 0)];
    this.buildLevel(level);
    this.state = STATE.PLAY;
  },

  nextLevel() {
    this.level += 1;
    this.maxLevel = Math.max(this.maxLevel, this.level);
    this.paddle.reset();
    this.balls = [new Ball(this.paddle.x, this.paddle.y - 20, 0, 0)];
    this.buildLevel(this.level);
    this.state = STATE.PLAY;
  },

  launch() {
    let launched = false;
    for (const b of this.balls) {
      if (b.stuck) {
        b.stuck = false;
        const angle = rand(-0.5, 0.5);
        b.vx = Math.sin(angle) * CFG.BALL_SPD;
        b.vy = -Math.cos(angle) * CFG.BALL_SPD;
        launched = true;
      }
    }
    if (launched) Sfx.paddle();
    return launched;
  },

  mainAction() {
    if (this.state === STATE.MENU) { this.start(this.maxLevel > 1 ? this.maxLevel : 1); return; }
    if (this.state === STATE.PLAY) { this.launch(); return; }
    if (this.state === STATE.PAUSE) { this.togglePause(); return; }
    if (this.state === STATE.CLEAR) { this.nextLevel(); return; }
    if (this.state === STATE.OVER) { this.start(1); return; }
  },

  togglePause() {
    if (this.state === STATE.PLAY) this.state = STATE.PAUSE;
    else if (this.state === STATE.PAUSE) this.state = STATE.PLAY;
  },

  /* ---------- 交互 ---------- */
  onPointerDown(x, y, id) {
    const btn = this.hitButton(x, y);
    if (btn) { this.handleButton(btn); return; }

    if (this.state === STATE.MENU) { this.start(this.maxLevel > 1 ? this.maxLevel : 1); return; }
    if (this.state === STATE.CLEAR) { this.nextLevel(); return; }
    if (this.state === STATE.OVER) { this.start(1); return; }
    if (this.state === STATE.PAUSE) { this.togglePause(); return; }
    if (this.state !== STATE.PLAY) return;

    const p = this.pointer;
    p.down = true; p.id = id;
    p.startX = x; p.startY = y; p.startT = this.t;
    p.moved = 0;
    p.half = x < CFG.W * 0.5 ? 'left' : 'right';
    p.prevTarget = this.paddle.targetX;
    this.paddle.targetX = x;          // 按下即跟手，左右半屏都可拖动
  },

  onPointerMove(x, y, id) {
    const p = this.pointer;
    if (!p.down || this.state !== STATE.PLAY) return;
    if (id !== undefined && p.id !== id) return;
    p.moved = Math.max(p.moved, Math.abs(x - p.startX) + Math.abs(y - p.startY) * 0.35);
    this.paddle.targetX = x;          // 全屏跟随，越过中线不再卡住
  },

  onPointerUp(id) {
    const p = this.pointer;
    if (!p.down) return;
    if (id !== undefined && p.id !== id) return;
    p.down = false;

    const quick = (this.t - p.startT) < 0.42;
    const tap = p.moved < 16;

    /* 右半屏轻点 = 主操作（发球）；撤销这次点击带来的位移 */
    if (this.state === STATE.PLAY && tap && quick && p.half === 'right') {
      this.paddle.targetX = p.prevTarget;
      this.launch();
    }
  },

  hitButton(x, y) {
    const boxes = [
      { id:'pause', x: CFG.W - 118, y: 18, w: 44, h: 44 },
      { id:'sound', x: CFG.W - 64,  y: 18, w: 44, h: 44 },
    ];
    if (this.state === STATE.MENU)
      boxes.push({ id:'start', x: CFG.W/2 - 110, y: CFG.H/2 + 40, w: 220, h: 62 });
    if (this.state === STATE.CLEAR)
      boxes.push({ id:'next',  x: CFG.W/2 - 110, y: CFG.H/2 + 40, w: 220, h: 62 });
    if (this.state === STATE.OVER)
      boxes.push({ id:'retry', x: CFG.W/2 - 110, y: CFG.H/2 + 40, w: 220, h: 62 });

    for (const b of boxes)
      if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return b.id;
    return null;
  },

  handleButton(id) {
    if (id === 'pause') return this.togglePause();
    if (id === 'sound') return (Sfx.muted = !Sfx.muted);
    if (id === 'start') return this.start(this.maxLevel > 1 ? this.maxLevel : 1);
    if (id === 'next')  return this.nextLevel();
    if (id === 'retry') return this.start(1);
  },

  /* ---------- 道具 ---------- */
  spawnPowerUp(x, y, type) {
    this.powerups.push(new PowerUp(x, y, type));
  },

  applyPower(type) {
    const p = this.paddle;
    if (type === 'wide') {
      p.wideT = 15;
    } else if (type === 'multi') {
      const src = this.balls.filter(b => !b.stuck);
      const base = src.length ? src : this.balls;
      const newBalls = [];
      for (const b of base) {
        for (const k of [-1, 1]) {
          const ang = Math.atan2(b.vy, b.vx) + k * 0.55;
          const spd = Math.hypot(b.vx, b.vy) || CFG.BALL_SPD;
          if (this.balls.length + newBalls.length < 24) {
            newBalls.push(new Ball(b.x, b.y, Math.cos(ang) * spd, Math.sin(ang) * spd));
          }
        }
      }
      for (const b of newBalls) b.stuck = false;
      this.balls.push(...newBalls);
    } else if (type === 'pierce') {
      for (const b of this.balls) b.pierce = 9;
    } else if (type === 'shield') {
      p.shield = 1;
    }
    Sfx.power();
  },

  /* ---------- 特效 ---------- */
  spawnBurst(x, y, color, n = 12, speed = 200) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const s = rand(speed * 0.25, speed);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 40,
        life: rand(0.35, 0.8),
        max: 0.8,
        r: rand(2, 5),
        color
      });
    }
    if (this.particles.length > 420) this.particles.splice(0, this.particles.length - 420);
  },

  addFloat(text, x, y, color = '#fff') {
    this.floats.push({ text, x, y, life: 1, color });
  },

  addScore(v) {
    this.score += v;
    this.maxLevel = this.maxLevel;
  },

  addShake(m) {
    this.shake = Math.max(this.shake, m);
    this.shakeMag = Math.max(this.shakeMag, m * 12);
  },

  loseLife() {
    this.lives -= 1;
    this.addShake(0.6);
    Sfx.hit();
    this.paddle.flash = 1;
    if (this.lives <= 0) {
      this.lives = 0;
      this.state = STATE.OVER;
      Sfx.over();
      try { uni && uni.vibrate && uni.vibrate(80); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(80);
    }
  },

  /* ---------- 更新 ---------- */
  update(dt) {
    this.t += dt;

    /* 粒子始终更新（暂停也有微光） */
    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 320 * dt;
      p.life -= dt;
    }
    this.particles = this.particles.filter(p => p.life > 0);

    for (const f of this.floats) {
      f.y -= 46 * dt;
      f.life -= dt * 1.1;
    }
    this.floats = this.floats.filter(f => f.life > 0);

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.2);
      this.shakeMag *= Math.exp(-dt * 6);
    } else {
      this.shakeMag = 0;
    }

    if (this.state !== STATE.PLAY) return;

    this.paddle.update(dt);
    for (const b of this.balls) b.update(dt, this);
    this.balls = this.balls.filter(b => b.alive);

    if (this.balls.length === 0) {
      this.loseLife();
      if (this.state === STATE.PLAY) {
        this.balls.push(new Ball(this.paddle.x, this.paddle.y - 20, 0, 0));
      }
      return;
    }

    for (const bu of this.bullets) bu.update(dt, this);
    this.bullets = this.bullets.filter(b => b.alive);

    for (const pu of this.powerups) pu.update(dt);
    for (const pu of this.powerups) {
      if (!pu.alive) continue;
      const p = this.paddle;
      if (pu.y + pu.h / 2 > p.y && pu.y - pu.h / 2 < p.y + p.h &&
          pu.x > p.x - p.w / 2 - pu.w / 2 && pu.x < p.x + p.w / 2 + pu.w / 2) {
        pu.alive = false;
        this.applyPower(pu.type);
        this.addFloat(PWR[pu.type].name, p.x, p.y - 34, PWR[pu.type].color);
      }
    }
    this.powerups = this.powerups.filter(p => p.alive);

    if (this.boss) {
      this.boss.update(dt, this);
      if (!this.boss.alive) this.boss = null;
    }

    const alive = this.bricks.some(b => b.alive && b.tough !== 2);
    if (!alive) {
      this.state = STATE.CLEAR;
      Sfx.clear();
    }
  },

  /* ---------- 绘制 ---------- */
  draw() {
    ctx.save();

    /* 背景 */
    const bg = ctx.createLinearGradient(0, 0, 0, CFG.H);
    bg.addColorStop(0, '#141833');
    bg.addColorStop(0.5, '#0d1022');
    bg.addColorStop(1, '#0a0c18');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    /* 装饰网格 */
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let x = 0; x < CFG.W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CFG.H); ctx.stroke();
    }
    for (let y = 0; y < CFG.H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CFG.W, y); ctx.stroke();
    }

    /* 屏幕震动 */
    if (this.shakeMag > 0.2) {
      ctx.translate((Math.random() - 0.5) * this.shakeMag, (Math.random() - 0.5) * this.shakeMag);
    }

    for (const b of this.bricks) b.draw();
    if (this.boss) this.boss.draw();
    for (const pu of this.powerups) pu.draw(ctx);
    for (const bu of this.bullets) bu.draw();
    for (const b of this.balls) b.draw();
    this.paddle.draw();

    /* 粒子 */
    for (const p of this.particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 浮字 */
    for (const f of this.floats) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 22px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    this.drawHud();

    if (this.state === STATE.MENU) this.drawMenu();
    if (this.state === STATE.PAUSE) this.drawPause();
    if (this.state === STATE.CLEAR) this.drawClear();
    if (this.state === STATE.OVER)  this.drawOver();

    ctx.restore();
  },

  drawHud() {
    ctx.save();
    /* 顶栏 */
    ctx.fillStyle = 'rgba(10,13,26,0.6)';
    rr(ctx, 16, 16, CFG.W - 32, 52, 14);
    ctx.fill();

    ctx.fillStyle = '#9aa6c2';
    ctx.font = 'bold 14px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('SCORE', 34, 38);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(String(this.score).padStart(6, '0'), 34, 60);

    ctx.fillStyle = '#9aa6c2';
    ctx.font = 'bold 14px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('LEVEL', 190, 38);
    ctx.fillStyle = '#22e6ff';
    ctx.font = 'bold 22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(String(this.level), 190, 60);

    /* 命 */
    for (let i = 0; i < 3; i++) {
      const on = i < this.lives;
      ctx.fillStyle = on ? '#ff2fb3' : 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(300 + i * 28, 44, 9, 0, TAU);
      ctx.fill();
      if (on) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(297 + i * 28, 41, 3, 0, TAU);
        ctx.fill();
      }
    }

    /* 暂停 / 声音 按钮 */
    this.drawIconButton(CFG.W - 96, 40, this.state === STATE.PAUSE ? 'play' : 'pause');
    this.drawIconButton(CFG.W - 42, 40, 'sound');

    ctx.restore();
  },

  drawIconButton(x, y, icon) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    rr(ctx, x - 22, y - 22, 44, 44, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1.5;
    rr(ctx, x - 22, y - 22, 44, 44, 12);
    ctx.stroke();

    ctx.fillStyle = '#cfd8f2';
    if (icon === 'pause') {
      rr(ctx, x - 8, y - 9, 6, 18, 2); ctx.fill();
      rr(ctx, x + 2, y - 9, 6, 18, 2); ctx.fill();
    } else if (icon === 'play') {
      ctx.beginPath();
      ctx.moveTo(x - 6, y - 10);
      ctx.lineTo(x + 11, y);
      ctx.lineTo(x - 6, y + 10);
      ctx.closePath(); ctx.fill();
    } else if (icon === 'sound') {
      ctx.beginPath();
      ctx.moveTo(x - 11, y - 4); ctx.lineTo(x - 5, y - 4); ctx.lineTo(x + 1, y - 10);
      ctx.lineTo(x + 1, y + 10); ctx.lineTo(x - 5, y + 4); ctx.lineTo(x - 11, y + 4);
      ctx.closePath(); ctx.fill();
      if (Sfx.muted) {
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x + 5, y - 7); ctx.lineTo(x + 14, y + 7); ctx.stroke();
      } else {
        ctx.strokeStyle = '#cfd8f2'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x + 2, y, 8, -0.9, 0.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + 2, y, 13, -0.8, 0.8); ctx.stroke();
      }
    }
  },

  drawMenu() {
    ctx.fillStyle = 'rgba(8,10,20,0.72)';
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    const cx = CFG.W / 2, cy = CFG.H / 2 - 90;

    /* 装饰小球 */
    for (let i = 0; i < 3; i++) {
      const a = this.t * 1.1 + i * (TAU / 3);
      const px = cx + Math.cos(a) * 210;
      const py = cy + Math.sin(a * 1.3) * 70;
      ctx.fillStyle = ['#22e6ff','#ff2fb3','#ffa62b'][i];
      ctx.globalAlpha = 0.28;
      ctx.beginPath(); ctx.arc(px, py, 16, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    const tg = ctx.createLinearGradient(cx - 220, 0, cx + 220, 0);
    tg.addColorStop(0, '#22e6ff');
    tg.addColorStop(0.5, '#b24dff');
    tg.addColorStop(1, '#ff2fb3');
    ctx.fillStyle = tg;
    ctx.font = 'bold 68px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(178,77,255,0.8)';
    ctx.shadowBlur = 30;
    ctx.fillText('砖块破坏者', cx, cy);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#9aa6c2';
    ctx.font = '22px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('弹幕 × 打砖块 × Roguelike 道具', cx, cy + 44);

    /* 说明 */
    const lines = [
      '拖动屏幕 / 鼠标按住拖动 / ← → 或 A D ：移动光板',
      '右半屏轻点 / 空格 / ↑ ：发射小球',
      '第三关起出现 Boss 与弹幕，注意护盾！',
    ];
    ctx.font = '17px "Microsoft YaHei","PingFang SC",sans-serif';
    lines.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#c7d2ea' : '#8b97b4';
      ctx.fillText(s, cx, cy + 110 + i * 30);
    });

    /* 按钮 */
    this.drawButton(cx, CFG.H / 2 + 40, 220, 62, this.maxLevel > 1 ? `继续（第 ${this.maxLevel} 关）` : '开始游戏');
    ctx.textAlign = 'left';
  },

  drawPause() {
    ctx.fillStyle = 'rgba(8,10,20,0.66)';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 54px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('暂停', CFG.W / 2, CFG.H / 2 - 20);
    ctx.fillStyle = '#9aa6c2';
    ctx.font = '20px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('点击任意处 / P 继续', CFG.W / 2, CFG.H / 2 + 28);
    ctx.textAlign = 'left';
  },

  drawClear() {
    ctx.fillStyle = 'rgba(8,10,20,0.6)';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    const cx = CFG.W / 2, cy = CFG.H / 2 - 60;

    ctx.fillStyle = '#4dff9e';
    ctx.textAlign = 'center';
    ctx.font = 'bold 62px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.shadowColor = 'rgba(77,255,158,0.7)';
    ctx.shadowBlur = 26;
    ctx.fillText('过关!', cx, cy);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#c7d2ea';
    ctx.font = '24px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(`当前分数 ${this.score}`, cx, cy + 52);

    this.drawButton(cx, CFG.H / 2 + 40, 220, 62, '下一关 →');
    ctx.textAlign = 'left';
  },

  drawOver() {
    ctx.fillStyle = 'rgba(20,6,14,0.72)';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    const cx = CFG.W / 2, cy = CFG.H / 2 - 60;

    ctx.fillStyle = '#ff5b6e';
    ctx.textAlign = 'center';
    ctx.font = 'bold 62px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.shadowColor = 'rgba(255,91,110,0.7)';
    ctx.shadowBlur = 26;
    ctx.fillText('游戏结束', cx, cy);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#c7d2ea';
    ctx.font = '24px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText(`最终分数 ${this.score}　·　到达第 ${this.level} 关`, cx, cy + 52);

    this.drawButton(cx, CFG.H / 2 + 40, 220, 62, '再来一次');
    ctx.textAlign = 'left';
  },

  drawButton(cx, cy, w, h, text) {
    const g = ctx.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
    g.addColorStop(0, '#22e6ff');
    g.addColorStop(1, '#b24dff');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(120,80,255,0.65)';
    ctx.shadowBlur = 24;
    rr(ctx, cx - w / 2, cy - h / 2, w, h, 18);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0b0d18';
    ctx.font = 'bold 26px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, cx, cy + 9);
    ctx.textAlign = 'left';
  }
};

/* ================= 启动 ================= */
resize();
bindInput(canvas);
Game.buildLevel(1);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  Game.update(dt);
  Game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
