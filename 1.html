<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星尘快跑</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0e1a; }
  canvas {
    display:block; width:100vw; height:100vh;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
'use strict';

/* ==================== 基础 ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

const state = {
  mode: 'menu',                       // menu | playing | paused | gameover
  score: 0,
  best: Number(localStorage.getItem('stardust_rush_best') || 0),
  newBest: false,
  time: 0,
  speed: 0,
  shake: 0,
  flash: 0
};

const player = { x: 0, y: 0, vy: 0, onGround: true, jumps: 0, rot: 0, spin: 0 };

const obstacles = [];
const orbs = [];
const particles = [];
const texts = [];
let bgStars = [];
let peaks = [];

let groundOffset = 0;
let spawnTimer = 0.7;

/* 尺寸与手感参数（随窗口高度缩放） */
const groundY  = () => H * 0.80;
const pSize    = () => Math.max(42, Math.min(66, H * 0.075));
const gravity  = () => H * 3.6;
const jumpV    = () => -H * 1.42;
const baseSpeed= () => Math.max(360, W * 0.55);

/* ==================== 背景生成 ==================== */
function buildBackground() {
  bgStars = [];
  const layers = [
    { n: 40, r: 0.8, sp: 0.15, a: 0.35 },
    { n: 30, r: 1.4, sp: 0.35, a: 0.60 },
    { n: 18, r: 2.2, sp: 0.65, a: 0.95 }
  ];
  layers.forEach((L, li) => {
    for (let i = 0; i < L.n; i++) {
      bgStars.push({
        x: Math.random() * (W + 200),
        y: Math.random() * groundY() * 0.95,
        r: L.r * (0.7 + Math.random() * 0.8),
        sp: L.sp,
        a: L.a,
        tw: Math.random() * Math.PI * 2,
        layer: li
      });
    }
  });

  peaks = [];
  let x = -120;
  while (x < W + 240) {
    const w = W * 0.10 + Math.random() * W * 0.10;
    const h = H * 0.06 + Math.random() * H * 0.14;
    peaks.push({ x, w, h });
    x += w * (0.55 + Math.random() * 0.35);
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
  player.x = W * 0.22;
  if (state.mode !== 'playing') player.y = groundY() - pSize();
}

/* ==================== 音频（Web Audio 合成） ==================== */
let AC = null, muted = false;

function ensureAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}

function beep(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.10, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}

const sfx = {
  jump:     () => beep(420, 0.12, 'square',    0.09, 760),
  double:   () => beep(620, 0.12, 'square',    0.08, 980),
  collect:  () => beep(880, 0.08, 'triangle',  0.10, 1320),
  milestone:() => { beep(660, 0.09, 'square', 0.09, 880); setTimeout(() => beep(880, 0.12, 'square', 0.09, 1180), 90); },
  hit:      () => beep(240, 0.40, 'sawtooth',  0.14, 55),
  start:    () => beep(520, 0.10, 'square',    0.09, 780)
};

/* ==================== 输入 ==================== */
function togglePause() {
  if (state.mode === 'playing') state.mode = 'paused';
  else if (state.mode === 'paused') state.mode = 'playing';
}

function jump() {
  if (player.onGround) {
    player.vy = jumpV();
    player.onGround = false;
    player.jumps = 1;
    player.spin = -9;
    burst(player.x, groundY() - 4, 10, '#ffd27a', 120);
    sfx.jump();
  } else if (player.jumps < 2) {
    player.vy = jumpV() * 0.85;
    player.jumps = 2;
    player.spin = -13;
    burst(player.x, player.y + pSize() * 0.9, 12, '#ff9d2e', 160);
    sfx.double();
  }
}

function action() {
  ensureAudio();
  if (state.mode === 'menu') startGame();
  else if (state.mode === 'gameover') startGame();
  else if (state.mode === 'paused') state.mode = 'playing';
  else jump();
}

function startGame() {
  obstacles.length = 0;
  orbs.length = 0;
  particles.length = 0;
  texts.length = 0;
  state.mode = 'playing';
  state.score = 0;
  state.time = 0;
  state.speed = baseSpeed();
  state.newBest = false;
  state.shake = 0;
  spawnTimer = 0.7;
  player.y = groundY() - pSize();
  player.vy = 0;
  player.onGround = true;
  player.jumps = 0;
  player.rot = 0;
  sfx.start();
}

function gameOver() {
  if (state.mode !== 'playing') return;
  state.mode = 'gameover';
  state.shake = 22;
  state.flash = 0.6;
  const p = pSize();
  burst(player.x, player.y + p * 0.5, 46, '#ff9d2e', 420);
  burst(player.x, player.y + p * 0.5, 20, '#ffffff', 300);
  sfx.hit();
  if (state.score > state.best) {
    state.best = state.score;
    state.newBest = true;
    localStorage.setItem('stardust_rush_best', String(state.best));
  }
}

/* 触屏 / 鼠标 */
function onPointerDown(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  // 右上角暂停按钮
  const bs = Math.max(38, H * 0.06);
  const bx = W - bs - 18, by = 18;
  if (state.mode === 'playing' && cx >= bx && cx <= bx + bs && cy >= by && cy <= by + bs) {
    ensureAudio();
    togglePause();
    return;
  }
  action();
}

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowup' || k === 'w') { e.preventDefault(); action(); }
  else if (k === 'p' || k === 'escape') { ensureAudio(); togglePause(); }
  else if (k === 'r') { ensureAudio(); startGame(); }
  else if (k === 'm') { muted = !muted; }
  else if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
});

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === 'playing') state.mode = 'paused';
});
document.addEventListener('gesturestart', (e) => e.preventDefault());

/* ==================== 粒子与飘字 ==================== */
function burst(x, y, n, color, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * spread;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 60,
      life: 0.5 + Math.random() * 0.5,
      max: 1,
      size: 2 + Math.random() * 5,
      color
    });
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

function addText(x, y, str, color) {
  texts.push({ x, y, str, color, life: 1.1 });
}

/* ==================== 生成 ==================== */
function spawn() {
  const p = pSize();
  const roll = Math.random();

  if (roll < 0.18 && state.time > 10) {
    // 高空无人机：不能跳起来撞上，看准时机
    const y = groundY() - p * 3.3;
    obstacles.push({ type: 'drone', x: W + 90, y, baseY: y, w: p * 1.25, h: p * 0.8, phase: Math.random() * Math.PI * 2 });
  } else {
    const h = p * (0.85 + Math.random() * 0.75);
    const w = p * (0.75 + Math.random() * 0.6);
    obstacles.push({ type: 'rock', x: W + 90, y: groundY() - h, w, h });
  }

  // 星尘轨道
  if (Math.random() < 0.6) {
    const n = 3 + Math.floor(Math.random() * 3);
    const bx = W + 90 + Math.random() * W * 0.35;
    const arcH = p * (1.1 + Math.random() * 1.3);
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      orbs.push({
        x: bx + i * p * 1.15,
        y: groundY() - arcH - Math.sin(t * Math.PI) * p * 1.3,
        r: p * 0.20,
        phase: Math.random() * 6,
        taken: false
      });
    }
  }
}

/* ==================== 更新 ==================== */
function update(dt) {
  // 背景/粒子在菜单也保持流动
  const drift = state.mode === 'playing' ? state.speed : baseSpeed() * 0.35;

  bgStars.forEach(s => {
    s.x -= drift * s.sp * dt * 0.25;
    s.tw += dt * 2;
    if (s.x < -20) s.x = W + 20 + Math.random() * 120;
  });

  groundOffset = (groundOffset + drift * dt) % 96;

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
  if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 1.6);

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt - drift * dt * 0.25;
    q.y += q.vy * dt;
    q.vy += 900 * dt;
    q.vx *= 0.96;
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    t.y -= 40 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }

  if (state.mode !== 'playing') return;

  /* --- 游戏逻辑 --- */
  state.time += dt;
  state.speed = baseSpeed() * (1 + Math.min(state.time * 0.022, 1.1));
  state.score += state.speed * dt * 0.045;

  // 玩家物理
  const p = pSize();
  player.vy += gravity() * dt;
  player.y += player.vy * dt;
  if (player.y >= groundY() - p) {
    if (!player.onGround) burst(player.x, groundY() - 2, 6, '#8b93a7', 90);
    player.y = groundY() - p;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
    player.rot *= 0.75;
    player.spin *= 0.7;
  } else {
    player.rot += player.spin * dt;
  }

  // 生成
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = (0.78 + Math.random() * 0.72) * (baseSpeed() / state.speed);
  }

  // 障碍
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= state.speed * dt;
    if (o.type === 'drone') o.y = o.baseY + Math.sin(state.time * 2.2 + o.phase) * p * 0.28;
    if (o.x + o.w < -80) { obstacles.splice(i, 1); continue; }

    const px = player.x - p * 0.32, py = player.y + p * 0.18, pw = p * 0.64, ph = p * 0.68;
    const ox = o.x + o.w * 0.12, oy = o.y + o.h * 0.12, ow = o.w * 0.76, oh = o.h * 0.8;
    if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
      gameOver();
      return;
    }
  }

  // 星尘
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.x -= state.speed * dt;
    o.phase += dt * 3;
    if (o.x < -60) { orbs.splice(i, 1); continue; }
    const dx = o.x - player.x, dy = o.y - (player.y + p * 0.5);
    if (dx * dx + dy * dy < (o.r + p * 0.45) * (o.r + p * 0.45)) {
      orbs.splice(i, 1);
      state.score += 10;
      burst(o.x, o.y, 8, '#ffd27a', 180);
      sfx.collect();
    }
  }

  // 里程碑
  const step = Math.floor(state.score / 250);
  if (step > 0 && step * 250 - state.score < state.speed * dt * 0.045 && state.score % 250 < 12) {
    addText(player.x + 40, player.y - 20, '★ 速度提升 ★', '#ffd27a');
    state.flash = 0.35;
    sfx.milestone();
  }
}

/* ==================== 渲染 ==================== */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawStar(cx, cy, r, rot, c1, c2, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.46 : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const fn = i ? 'lineTo' : 'moveTo';
    ctx[fn](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  if (glow) { ctx.shadowColor = c1; ctx.shadowBlur = r * 0.8; }
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(3, r * 0.24);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0b0e1a';
  ctx.stroke();
  ctx.restore();
}

function render() {
  const shakeX = state.shake ? (Math.random() - 0.5) * state.shake : 0;
  const shakeY = state.shake ? (Math.random() - 0.5) * state.shake : 0;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* 天空 */
  const sky = ctx.createLinearGradient(0, 0, 0, groundY());
  sky.addColorStop(0, '#0b0e1a');
  sky.addColorStop(0.55, '#1c2140');
  sky.addColorStop(1, '#3b2159');
  ctx.fillStyle = sky;
  ctx.fillRect(-40, -40, W + 80, groundY() + 40);

  /* 地平线辉光 */
  const glow = ctx.createLinearGradient(0, groundY() - H * 0.18, 0, groundY());
  glow.addColorStop(0, 'rgba(249,115,22,0)');
  glow.addColorStop(1, 'rgba(249,115,22,0.28)');
  ctx.fillStyle = glow;
  ctx.fillRect(-40, groundY() - H * 0.18, W + 80, H * 0.18);

  /* 星星 */
  bgStars.forEach(s => {
    const tw = 0.55 + 0.45 * Math.sin(s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.layer === 2 ? '#ffd27a' : '#ffffff';
    ctx.fillRect(s.x, s.y, s.r * 2, s.r * 2);
  });
  ctx.globalAlpha = 1;

  /* 远山剪影 */
  ctx.fillStyle = '#242a4d';
  peaks.forEach(pk => {
    ctx.beginPath();
    ctx.moveTo(pk.x, groundY());
    ctx.lineTo(pk.x + pk.w / 2, groundY() - pk.h);
    ctx.lineTo(pk.x + pk.w, groundY());
    ctx.closePath();
    ctx.fill();
  });

  /* 地面 */
  const gnd = ctx.createLinearGradient(0, groundY(), 0, H);
  gnd.addColorStop(0, '#1b2130');
  gnd.addColorStop(1, '#12151c');
  ctx.fillStyle = gnd;
  ctx.fillRect(-40, groundY(), W + 80, H - groundY() + 40);

  ctx.strokeStyle = 'rgba(255,157,46,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-40, groundY());
  ctx.lineTo(W + 40, groundY());
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,157,46,0.30)';
  ctx.lineWidth = 6;
  for (let x = -96; x < W + 96; x += 96) {
    ctx.beginPath();
    ctx.moveTo(x - groundOffset, groundY() + 22);
    ctx.lineTo(x - groundOffset + 44, groundY() + 22);
    ctx.stroke();
  }

  /* 星尘 */
  orbs.forEach(o => {
    const r = o.r * (1 + 0.12 * Math.sin(o.phase));
    drawStar(o.x, o.y, r, o.phase * 0.5, '#fff6d8', '#ff9d2e', true);
  });

  /* 障碍 */
  obstacles.forEach(o => {
    if (o.type === 'rock') {
      const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
      g.addColorStop(0, '#5b6478');
      g.addColorStop(1, '#333b4d');
      roundRect(o.x, o.y, o.w, o.h, 10);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0b0e1a';
      ctx.stroke();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      roundRect(o.x + o.w * 0.18, o.y + o.h * 0.16, o.w * 0.28, o.h * 0.18, 6);
      ctx.fill();
    } else {
      // 无人机
      const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
      g.addColorStop(0, '#f43f5e');
      g.addColorStop(1, '#7b2ff7');
      roundRect(o.x, o.y, o.w, o.h, 12);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0b0e1a';
      ctx.stroke();
      // 眼睛
      ctx.fillStyle = '#ffd27a';
      ctx.beginPath();
      ctx.arc(o.x + o.w * 0.68, o.y + o.h * 0.42, o.h * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0b0e1a';
      ctx.beginPath();
      ctx.arc(o.x + o.w * 0.72, o.y + o.h * 0.42, o.h * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  /* 玩家 */
  if (state.mode !== 'gameover') {
    const p = pSize();
    // 影子
    const airT = Math.max(0, 1 - (groundY() - (player.y + p)) / (H * 0.35));
    ctx.globalAlpha = 0.35 * (1 - airT * 0.7);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(player.x, groundY() + 10, p * 0.55 * (1 - airT * 0.4), p * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    drawStar(player.x, player.y + p * 0.5, p * 0.56, player.rot, '#ffd27a', '#f97316', true);

    // 拖尾
    if (!player.onGround) {
      ctx.globalAlpha = 0.35;
      drawStar(player.x - p * 0.45, player.y + p * 0.55, p * 0.34, player.rot * 0.8, '#ff9d2e', '#f97316', false);
      ctx.globalAlpha = 1;
    }
  }

  /* 粒子 */
  particles.forEach(q => {
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 1.6));
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  });
  ctx.globalAlpha = 1;

  /* 飘字 */
  texts.forEach(t => {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.font = '700 ' + Math.round(H * 0.03) + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
  });
  ctx.globalAlpha = 1;

  /* 闪光 */
  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(255,210,122,' + (state.flash * 0.35) + ')';
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }

  ctx.restore();
  renderHUD();
}

function renderHUD() {
  const big = Math.round(Math.min(46, H * 0.05));
  const small = Math.round(Math.min(20, H * 0.026));

  ctx.textAlign = 'left';
  ctx.font = '700 ' + small + 'px "Courier New", monospace';
  ctx.fillStyle = '#9aa3b4';
  ctx.fillText('SCORE', 22, 34 + small * 0.2);

  ctx.font = '700 ' + big + 'px "Courier New", monospace';
  ctx.fillStyle = '#ff9d2e';
  ctx.fillText(String(Math.floor(state.score)).padStart(6, '0'), 22, 34 + small + big * 0.75);

  ctx.font = '700 ' + small + 'px "Courier New", monospace';
  ctx.fillStyle = '#9aa3b4';
  ctx.fillText('BEST  ' + String(Math.floor(state.best)).padStart(6, '0'), 22, 34 + small + big * 0.75 + small * 1.5);

  // 暂停按钮
  const bs = Math.max(38, H * 0.06);
  const bx = W - bs - 18, by = 18;
  if (state.mode === 'playing' || state.mode === 'paused') {
    roundRect(bx, by, bs, bs, 10);
    ctx.fillStyle = 'rgba(27,33,48,0.85)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ff9d2e';
    ctx.stroke();
    ctx.fillStyle = '#ff9d2e';
    const bw = bs * 0.14, bh = bs * 0.42, gap = bs * 0.16;
    if (state.mode === 'paused') {
      ctx.beginPath();
      ctx.moveTo(bx + bs * 0.36, by + bs * 0.28);
      ctx.lineTo(bx + bs * 0.72, by + bs * 0.5);
      ctx.lineTo(bx + bs * 0.36, by + bs * 0.72);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(bx + bs / 2 - gap / 2 - bw, by + bs / 2 - bh / 2, bw, bh);
      ctx.fillRect(bx + bs / 2 + gap / 2, by + bs / 2 - bh / 2, bw, bh);
    }
  }

  if (state.mode === 'menu')    overlay('星尘快跑', 'STAR DUST RUSH', '点击屏幕 / 按 空格 开始', '空格或 ↑ 跳跃（可二段跳） · P 暂静 · M 静音 · F 全屏');
  if (state.mode === 'paused') overlay('已暂停', 'PAUSED', '点击 / 按 P 继续', '按 R 重新开始');
  if (state.mode === 'gameover') {
    overlay('游戏结束', 'GAME OVER',
      '得分 ' + Math.floor(state.score) + '   最高 ' + Math.floor(state.best),
      state.newBest ? '★ 新纪录！点击 / 按 R 再来一局 ★' : '点击屏幕 / 按 R 重新开始');
  }
}

function overlay(title, sub, main, hint) {
  ctx.fillStyle = 'rgba(8,11,18,0.72)';
  ctx.fillRect(0, 0, W, H);

  const t1 = Math.round(Math.min(72, H * 0.085));
  const t2 = Math.round(Math.min(22, H * 0.03));
  const t3 = Math.round(Math.min(28, H * 0.038));
  const t4 = Math.round(Math.min(18, H * 0.024));

  ctx.textAlign = 'center';

  ctx.font = '700 ' + t2 + 'px "Courier New", monospace';
  ctx.fillStyle = '#9aa3b4';
  ctx.fillText(sub, W / 2, H * 0.32);

  ctx.font = '700 ' + t1 + 'px "Courier New", monospace';
  ctx.lineWidth = Math.max(6, t1 * 0.14);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0b0e1a';
  ctx.strokeText(title, W / 2, H * 0.32 + t1 * 1.05);
  const g = ctx.createLinearGradient(0, H * 0.32, 0, H * 0.32 + t1);
  g.addColorStop(0, '#ffd27a');
  g.addColorStop(1, '#f97316');
  ctx.fillStyle = g;
  ctx.fillText(title, W / 2, H * 0.32 + t1 * 1.05);

  ctx.font = '700 ' + t3 + 'px "Courier New", monospace';
  ctx.fillStyle = '#e9e6dd';
  ctx.fillText(main, W / 2, H * 0.62);

  ctx.font = '700 ' + t4 + 'px "Courier New", monospace';
  ctx.fillStyle = '#9aa3b4';
  ctx.fillText(hint, W / 2, H * 0.70);

  // 呼吸提示条
  const alpha = 0.5 + 0.5 * Math.sin(performance.now() / 320);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff9d2e';
  roundRect(W / 2 - 90, H * 0.755, 180, 6, 3);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ==================== 主循环 ==================== */
let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
