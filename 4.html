<script>
'use strict';
/* =========================================================================
   模块 0 / 工具函数
   ========================================================================= */
var TAU = Math.PI * 2;
function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : (d === undefined ? 0 : d); }
function clamp(v, a, b){ v = num(v, a); return v < a ? a : (v > b ? b : v); }
function fract(v){ v = num(v); return v - Math.floor(v); }
function hash1(n){ return fract(Math.sin(num(n) * 127.1) * 43758.5453); }
function lerp(a, b, t){ a = num(a); b = num(b); return a + (b - a) * clamp(t, 0, 1); }
function fmtInt(n){
  n = Math.floor(num(n));
  var neg = n < 0 ? '-' : ''; var s = String(Math.abs(n)); var o = '';
  for (var i = 0; i < s.length; i++){ o += s.charAt(i); var rem = s.length - 1 - i; if (rem > 0 && rem % 3 === 0) o += ','; }
  return neg + o;
}
function fmtNum(n){
  n = num(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e5) return Math.round(n / 1e3) + 'k';
  return fmtInt(n);
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(num(sec)));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + '时' + m + '分';
  if (m > 0) return m + '分' + s + '秒';
  return s + '秒';
}
function qpt(ax, ay, bx, by, cx, cy, p){
  p = clamp(p, 0, 1); var q = 1 - p;
  return { x: q * q * ax + 2 * q * p * bx + p * p * cx, y: q * q * ay + 2 * q * p * by + p * p * cy };
}
function alpha(hex, a){
  var h = String(hex || '#ffffff').replace('#', '');
  if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  if (!isFinite(r)) r = 255; if (!isFinite(g)) g = 255; if (!isFinite(b)) b = 255;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + clamp(num(a, 1), 0, 1) + ')';
}

/* =========================================================================
   模块 1 / 配置数据
   ========================================================================= */
var C = {

};
var CATS = [
  { name: '主粮类 GRAIN', short: '主粮', color: C.gold,  note: '生长 +8% · 收益 +8%',   grow: 1.08, price: 1.08, pest: 1.00 },
  { name: '蔬菜类 VEG',   short: '蔬菜', color: C.green, note: '均衡稳健 · 无加成',     grow: 1.00, price: 1.00, pest: 1.00 },
  { name: '瓜果类 MELON', short: '瓜果', color: C.cyan,  note: '害虫概率 -35%',          grow: 1.00, price: 1.00, pest: 0.65 },
  { name: '水果类 FRUIT', short: '水果', color: C.pink,  note: '售价 +18% · 生长 -8%',   grow: 0.92, price: 1.18, pest: 1.00 }
];
var CROPS = [
  { name: '小麦',   cat: 0, cost: 4,   time: 5,  price: 10,  unlock: 0,     col: '#ffd23f' },
  { name: '玉米',   cat: 0, cost: 16,  time: 14, price: 40,  unlock: 120,   col: '#ffdf5c' },
  { name: '稻米',   cat: 0, cost: 70,  time: 38, price: 185, unlock: 1600,  col: '#e9c46a' },
  { name: '萝卜',   cat: 1, cost: 6,   time: 7,  price: 16,  unlock: 40,    col: '#d9a6ff' },
  { name: '胡萝卜', cat: 1, cost: 26,  time: 20, price: 62,  unlock: 500,   col: '#ff9d3c' },
  { name: '茄子',   cat: 1, cost: 110, time: 52, price: 310, unlock: 7500,  col: '#a86bff' },
  { name: '南瓜',   cat: 2, cost: 20,  time: 18, price: 52,  unlock: 240,   col: '#ff9e2c' },
  { name: '黄瓜',   cat: 2, cost: 72,  time: 34, price: 200, unlock: 2800,  col: '#5fd77a' },
  { name: '西瓜',   cat: 2, cost: 190, time: 70, price: 580, unlock: 12000, col: '#3fbf62' },
  { name: '草莓',   cat: 3, cost: 48,  time: 28, price: 140, unlock: 900,   col: '#ff5b7a' },
  { name: '苹果',   cat: 3, cost: 140, time: 56, price: 420, unlock: 4600,  col: '#ff6b5b' },
  { name: '葡萄',   cat: 3, cost: 320, time: 88, price: 950, unlock: 20000, col: '#c56bff' }
];
var FAC = [
  { name: '洒水器', unit: '生长速度', vals: [1.35, 1.8, 2.5], prices: [80, 260, 720],   color: C.cyan },
  { name: '风车',   unit: '全体售价', vals: [1.1, 1.2, 1.35], prices: [200, 600, 1500], color: C.lime },
  { name: '稻草人', unit: '自动收获', vals: [4.5, 3.0, 1.8],  prices: [150, 450, 1100], color: C.gold },
  { name: '蜂箱',   unit: '自动除虫', vals: [12, 8, 5],       prices: [100, 320, 820],  color: C.gold },
  { name: '鱼塘',   unit: '定期收益', vals: [6, 14, 32],      prices: [120, 380, 900],  color: C.cyan, ivals: [6, 4.5, 3] }
];
var EXP_BASE = 40;

/* =========================================================================
   模块 2 / 画布与视图
   ========================================================================= */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var view = { w: 960, h: 640, dpr: 1 };
var lay = {};
function resize(){
  var w = window.innerWidth || document.documentElement.clientWidth || 960;
  var h = window.innerHeight || document.documentElement.clientHeight || 640;
  w = Math.max(240, num(w, 960)); h = Math.max(240, num(h, 640));
  var dpr = clamp(window.devicePixelRatio || 1, 1, 3);
  view.w = w; view.h = h; view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  computeLayout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });

function fnt(size, weight, mono){
  var s = Math.max(8, Math.round(num(size, 12)));
  return (weight || 600) + ' ' + s + 'px ' + (mono
    ? '"SFMono-Regular",Consolas,"Courier New",monospace'
    : '"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif');
}
function text(str, x, y, size, color, align, weight, mono, spacing){
  if (str === undefined || str === null) return;
  x = num(x); y = num(y);
  if (!isFinite(x) || !isFinite(y)) return;
  ctx.font = fnt(size, weight, mono);
  ctx.fillStyle = color || C.text;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if (spacing && ctx.letterSpacing !== undefined) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(String(str), x, y);
  if (spacing && ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
}
function line(x1, y1, x2, y2, col, w){
  if (!isFinite(x1) || !isFinite(y1) || !isFinite(x2) || !isFinite(y2)) return;
  ctx.strokeStyle = col || C.line; ctx.lineWidth = Math.max(0.6, num(w, 1));
  ctx.beginPath(); ctx.moveTo(num(x1), num(y1)); ctx.lineTo(num(x2), num(y2)); ctx.stroke();
}
function ell(cx, cy, rx, ry, rot, fill, stroke, lw){
  if (!isFinite(cx) || !isFinite(cy)) return;
  rx = Math.max(0.4, num(rx, 1)); ry = Math.max(0.4, num(ry, 1));
  ctx.save(); ctx.translate(num(cx), num(cy)); ctx.rotate(num(rot));
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(0.5, num(lw, 1)); ctx.stroke(); }
  ctx.restore();
}
function poly(pts, fill, stroke, lw){
  if (!pts || pts.length < 2) return;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++){
    var p = pts[i]; if (!p || !isFinite(p[0]) || !isFinite(p[1])) return;
    if (i === 0) ctx.moveTo(num(p[0]), num(p[1])); else ctx.lineTo(num(p[0]), num(p[1]));
  }
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(0.5, num(lw, 1)); ctx.stroke(); }
}
function curve(x0, y0, cx, cy, x1, y1, col, w){
  if (!isFinite(x0) || !isFinite(y0) || !isFinite(x1) || !isFinite(y1)) return;
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.5, num(w, 1));
  ctx.beginPath(); ctx.moveTo(num(x0), num(y0)); ctx.quadraticCurveTo(num(cx), num(cy), num(x1), num(y1)); ctx.stroke();
}
function chamferPath(x, y, w, h, c){
  x = num(x); y = num(y); w = Math.max(1, num(w, 1)); h = Math.max(1, num(h, 1));
  c = clamp(num(c, 6), 0, Math.min(w, h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + c, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c);
  ctx.lineTo(x + w, y + h - c); ctx.lineTo(x + w - c, y + h); ctx.lineTo(x + c, y + h);
  ctx.lineTo(x, y + h - c); ctx.lineTo(x, y + c); ctx.closePath();
}
function panelBox(x, y, w, h, accent, title, cut){
  x = num(x); y = num(y); w = Math.max(1, num(w, 1)); h = Math.max(1, num(h, 1));
  chamferPath(x, y, w, h, cut === undefined ? 8 : cut);
  var g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, C.panel2); g.addColorStop(1, C.panel);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
  if (accent){ chamferPath(x, y, 4, h, 2); ctx.fillStyle = accent; ctx.fill(); }
  if (title) text(title, x + 14, y + 16, 11, C.dim, 'left', 700, false, 2);
}
function drawStar(x, y, r, fill, a){
  r = Math.max(1, num(r, 4));
  ctx.save(); ctx.globalAlpha = clamp(num(a, 1), 0, 1);
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    var px2 = num(x) + Math.cos(ang) * rr, py2 = num(y) + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function drawCoinIcon(x, y, r){
  r = Math.max(2, num(r, 8));
  ell(x, y, r, r, 0, '#f0b429', '#8a6414', Math.max(0.8, r * 0.16));
  ell(x - r * 0.22, y - r * 0.22, r * 0.42, r * 0.3, -0.6, 'rgba(255,255,255,0.45)');
  ell(x, y, r * 0.52, r * 0.52, 0, null, '#8a6414', Math.max(0.6, r * 0.12));
}
/* ★ 挂锁（矢量）：锁梁 + 锁体 + 锁孔 + 光环 */
function drawLock(x, y, s, col){
  if (!isFinite(x) || !isFinite(y)) return;
  var u = Math.max(0.4, num(s, 20) / 24);
  var c = col || C.gold;
  ctx.save();
  /* 光环 */
  ell(x, y, 13 * u, 13 * u, 0, null, alpha(c, 0.22), Math.max(0.8, 1.2 * u));
  ell(x, y, 16 * u, 16 * u, 0, null, alpha(c, 0.10), Math.max(0.8, 1 * u));
  /* 锁梁 */
  ctx.strokeStyle = c; ctx.lineWidth = Math.max(1, 2.4 * u);
  ctx.beginPath();
  ctx.arc(x, y - 4 * u, 5.4 * u, Math.PI, 0);
  ctx.stroke();
  /* 锁体 */
  var bw = 18 * u, bh = 13.5 * u, bx = x - bw / 2, by = y - 3 * u;
  chamferPath(bx, by, bw, bh, 2.2 * u);
  ctx.fillStyle = c; ctx.fill();
  ctx.strokeStyle = alpha('#08111c', 0.85); ctx.lineWidth = Math.max(0.8, 1.2 * u); ctx.stroke();
  /* 高光 */
  poly([[bx + 1.6 * u, by + 1.6 * u], [bx + bw * 0.55, by + 1.6 * u], [bx + 1.6 * u, by + bh * 0.5]], 'rgba(255,255,255,0.28)');
  /* 锁孔 */
  ell(x, by + bh * 0.38, 2.1 * u, 2.1 * u, 0, '#0b1420');
  poly([[x - 1.3 * u, by + bh * 0.44], [x + 1.3 * u, by + bh * 0.44], [x + 2.3 * u, by + bh * 0.8], [x - 2.3 * u, by + bh * 0.8]], '#0b1420');
  ctx.restore();
}

/* =========================================================================
   模块 3 / 状态与存档
   ========================================================================= */
var SAVE_KEY = 'blockFarm_save_v1';
var state = {
  coins: 30, level: 1, exp: 0, total: 0, harvest: 0, planted: 0,
  size: 4, tiles: [], fac: [0, 0, 0, 0, 0], sel: 0, cat: 0,
  paused: false, modal: null, confirmReset: 0, toast: null,
  timer: { sc: 0, hive: 0, pond: 0 }, saveT: 0
};
function makeTiles(n){
  n = clamp(Math.round(num(n, 4)), 2, 8);
  var arr = [];
  for (var i = 0; i < n * n; i++) arr.push({ crop: -1, growth: 0, pest: false, seed: Math.random() * 100 });
  return arr;
}
function expNeed(l){ return Math.round(EXP_BASE * Math.pow(Math.max(1, num(l, 1)), 1.5)); }
function isUnlocked(i){ var c = CROPS[clamp(i, 0, CROPS.length - 1)]; return state.total >= num(c.unlock, 0); }
function unlockedCount(){
  var n = 0; for (var i = 0; i < CROPS.length; i++) if (isUnlocked(i)) n++;
  return n;
}
function buffSpr(){ var l = state.fac[0]; return l > 0 ? num(FAC[0].vals[l - 1], 1) : 1; }
function buffWind(){ var l = state.fac[1]; return l > 0 ? num(FAC[1].vals[l - 1], 1) : 1; }
function priceOf(i){
  var c = CROPS[clamp(i, 0, CROPS.length - 1)];
  var v = num(c.price, 1) * (1 + 0.03 * Math.max(0, state.level - 1)) * num(CATS[c.cat].price, 1) * buffWind();
  return Math.max(1, Math.round(v));
}
function growTimeOf(i){
  var c = CROPS[clamp(i, 0, CROPS.length - 1)];
  var v = num(c.time, 1) / Math.max(0.05, buffSpr() * num(CATS[c.cat].grow, 1));
  return Math.max(0.6, v);
}
function stageOf(g, total){
  total = Math.max(0.001, num(total, 1));
  return clamp(Math.floor(num(g) / total * 4), 0, 3);
}
function saveGame(){
  try{
    var tiles = [];
    for (var i = 0; i < state.tiles.length; i++){
      var t = state.tiles[i];
      tiles.push({ c: Math.round(num(t.crop, -1)), g: Math.round(num(t.growth, 0) * 100) / 100, p: t.pest ? 1 : 0, s: Math.round(num(t.seed, 0) * 100) / 100 });
    }
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, coins: state.coins, level: state.level, exp: state.exp, total: state.total,
      harvest: state.harvest, planted: state.planted, size: state.size, tiles: tiles,
      fac: state.fac, sel: state.sel, cat: state.cat, sound: audio.on, ts: Date.now()
    }));
  } catch (e){ /* 静默容错 */ }
}
function loadGame(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e){ raw = null; }
  if (!raw) return null;
  try{
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return null;
    state.coins = Math.max(0, num(d.coins, 30));
    state.level = Math.max(1, Math.round(num(d.level, 1)));
    state.exp = Math.max(0, num(d.exp, 0));
    state.total = Math.max(0, num(d.total, 0));
    state.harvest = Math.max(0, Math.round(num(d.harvest, 0)));
    state.planted = Math.max(0, Math.round(num(d.planted, 0)));
    state.size = clamp(Math.round(num(d.size, 4)), 4, 6);
    state.fac = [];
    for (var f = 0; f < 5; f++) state.fac.push(clamp(Math.round(num(d.fac && d.fac[f], 0)), 0, 3));
    state.sel = clamp(Math.round(num(d.sel, 0)), 0, CROPS.length - 1);
    state.cat = clamp(Math.round(num(d.cat, 0)), 0, 3);
    audio.on = d.sound === false ? false : true;
    state.tiles = makeTiles(state.size);
    if (d.tiles && d.tiles.length){
      for (var i = 0; i < state.tiles.length && i < d.tiles.length; i++){
        var s = d.tiles[i] || {};
        var ci = Math.round(num(s.c, -1));
        state.tiles[i].crop = (ci >= 0 && ci < CROPS.length) ? ci : -1;
        state.tiles[i].growth = Math.max(0, num(s.g, 0));
        state.tiles[i].pest = s.p === 1;
        state.tiles[i].seed = Math.max(0, num(s.s, i * 1.37));
      }
    }
    return { ts: Math.max(0, num(d.ts, Date.now())) };
  } catch (e){ return null; }
}
function resetGame(){
  state.coins = 30; state.level = 1; state.exp = 0; state.total = 0; state.harvest = 0; state.planted = 0;
  state.size = 4; state.fac = [0, 0, 0, 0, 0]; state.tiles = makeTiles(4); state.sel = 0; state.cat = 0;
  state.timer = { sc: 0, hive: 0, pond: 0 };
  state.modal = null; state.confirmReset = 0; state.paused = false;
  saveGame();
}

/* =========================================================================
   模块 4 / 音效
   ========================================================================= */
var audio = {
  ctx: null, on: true, ready: false,
  unlock: function(){
    if (this.ready) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.ready = true;
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e){ /* 忽略 */ }
  },
  tone: function(f, d, type, g, slide){
    if (!this.on || !this.ctx) return;
    try{
      var t0 = this.ctx.currentTime;
      var dur = Math.max(0.03, num(d, 0.12));
      var o = this.ctx.createOscillator(), gn = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(Math.max(20, num(f, 440)), t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, num(slide, f)), t0 + dur);
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(clamp(num(g, 0.07), 0.001, 0.28), t0 + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gn); gn.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e){ /* 忽略 */ }
  },
  sfx: function(name){
    if (!this.on) return;
    try{
      if (name === 'plant'){ this.tone(420, 0.07, 'triangle', 0.07, 620); }
      else if (name === 'harvest'){ this.tone(620, 0.07, 'square', 0.06, 880); this.tone(940, 0.1, 'triangle', 0.05, 1180); }
      else if (name === 'click'){ this.tone(560, 0.04, 'square', 0.04); }
      else if (name === 'error'){ this.tone(180, 0.16, 'sawtooth', 0.06, 90); }
      else if (name === 'coin'){ this.tone(1180, 0.05, 'triangle', 0.05, 1480); }
      else if (name === 'pest'){ this.tone(300, 0.09, 'sawtooth', 0.05, 220); }
      else if (name === 'level'){ var f = [523, 659, 784, 1046]; for (var i = 0; i < f.length; i++) this.tone(f[i], 0.12, 'triangle', 0.06); }
      else if (name === 'boost'){ this.tone(760, 0.07, 'triangle', 0.05, 1080); }
      else if (name === 'unlock'){ this.tone(520, 0.08, 'triangle', 0.06, 780); this.tone(880, 0.12, 'triangle', 0.05, 1320); }
    } catch (e){ /* 忽略 */ }
  }
};

/* =========================================================================
   模块 5 / 粒子特效 / 浮字 / 屏幕反馈
   ========================================================================= */
var particles = [];
var floaters = [];
var shakeAmt = 0, flashA = 0, flashCol = C.gold;
var shakeCur = { x: 0, y: 0 };
function addParticle(x, y, vx, vy, life, col, size, kind){
  if (!isFinite(x) || !isFinite(y)) return;
  particles.push({
    x: num(x), y: num(y), vx: num(vx), vy: num(vy),
    life: Math.max(0.05, num(life, 0.6)), max: Math.max(0.05, num(life, 0.6)),
    col: col || C.gold, size: Math.max(1, num(size, 3)), kind: kind || 'coin'
  });
  if (particles.length > 320) particles.splice(0, particles.length - 320);
}
function addFloat(x, y, txt, col, size){
  if (!isFinite(x) || !isFinite(y) || txt === undefined) return;
  floaters.push({ x: num(x), y: num(y), vy: -34, txt: String(txt), col: col || C.gold, life: 1.15, max: 1.15, size: Math.max(8, num(size, 14)) });
  if (floaters.length > 90) floaters.splice(0, floaters.length - 90);
}
function showToast(txt, col){ state.toast = { txt: String(txt), col: col || C.text, t: 2.4 }; }
function updateEffects(dt){
  var i;
  for (i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'coin') p.vy += 150 * dt; else p.vy += 40 * dt;
  }
  for (i = floaters.length - 1; i >= 0; i--){
    var f = floaters[i];
    f.life -= dt; f.y += f.vy * dt; f.vy *= (1 - dt * 1.2);
    if (f.life <= 0) floaters.splice(i, 1);
  }
  shakeAmt = Math.max(0, shakeAmt - dt * 22);
  flashA = Math.max(0, flashA - dt * 1.7);
  if (state.toast){ state.toast.t -= dt; if (state.toast.t <= 0) state.toast = null; }
  if (state.confirmReset > 0){ state.confirmReset -= dt; if (state.confirmReset <= 0) state.confirmReset = 0; }
}

/* =========================================================================
   模块 6 / 布局计算
   ========================================================================= */
var geomCache = { N: 4, tw: 80, th: 40, ox: 0, oy: 0 };
function computeLayout(){
  var W = view.w, H = view.h;
  lay.hits = [];
  lay.portrait = (H > W * 0.92);
  var pad = lay.portrait ? 9 : 14;
  if (!lay.portrait){
    var topH = clamp(H * 0.105, 62, 84);
    var hintH = 32;
    var leftW = clamp(W * 0.215, 246, 330);
    var rightW = clamp(W * 0.2, 224, 300);
    lay.top = { x: pad, y: pad, w: W - pad * 2, h: topH - pad };
    lay.left = { x: pad, y: topH, w: leftW - pad * 0.5, h: H - topH - hintH - pad * 2 };
    lay.right = { x: W - rightW + pad * 0.5, y: topH, w: rightW - pad * 0.5, h: H - topH - hintH - pad * 2 };
    lay.center = { x: pad + leftW, y: topH, w: Math.max(180, W - leftW - rightW - pad * 2), h: H - topH - hintH - pad * 2 };
    var facH = clamp(lay.center.h * 0.28, 122, 176);
    lay.fac = { x: lay.center.x, y: lay.center.y + lay.center.h - facH, w: lay.center.w, h: facH };
    lay.field = { x: lay.center.x, y: lay.center.y, w: lay.center.w, h: Math.max(140, lay.center.h - facH - 8) };
    lay.hint = { x: pad, y: H - hintH + 2, w: W - pad * 2, h: hintH - 6 };
  } else {
    var small = H < 640;
    var metricH = clamp(H * (small ? 0.15 : 0.17), 88, 132);
    var facH = clamp(H * (small ? 0.125 : 0.14), 92, 126);
    var tabH = small ? 36 : 42;
    var cardH = clamp(H * (small ? 0.115 : 0.128), 82, 118);
    var btnH = small ? 38 : 44;
    var hintH = 26;
    var gap = 8;
    lay.top = { x: pad, y: pad, w: W - pad * 2, h: metricH };
    var y = pad + metricH + gap;
    lay.fac = { x: pad, y: y, w: W - pad * 2, h: facH };
    y += facH + gap;
    var bottom = tabH + gap + cardH + gap + btnH + gap + hintH + gap;
    var fh = Math.max(110, H - y - bottom - pad);
    lay.field = { x: pad, y: y, w: W - pad * 2, h: fh };
    y += fh + gap;
    lay.tabs = { x: pad, y: y, w: W - pad * 2, h: tabH }; y += tabH + gap;
    lay.cards = { x: pad, y: y, w: W - pad * 2, h: cardH }; y += cardH + gap;
    lay.btns = { x: pad, y: y, w: W - pad * 2, h: btnH }; y += btnH + gap;
    lay.hint = { x: pad, y: y, w: W - pad * 2, h: hintH };
    lay.left = lay.tabs; lay.right = lay.btns;
  }
  computeGeom();
}
function computeGeom(){
  var F = lay.field || { x: 0, y: 0, w: 300, h: 300 };
  var N = clamp(state.size, 2, 8);
  var tw = Math.min(F.w * 0.94 / N, F.h / (N / 2 + 0.85));
  tw = clamp(tw, 22, 150);
  geomCache.N = N;
  geomCache.tw = tw;
  geomCache.th = tw / 2;
  geomCache.ox = F.x + F.w / 2;
  geomCache.oy = F.y + tw * 0.78;
}
function tileCenter(c, r){
  return { x: geomCache.ox + (num(c) - num(r)) * geomCache.tw / 2, y: geomCache.oy + (num(c) + num(r)) * geomCache.th / 2 };
}
function screenToTile(x, y){
  var g = geomCache;
  if (g.tw < 4) return -1;
  var dx = (num(x) - shakeCur.x) - g.ox, dy = (num(y) - shakeCur.y) - g.oy;
  var c = (dx / (g.tw / 2) + dy / (g.th / 2)) / 2;
  var r = (dy / (g.th / 2) - dx / (g.tw / 2)) / 2;
  var ci = Math.floor(c + 0.5), ri = Math.floor(r + 0.5);
  if (!isFinite(ci) || !isFinite(ri)) return -1;
  if (ci < 0 || ri < 0 || ci >= g.N || ri >= g.N) return -1;
  return ri * g.N + ci;
}

/* =========================================================================
   模块 7 / 瓦片与作物绘制
   ========================================================================= */
function tilePath(x, y, tw){
  var hw = Math.max(1, num(tw, 40) / 2), hh = Math.max(1, num(tw, 40) / 4);
  ctx.beginPath();
  ctx.moveTo(num(x), num(y) - hh); ctx.lineTo(num(x) + hw, num(y));
  ctx.lineTo(num(x), num(y) + hh); ctx.lineTo(num(x) - hw, num(y));
  ctx.closePath();
}
/* --- 种子：按类别区分 --- */
function drawSeed(cat, x, y, s, t, ph){
  var u = Math.max(2, num(s, 20)) / 30, cx = x, cy = y - 1.5 * u, i;
  if (cat === 0){
    var an = [-0.72, -0.12, 0.52];
    for (i = 0; i < 3; i++){
      var px2 = cx + (i - 1) * 7 * u, py = cy + (i === 1 ? -2.6 * u : 1.8 * u);
      ell(px2, py, 3.9 * u, 1.85 * u, an[i], '#e2b349', '#7d5c18', 0.9 * u);
      ell(px2 - 1.1 * u, py - 0.7 * u, 1.35 * u, 0.5 * u, an[i], 'rgba(255,241,190,0.72)');
    }
  } else if (cat === 1){
    var pts = [[-6, 2.2], [6, 2.2], [0, -4.6]];
    for (i = 0; i < 3; i++){
      var qx = cx + pts[i][0] * u, qy = cy + pts[i][1] * u;
      ell(qx, qy, 3.3 * u, 3 * u, 0, '#59bf63', '#276234', 0.9 * u);
      ell(qx - 1.15 * u, qy - 1.15 * u, 1.2 * u, 0.92 * u, -0.6, 'rgba(226,255,228,0.8)');
    }
  } else if (cat === 2){
    var pos = [[-6.6, 1.5], [0, -3.4], [6.6, 1.5]];
    for (i = 0; i < 3; i++){
      var mx = cx + pos[i][0] * u, my = cy + pos[i][1] * u, rot = [-0.45, 0, 0.45][i];
      ell(mx, my, 3.9 * u, 2.4 * u, rot, '#2f7f4c', '#173f27', 0.9 * u);
      line(mx - 3 * u * Math.cos(rot), my - 3 * u * Math.sin(rot), mx + 3 * u * Math.cos(rot), my + 3 * u * Math.sin(rot), 'rgba(180,255,210,0.35)', 0.8 * u);
    }
  } else {
    var sp = [[-5, -2.5], [5, -2.5], [-5, 3], [5, 3]];
    for (i = 0; i < 4; i++){
      var fx = cx + sp[i][0] * u, fy = cy + sp[i][1] * u;
      ell(fx, fy, 1.9 * u, 1.5 * u, i * 0.6, '#ff8fc4', '#a12c62', 0.7 * u);
      ell(fx - 0.5 * u, fy - 0.5 * u, 0.7 * u, 0.5 * u, 0, 'rgba(255,235,245,0.8)');
    }
  }
}
/* --- 幼苗：按类别区分 --- */
function drawSeedling(cat, x, y, s, t, ph, col){
  var u = Math.max(2, num(s, 20)) / 30, i, sw = Math.sin(t * 1.9 + ph) * 2.2 * u;
  if (cat === 0){
    for (i = 0; i < 5; i++){
      var dx = (i - 2) * 3.4 * u, lean = (i - 2) * 3.2 * u;
      curve(x + dx, y, x + dx + lean * 0.4 + sw * 0.4, y - 11 * u, x + dx + lean + sw * (0.7 + i * 0.1), y - 21 * u, i % 2 ? '#6fd06a' : '#8ce07c', 1.9 * u);
    }
  } else if (cat === 1){
    line(x, y, x + sw * 0.35, y - 12 * u, '#4fae52', 2.4 * u);
    ell(x - 7.5 * u + sw * 0.4, y - 11 * u, 6.2 * u, 4.2 * u, -0.42, '#43c25c', '#1e6b32', 1 * u);
    ell(x + 7.5 * u + sw * 0.4, y - 11 * u, 6.2 * u, 4.2 * u, 0.42, '#43c25c', '#1e6b32', 1 * u);
    ell(x + sw * 0.4, y - 17 * u, 3.6 * u, 4.4 * u, 0, '#63d877', '#256f36', 1 * u);
  } else if (cat === 2){
    curve(x, y, x - 4 * u + sw * 0.3, y - 10 * u, x + 2 * u + sw * 0.6, y - 17 * u, '#3f9e57', 2.1 * u);
    var hx = x - 7 * u + sw * 0.5, hy = y - 13 * u;
    poly([[hx, hy - 6 * u], [hx - 5 * u, hy - 1 * u], [hx - 3.2 * u, hy + 4.6 * u], [hx, hy + 1.6 * u], [hx + 3.2 * u, hy + 4.6 * u], [hx + 5 * u, hy - 1 * u]], '#4cc46a', '#1f6b36', 1 * u);
    ctx.strokeStyle = '#79e39a'; ctx.lineWidth = Math.max(0.6, 1.2 * u);
    ctx.beginPath(); ctx.arc(x + 9 * u + sw * 0.5, y - 12 * u, 3 * u, 0.6, 4.2); ctx.stroke();
    ell(x + 2 * u + sw * 0.6, y - 18 * u, 3.2 * u, 2.4 * u, -0.3, '#63d877', '#256f36', 0.9 * u);
  } else {
    line(x, y, x + sw * 0.35, y - 13 * u, '#8b5a2b', 2.6 * u);
    ell(x - 7 * u + sw * 0.4, y - 13 * u, 5.6 * u, 4 * u, -0.4, '#4bbf63', '#1e6b32', 1 * u);
    ell(x + 7 * u + sw * 0.4, y - 13 * u, 5.6 * u, 4 * u, 0.4, '#4bbf63', '#1e6b32', 1 * u);
    ell(x + sw * 0.5, y - 19 * u, 3 * u, 3.4 * u, 0, col || '#ff6bd6', '#7a2b52', 1 * u);
    ell(x + sw * 0.5 - 1 * u, y - 20 * u, 1.1 * u, 1.2 * u, 0, 'rgba(255,255,255,0.6)');
  }
}
/* --- 未熟：类别形态放大 + 作物色幼果 --- */
/* ★ 修复：缩放必须围绕作物锚点 (x,y)，否则整株会被平移到 (1.2x,1.2y) 造成图层错位 */
function drawUnripe(cat, x, y, s, t, ph, col){
  var u = Math.max(2, num(s, 20)) / 30;
  x = num(x); y = num(y);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.2, 1.2);
  ctx.translate(-x, -y);
  drawSeedling(cat, x, y, s, t, ph, col);
  ctx.restore();
  var sw = Math.sin(t * 1.6 + ph) * 1.6 * u;
  ell(x + sw, y - 22 * u, 4.2 * u, 3.8 * u, 0, col || '#7bd88a', '#20462c', 1 * u);
  ell(x + sw - 1.3 * u, y - 23 * u, 1.5 * u, 1.1 * u, -0.5, 'rgba(255,255,255,0.42)');
}
/* --- 成熟形态：12 种独立矢量 --- */
function cropWheat(x, y, u, t, ph){
  var sway = Math.sin(t * 1.5 + ph) * 2.2 * u, i, j;
  for (i = 0; i < 3; i++){
    var dx = (i - 1) * 7 * u, lean = (i - 1) * 3.4 * u;
    var tx = x + dx + lean + sway * (0.5 + i * 0.18), ty = y - 33 * u;
    var mx = x + dx + lean * 0.4 + sway * 0.3, my = y - 18 * u;
    curve(x + dx, y, mx, my, tx, ty, '#b98f2e', 2.1 * u);
    for (j = 0; j < 7; j++){
      var q = qpt(x + dx, y, mx, my, tx, ty, 0.42 + j * 0.09);
      var gz = 1 - j * 0.035;
      ell(q.x - 3.1 * u * gz, q.y, 2.7 * u * gz, 1.62 * u * gz, -0.55, '#f0c33c');
      ell(q.x + 3.1 * u * gz, q.y, 2.7 * u * gz, 1.62 * u * gz, 0.55, '#ffdf7a');
    }
    for (j = 0; j < 3; j++){
      var q2 = qpt(x + dx, y, mx, my, tx, ty, 0.6 + j * 0.16);
      line(q2.x, q2.y, q2.x + (j - 1) * 3.6 * u + sway * 0.35, q2.y - 9 * u, 'rgba(255,231,158,0.85)', 1.05 * u);
    }
  }
}
function cropCorn(x, y, u, t, ph){
  var sway = Math.sin(t * 1.2 + ph) * 1.7 * u;
  curve(x, y, x + sway * 0.5, y - 16 * u, x + sway, y - 30 * u, '#7fae3c', 2.5 * u);
  poly([[x - 3 * u, y - 8 * u], [x - 13 * u, y - 21 * u], [x - 6 * u, y - 24 * u], [x - 1 * u, y - 13 * u]], '#3f8f3a', '#20541f', 1 * u);
  poly([[x + 3 * u, y - 8 * u], [x + 13 * u, y - 21 * u], [x + 6 * u, y - 24 * u], [x + 1 * u, y - 13 * u]], '#4aa044', '#20541f', 1 * u);
  var cx = x + sway * 0.6, cy = y - 19 * u;
  ell(cx, cy, 5.6 * u, 11.5 * u, 0.12, '#ffd23f', '#c99a1c', 1.4 * u);
  var r, c2;
  for (r = 0; r < 6; r++){
    for (c2 = -1; c2 <= 1; c2++){
      var a = c2 * 0.36;
      ell(cx + Math.sin(a) * 5.2 * u, cy - 8.6 * u + r * 3.3 * u, 1.75 * u, 1.55 * u, 0.12, (r + c2) % 2 ? '#f0bb2c' : '#ffe287');
    }
  }
  for (r = 0; r < 4; r++){
    curve(cx, cy - 11 * u, cx + (r - 1.5) * 3 * u, cy - 16 * u, cx + (r - 1.5) * 6.5 * u + sway, cy - 20 * u, '#e8b93c', 1.1 * u);
  }
}
function cropRice(x, y, u, t, ph){
  var sway = Math.sin(t * 1.1 + ph) * 2.2 * u, i, j;
  for (i = 0; i < 3; i++){
    var dx = (i - 1) * 8 * u;
    var dir = (i - 1) === 0 ? 1 : (i - 1);
    curve(x + dx, y, x + dx * 1.15 + sway * 0.4, y - 15 * u, x + dx * 1.35 + sway, y - 23 * u, '#9ab84f', 2 * u);
    var ex = x + dx * 1.35 + sway, ey = y - 23 * u;
    var cx2 = ex + dir * 7 * u + sway * 0.4, cy2 = ey + 1 * u;
    var ex2 = ex + dir * 13 * u + sway * 0.7, ey2 = ey + 12 * u;
    curve(ex, ey, cx2, cy2, ex2, ey2, '#c2b055', 1.5 * u);
    for (j = 0; j < 8; j++){
      var q = qpt(ex, ey, cx2, cy2, ex2, ey2, j / 7);
      ell(q.x + (j % 2 ? 1.6 * u : -1.6 * u), q.y + 1.4 * u, 2.1 * u, 1.15 * u, 0.5 + j * 0.12, '#e8d27a', '#a08b32', 0.6 * u);

  }
}
function cropTurnip(x, y, u, t, ph){

  var rows = [[4, -20], [3, -14.5], [2, -9], [1, -4]];

function drawCrop(i, x, y, s, stage, t, ph){
  var idx = clamp(Math.round(num(i, 0)), 0, CROPS.length - 1);
  var c = CROPS[idx];
  var u = Math.max(2, num(s, 20)) / 30;
  x = num(x); y = num(y);
  if (!isFinite(x) || !isFinite(y)) return;
  if (stage <= 0) drawSeed(c.cat, x, y, s, t, ph);
  else if (stage === 1) drawSeedling(c.cat, x, y, s, t, ph, c.col);
  else if (stage === 2) drawUnripe(c.cat, x, y, s, t, ph, c.col);
  else {
    ctx.save();
    ctx.shadowColor = alpha(c.col, 0.55); ctx.shadowBlur = Math.max(4, Math.min(20, 12 * u));
    MATURE[idx](x, y, u, t, ph);
    ctx.restore();
  }
}
function drawPest(x, y, s, t, seed){
  var u = Math.max(2, num(s, 20)) / 30, wob = Math.sin(t * 3 + num(seed) * 3) * 1.6 * u;
  var px2 = num(x) + wob, py2 = num(y);
  ell(px2, py2 + 9 * u, 7 * u, 2.6 * u, 0, 'rgba(0,0,0,0.32)');
  var pulse = 0.45 + 0.25 * Math.sin(t * 4 + num(seed));
  ell(px2, py2, 9 * u, 9 * u, 0, null, alpha('#ff5b6e', pulse), 1.6 * u);
  ell(px2, py2 + 2 * u, 4.6 * u, 5.4 * u, 0, '#c22f45', '#5d1220', 1 * u);
  ell(px2, py2 - 3.4 * u, 3 * u, 2.8 * u, 0, '#7d1b2c', '#3b0c15', 0.9 * u);
  for (var i = -1; i <= 1; i++) line(px2 + i * 3 * u, py2 + 2 * u, px2 + i * 6 * u, py2 + 6 * u, '#7d1b2c', 1.1 * u);
  line(px2 - 1.6 * u, py2 - 6 * u, px2 - 4.4 * u, py2 - 9 * u, '#7d1b2c', 1 * u);
  line(px2 + 1.6 * u, py2 - 6 * u, px2 + 4.4 * u, py2 - 9 * u, '#7d1b2c', 1 * u);
}
function drawSparkle(x, y, seed, t, tw, col){
  var cyc = fract(t * 0.5 + hash1(num(seed) * 3.17));
  if (cyc > 0.2) return;
  var a = (1 - cyc / 0.2) * 0.9;
  var r = Math.max(1, num(tw, 40) * 0.13 * (0.5 + cyc * 3.4));
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  ctx.strokeStyle = col || '#ffffff'; ctx.lineWidth = Math.max(1, num(tw, 40) * 0.014);
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
  ctx.strokeStyle = alpha(col || '#ffffff', 0.5);
  ctx.beginPath();
  ctx.moveTo(x - r * 0.6, y - r * 0.6); ctx.lineTo(x + r * 0.6, y + r * 0.6);
  ctx.moveTo(x + r * 0.6, y - r * 0.6); ctx.lineTo(x - r * 0.6, y + r * 0.6);
  ctx.stroke();
  ctx.restore();
}

   模块 9 / 游戏逻辑
   ========================================================================= */
function plant(idx, silent){
  var t = state.tiles[idx];
  if (!t) return false;
  if (t.crop >= 0) return false;
  var ci = clamp(state.sel, 0, CROPS.length - 1);
  var c = CROPS[ci];
  if (!isUnlocked(ci)){
    if (!silent){ showToast('未解锁：需累计金币 ' + fmtNum(c.unlock), C.danger); audio.sfx('error'); }
    return false;
  }
  if (state.coins < c.cost){
    if (!silent){ showToast('金币不足，需要 ' + fmtInt(c.cost), C.danger); audio.sfx('error'); shakeAmt = Math.max(shakeAmt, 4); }
    return false;
  }
  state.coins -= c.cost;
  state.planted++;
  t.crop = ci; t.growth = 0; t.pest = false;
  if (!silent){
    var p = tileCenter(idx % state.size, Math.floor(idx / state.size));
    addFloat(p.x, p.y - geomCache.tw * 0.2, '-' + fmtInt(c.cost), C.dim, 13);
    for (var i = 0; i < 5; i++) addParticle(p.x, p.y, (Math.random() - 0.5) * 60, -40 - Math.random() * 60, 0.55, CATS[c.cat].color, 2.6, 'spark');
    audio.sfx('plant');
  }
  return true;
}
function speedUp(idx){
  var t = state.tiles[idx];
  if (!t || t.crop < 0) return;
  var total = growTimeOf(t.crop);
  t.growth = Math.min(total, t.growth + total * 0.22);
  var p = tileCenter(idx % state.size, Math.floor(idx / state.size));
  addFloat(p.x, p.y - geomCache.tw * 0.35, '加速 +22%', C.cyan, 13);
  for (var i = 0; i < 5; i++) addParticle(p.x, p.y - geomCache.tw * 0.2, (Math.random() - 0.5) * 70, -50 - Math.random() * 50, 0.5, C.cyan, 2.4, 'spark');
  audio.sfx('boost');
}
function clearPest(idx){
  var t = state.tiles[idx];
  if (!t || !t.pest) return;
  t.pest = false;
  var p = tileCenter(idx % state.size, Math.floor(idx / state.size));
  addFloat(p.x, p.y - geomCache.tw * 0.3, '除虫成功', C.green, 13);
  for (var i = 0; i < 6; i++) addParticle(p.x, p.y - geomCache.tw * 0.15, (Math.random() - 0.5) * 90, -60 - Math.random() * 60, 0.55, C.green, 2.4, 'spark');
  audio.sfx('pest');
}
function harvest(idx, auto){
  var t = state.tiles[idx];
  if (!t || t.crop < 0) return 0;
  var ci = clamp(t.crop, 0, CROPS.length - 1);
  var c = CROPS[ci];
  if (t.growth < growTimeOf(ci)) return 0;
  var price = priceOf(ci);
  state.coins += price;
  state.total += price;
  state.harvest++;
  state.exp += price / 2;
  var p = tileCenter(idx % state.size, Math.floor(idx / state.size));
  addFloat(p.x, p.y - geomCache.tw * 0.42, '+' + fmtInt(price), C.gold, 16);
  for (var i = 0; i < 10; i++){
    addParticle(p.x + (Math.random() - 0.5) * geomCache.tw * 0.2, p.y - geomCache.tw * 0.12,
      (Math.random() - 0.5) * 110, -70 - Math.random() * 90, 0.75 + Math.random() * 0.35,
      i % 3 === 0 ? C.gold : c.col, 2.4 + Math.random() * 2, i % 4 === 0 ? 'coin' : 'spark');
  }
  t.crop = -1; t.growth = 0; t.pest = false; t.seed = Math.random() * 100;
  if (!auto) audio.sfx('harvest');
  flashA = Math.max(flashA, 0.16); flashCol = c.col;
  while (state.exp >= expNeed(state.level)){
    state.exp -= expNeed(state.level);
    state.level++;
    showToast('升级！等级 ' + state.level + ' · 全体收益 +3%', C.gold);
    audio.sfx('level');
    flashA = 0.32; flashCol = C.gold;
    shakeAmt = Math.max(shakeAmt, 5);
  }
  return price;
}
function upgradeFacility(i){
  i = clamp(Math.round(num(i, 0)), 0, 4);
  var lv = state.fac[i];
  if (lv >= 3){ showToast(FAC[i].name + ' 已满级', C.dim); audio.sfx('click'); return; }
  var price = num(FAC[i].prices[lv], 0);
  if (state.coins < price){
    showToast('金币不足，升级 ' + FAC[i].name + ' 需要 ' + fmtInt(price), C.danger);
    audio.sfx('error'); shakeAmt = Math.max(shakeAmt, 4);
    return;
  }
  state.coins -= price;
  state.fac[i] = lv + 1;
  showToast(FAC[i].name + ' 升至 Lv.' + (lv + 1) + ' · ' + FAC[i].unit + '提升', FAC[i].color);
  audio.sfx('level');
  flashA = Math.max(flashA, 0.2); flashCol = FAC[i].color;
  saveGame();
}
function expandFarm(){
  if (state.size >= 6){ showToast('农田已达上限 36 格', C.dim); audio.sfx('click'); return; }
  var cost = state.size === 4 ? 350 : 900;
  if (state.coins < cost){ showToast('金币不足，扩建需要 ' + fmtInt(cost), C.danger); audio.sfx('error'); shakeAmt = Math.max(shakeAmt, 4); return; }
  state.coins -= cost;
  var old = state.tiles, oldN = state.size;
  state.size = state.size + 1;
  var next = makeTiles(state.size);
  for (var r = 0; r < oldN; r++) for (var c = 0; c < oldN; c++) next[r * state.size + c] = old[r * oldN + c];
  state.tiles = next;
  showToast('农田扩建为 ' + state.size + '×' + state.size, C.lime);
  audio.sfx('level');
  computeGeom();
  saveGame();
}
function tileClick(idx){
  var t = state.tiles[idx];
  if (!t) return;
  if (t.crop < 0){ plant(idx); return; }
  if (t.pest){ clearPest(idx); return; }
  if (t.growth >= growTimeOf(t.crop)) harvest(idx, false);
  else speedUp(idx);
}
function offlineRate(){
  return (0.25 + state.fac[2] * 0.55 + state.fac[4] * 0.9) * buffSpr() * (1 + state.level * 0.03 + unlockedCount() * 0.05);
}

function drawField(){

  /* 扩建按钮 */
  if (state.size < 6){

    drawCoinIcon(bx + bw - 44, by + bh / 2, 6);

  } else {
    text('农田已达上限 36 格', F.x + F.w - 8, F.y + 16, 10, C.dim, 'right', 600);
  }
  /* ---- 第一遍：全部地块（体 + 顶面 + 高亮） ---- */
  var depth = Math.max(2.5, tw * 0.085);
  var s, c, r, idx, tile, p, x, y;
  for (s = 0; s <= 2 * (N - 1); s++){
    for (c = 0; c < N; c++){
      r = s - c;
      if (r < 0 || r >= N) continue;
      idx = r * N + c;
      tile = state.tiles[idx];
      if (!tile) continue;
      p = tileCenter(c, r);
      x = num(p.x); y = num(p.y);
      if (!isFinite(x) || !isFinite(y)) continue;
      tilePath(x, y + depth, tw);
      ctx.fillStyle = '#0a1220'; ctx.fill();
      tilePath(x, y, tw);
      var grad = ctx.createLinearGradient(x - tw / 2, y - th, x + tw / 2, y + th);
      var v = hash1(num(tile.seed) * 7.31) * 0.05;
      grad.addColorStop(0, alpha('#2a4061', 0.55 + v));
      grad.addColorStop(1, alpha('#0d1727', 1));
      ctx.fillStyle = grad; ctx.fill();
      var isHover = (hoverTile === idx && !state.modal);
      ctx.strokeStyle = isHover ? C.cyan : C.line;
      ctx.lineWidth = isHover ? 1.9 : 1.1;
      ctx.stroke();
      line(x - tw / 2, y, x, y - th, 'rgba(255,255,255,0.055)', 1);
    }
  }
  /* ---- 第二遍：作物 / 害虫 / 闪光（同样由后向前） ---- */
  for (s = 0; s <= 2 * (N - 1); s++){
    for (c = 0; c < N; c++){
      r = s - c;
      if (r < 0 || r >= N) continue;
      idx = r * N + c;
      tile = state.tiles[idx];
      if (!tile) continue;
      p = tileCenter(c, r);
      x = num(p.x); y = num(p.y);
      if (!isFinite(x) || !isFinite(y)) continue;
      if (tile.crop >= 0){
        var ci = clamp(tile.crop, 0, CROPS.length - 1);
        var stage = stageOf(tile.growth, growTimeOf(ci));
        ell(x, y + th * 0.13, Math.max(1, tw * 0.2), Math.max(1, tw * 0.076), 0, 'rgba(0,0,0,0.42)');
        drawCrop(ci, x, y + th * 0.02, Math.max(6, tw * 0.6), stage, T, num(tile.seed) * 6.28);
        if (stage === 3){
          drawSparkle(x, y - tw * 0.24, num(tile.seed) * 1.7, T, tw, CROPS[ci].col);
          ctx.save();
          ctx.globalAlpha = 0.22 + 0.1 * Math.sin(T * 2.4 + num(tile.seed));
          tilePath(x, y, tw);
          ctx.strokeStyle = CROPS[ci].col; ctx.lineWidth = 2.2; ctx.stroke();
          ctx.restore();
        }
      }
      if (tile.pest) drawPest(x, y - th * 0.26, tw * 1.05, T, tile.seed);
    }
  }

    var R2 = lay.btns, gap2 = 6, bw2 = (R2.w - gap2 * 3) / 4;
    var items2 = [
      ['声音', audio.on ? '开' : '关', C.cyan],
      ['暂停', state.paused ? '继续' : '暂停', C.lime],
      ['重开', state.confirmReset > 0 ? '确认?' : '重开', C.danger],
      ['扩建', state.size >= 6 ? '已满' : (state.size === 4 ? '350' : '900'), C.gold]
    ];
    for (var m = 0; m < 4; m++){
      var mx = R2.x + m * (bw2 + gap2);
      chamferPath(mx, R2.y, bw2, R2.h, 5);
      var act2 = (m === 0 && audio.on) || (m === 1 && state.paused) || (m === 2 && state.confirmReset > 0);
      ctx.fillStyle = act2 ? alpha(items2[m][2], 0.2) : '#0f1a2c'; ctx.fill();
      ctx.strokeStyle = act2 ? items2[m][2] : C.line; ctx.lineWidth = 1.2; ctx.stroke();
      text(items2[m][0], mx + bw2 / 2, R2.y + R2.h * 0.32, 10, C.dim, 'center', 700);
      text(items2[m][1], mx + bw2 / 2, R2.y + R2.h * 0.68, 11.5, items2[m][2], 'center', 800);
      if (m < 3) hit('btn:' + m, mx, R2.y, bw2, R2.h);
      else hit('btn:expand2', mx, R2.y, bw2, R2.h);
    }
  }
}
function drawHint(){
  var R = lay.hint;
  chamferPath(R.x, R.y, R.w, R.h, 4);
  ctx.fillStyle = alpha('#122238', 0.6); ctx.fill();
  ctx.strokeStyle = C.lineSoft; ctx.lineWidth = 1; ctx.stroke();
  text('点空地播种 · 点幼苗加速 · 点成熟收获 · 点害虫除虫 · 长按空地连续播种 · 点设施升级 · 带锁作物需累计金币解锁 · 离线收益上限 8 小时',
    R.x + R.w / 2, R.y + R.h / 2, lay.portrait ? 8.5 : 10.5, C.dim, 'center', 600);
}
function drawEffects(){
  var i;
  for (i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = clamp(p.life / Math.max(0.05, p.max), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    if (p.kind === 'coin') drawCoinIcon(p.x, p.y, Math.max(1.2, p.size));
    else {
      var s2 = Math.max(1, p.size);
      poly([[p.x, p.y - s2], [p.x + s2 * 0.7, p.y], [p.x, p.y + s2], [p.x - s2 * 0.7, p.y]], p.col);
    }
    ctx.restore();
  }
  for (i = 0; i < floaters.length; i++){
    var f = floaters[i];
    ctx.save(); ctx.globalAlpha = clamp(f.life / Math.max(0.05, f.max), 0, 1);
    text(f.txt, f.x, f.y, f.size, f.col, 'center', 800, true);
    ctx.restore();
  }
}
function drawToast(){
  if (!state.toast) return;
  var t = state.toast;
  var a = clamp(t.t / 0.5, 0, 1);
  var w = Math.min(view.w * 0.86, 70 + t.txt.length * 15);
  var x = view.w / 2 - w / 2, y = (lay.top ? lay.top.y + lay.top.h + 14 : 20);
  ctx.save(); ctx.globalAlpha = a;
  chamferPath(x, y, w, 32, 6);
  ctx.fillStyle = alpha(t.col, 0.14); ctx.fill();
  ctx.strokeStyle = t.col; ctx.lineWidth = 1.3; ctx.stroke();
  text(t.txt, x + w / 2, y + 16, 12.5, C.text, 'center', 700);
  ctx.restore();
}
function drawModal(){
  if (!state.modal) return;
  var W = view.w, H = view.h;
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,11,0.72)'; ctx.fillRect(0, 0, W, H);
  var m = state.modal;
  var pw = Math.min(420, W * 0.86), ph = 216;
  var x = W / 2 - pw / 2, y = H / 2 - ph / 2;
  panelBox(x, y, pw, ph, C.gold, null, 12);
  if (m.type === 'offline'){
    text('欢迎回来', x + pw / 2, y + 32, 19, C.text, 'center', 800);
    text('离线时长 ' + fmtTime(m.secs), x + pw / 2, y + 66, 13, C.dim, 'center', 600, true);
    drawCoinIcon(x + pw / 2 - 42, y + 100, 11);
    text('+' + fmtNum(m.coins), x + pw / 2 + 12, y + 100, 26, C.gold, 'center', 800, true);
    text('离线收益 = (0.25 + 稻草人×0.55 + 鱼塘×0.9) × 洒水器 × 进度系数', x + pw / 2, y + 130, 9.5, C.dim, 'center', 600);
    var bw = 150, bh = 38, bx = x + pw / 2 - bw / 2, by = y + ph - 58;
    chamferPath(bx, by, bw, bh, 6);
    ctx.fillStyle = alpha(C.gold, 0.2); ctx.fill();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.stroke();
    text('领取收益', bx + bw / 2, by + bh / 2, 14, C.gold, 'center', 800);
    hit('modal:ok', bx, by, bw, bh);
  } else {
    text('重新开始', x + pw / 2, y + 44, 19, C.text, 'center', 800);
    text('将清空金币、等级、农田与设施进度', x + pw / 2, y + 82, 12, C.dim, 'center', 600);
    text('此操作不可撤销', x + pw / 2, y + 106, 12, C.danger, 'center', 700);
    var bw2 = 130, bh2 = 38, by2 = y + ph - 58;
    chamferPath(x + 24, by2, bw2, bh2, 6);
    ctx.fillStyle = '#12202f'; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 1.3; ctx.stroke();
    text('取消', x + 24 + bw2 / 2, by2 + bh2 / 2, 13, C.dim, 'center', 700);
    chamferPath(x + pw - 24 - bw2, by2, bw2, bh2, 6);
    ctx.fillStyle = alpha(C.danger, 0.18); ctx.fill(); ctx.strokeStyle = C.danger; ctx.lineWidth = 1.5; ctx.stroke();
    text('确认重开', x + pw - 24 - bw2 / 2, by2 + bh2 / 2, 13, C.danger, 'center', 800);
    hit('modal:cancel', x + 24, by2, bw2, bh2);
    hit('modal:reset', x + pw - 24 - bw2, by2, bw2, bh2);
  }
  ctx.restore();
}
function render(){
  var W = view.w, H = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  lay.hits = [];
  drawBackground();
  shakeCur.x = shakeAmt * Math.sin(T * 47) * 0.6;
  shakeCur.y = shakeAmt * Math.cos(T * 39) * 0.6;
  ctx.save();
  ctx.translate(num(shakeCur.x), num(shakeCur.y));
  drawTopBar();
  drawShop();
  drawField();
  drawFacilityBand();
  drawSide();
  drawHint();
  ctx.restore();
  drawEffects();
  if (flashA > 0.001){
    ctx.save(); ctx.globalAlpha = clamp(flashA, 0, 0.45);
    ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  drawToast();
  drawModal();
  if (state.paused && !state.modal){
    ctx.save();
    ctx.fillStyle = 'rgba(7,9,15,0.45)'; ctx.fillRect(0, 0, W, H);
    text('已暂停', W / 2, H / 2, 28, C.lime, 'center', 800);
    text('点击「继续」恢复游戏', W / 2, H / 2 + 30, 12, C.dim, 'center', 600);
    ctx.restore();
  }
}

/* =========================================================================
   模块 11 / 更新循环
   ========================================================================= */
function update(dt){
  dt = clamp(dt, 0, 0.1);
  if (state.paused){ updateEffects(dt); return; }
  var N = state.size, i;
  for (i = 0; i < state.tiles.length; i++){
    var t = state.tiles[i];
    if (!t || t.crop < 0) continue;
    var ci = clamp(t.crop, 0, CROPS.length - 1);
    var total = growTimeOf(ci);
    if (t.growth >= total) continue;
    var s0 = stageOf(t.growth, total);
    t.growth = Math.min(total, t.growth + dt * (t.pest ? 0.25 : 1));
    var s1 = stageOf(t.growth, total);
    if (s1 > s0){
      if (s1 < 3){
        var chance = 0.08 * num(CATS[CROPS[ci].cat].pest, 1);
        if (!t.pest && Math.random() < chance){
          t.pest = true;
          var pc = tileCenter(i % N, Math.floor(i / N));
          addFloat(pc.x, pc.y - geomCache.tw * 0.3, '出现害虫!', C.danger, 12);
          audio.sfx('pest');
        }
      } else {
        var mc = tileCenter(i % N, Math.floor(i / N));
        addFloat(mc.x, mc.y - geomCache.tw * 0.34, '成熟', CROPS[ci].col, 12);
      }
    }
  }
  if (state.fac[2] > 0){
    state.timer.sc += dt;
    if (state.timer.sc >= num(FAC[2].vals[state.fac[2] - 1], 4.5)){
      state.timer.sc = 0;
      var cand = [];
      for (i = 0; i < state.tiles.length; i++){
        var tt = state.tiles[i];
        if (tt && tt.crop >= 0 && tt.growth >= growTimeOf(tt.crop)) cand.push(i);
      }
      if (cand.length){ harvest(cand[Math.floor(Math.random() * cand.length)], true); audio.sfx('coin'); }
    }
  }
  if (state.fac[3] > 0){
    state.timer.hive += dt;
    if (state.timer.hive >= num(FAC[3].vals[state.fac[3] - 1], 12)){
      state.timer.hive = 0;
      var any = false;
      for (i = 0; i < state.tiles.length; i++){
        if (state.tiles[i] && state.tiles[i].pest){ state.tiles[i].pest = false; any = true; }
      }
      if (any){ showToast('蜂箱驱除了全部害虫', C.gold); audio.sfx('pest'); }
    }
  }
  if (state.fac[4] > 0){
    state.timer.pond += dt;
    if (state.timer.pond >= num(FAC[4].ivals[state.fac[4] - 1], 6)){
      state.timer.pond = 0;
      var amt = num(FAC[4].vals[state.fac[4] - 1], 6);
      state.coins += amt; state.total += amt;
      audio.sfx('coin');
    }
  }
  if (input.hold >= 0){
    input.hold += dt;
    if (input.hold > 0.34){
      input.hold = 0.18;
      var ti = screenToTile(input.x, input.y);
      if (ti >= 0 && state.tiles[ti] && state.tiles[ti].crop < 0) plant(ti, true);
    }
  }
  state.saveT += dt;
  if (state.saveT > 8){ state.saveT = 0; saveGame(); }
  updateEffects(dt);
}

/* =========================================================================
   模块 12 / 输入
   ========================================================================= */
var input = { x: 0, y: 0, down: false, hold: -1 };
function ptFromEvent(e){
  var r = canvas.getBoundingClientRect();
  return { x: num(e.clientX, 0) - num(r.left), y: num(e.clientY, 0) - num(r.top) };
}
function pick(x, y){
  x = num(x) - shakeCur.x; y = num(y) - shakeCur.y;
  for (var i = lay.hits.length - 1; i >= 0; i--){
    var h = lay.hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}
function onDown(e){
  audio.unlock();
  var p = ptFromEvent(e);
  input.x = p.x; input.y = p.y; input.down = true; input.hold = -1;
  var h = pick(p.x, p.y);
  if (state.modal){
    if (h && h.id === 'modal:ok'){
      state.coins += num(state.modal.coins, 0);
      state.total += num(state.modal.coins, 0);
      state.modal = null;
      audio.sfx('harvest');
      flashA = 0.24; flashCol = C.gold;
      saveGame();
    } else if (h && h.id === 'modal:cancel'){ state.modal = null; audio.sfx('click'); }
    else if (h && h.id === 'modal:reset'){ state.modal = null; resetGame(); showToast('已重新开始', C.lime); audio.sfx('level'); }
    return;
  }
  if (!h){
    var ti = screenToTile(p.x, p.y);
    if (ti >= 0){
      tileClick(ti);
      if (state.tiles[ti] && state.tiles[ti].crop < 0) input.hold = 0;
    }
    return;
  }
  var id = String(h.id);
  if (id.indexOf('tile') === 0){ tileClick(h.data); return; }
  if (id.indexOf('tab:') === 0){ state.cat = clamp(h.data, 0, 3); audio.sfx('click'); saveGame(); return; }
  if (id.indexOf('crop:') === 0){
    var ci = clamp(h.data, 0, CROPS.length - 1);
    if (!isUnlocked(ci)){
      showToast('未解锁：累计金币达到 ' + fmtNum(CROPS[ci].unlock) + ' 后开放', C.gold);
      audio.sfx('error');
    } else {
      state.sel = ci; state.cat = CROPS[ci].cat;
      showToast('已选择 ' + CROPS[ci].name, CATS[CROPS[ci].cat].color);
      audio.sfx('click'); saveGame();
    }
    return;
  }
  if (id.indexOf('fac:') === 0){ upgradeFacility(h.data); return; }
  if (id === 'btn:0'){
    audio.on = !audio.on;
    if (audio.on){ audio.unlock(); audio.sfx('click'); }
    showToast('声音已' + (audio.on ? '开启' : '关闭'), C.cyan);
    saveGame();
    return;
  }
  if (id === 'btn:1'){
    state.paused = !state.paused;
    audio.sfx('click');
    showToast(state.paused ? '游戏已暂停' : '游戏继续', C.lime);
    return;
  }
  if (id === 'btn:2'){
    if (state.confirmReset > 0){ state.modal = { type: 'reset' }; state.confirmReset = 0; }
    else { state.confirmReset = 4; showToast('再次点击「重开」以确认', C.danger); audio.sfx('click'); }
    return;
  }
  if (id === 'btn:expand' || id === 'btn:expand2'){ expandFarm(); return; }
}
function onMove(e){
  var p = ptFromEvent(e);
  input.x = p.x; input.y = p.y;
  var h = pick(p.x, p.y);
  hoverId = h ? h.id : null;
  hoverTile = (!h && !state.modal) ? screenToTile(p.x, p.y) : -1;
}
function onUp(){ input.down = false; input.hold = -1; }
canvas.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, { passive: true });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('blur', onUp);
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveGame(); });
window.addEventListener('pagehide', function(){ saveGame(); });

/* =========================================================================
   模块 13 / 主循环
   ========================================================================= */
var last = 0;
function frame(now){
  now = num(now, performance.now());
  var dt = (now - last) / 1000;
  last = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = clamp(dt, 0, 0.1);
  T += dt;
  try{
    update(dt);
    render();
  } catch (err){
    if (window.console && console.warn) console.warn('frame error', err);
  }
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  state.tiles = makeTiles(state.size);
  var info = loadGame();
  if (info && info.ts){
    var elapsed = clamp((Date.now() - info.ts) / 1000, 0, 8 * 3600);
    if (elapsed > 5){
      for (var i = 0; i < state.tiles.length; i++){
        var t = state.tiles[i];
        if (t && t.crop >= 0) t.growth = Math.min(growTimeOf(t.crop), t.growth + elapsed * (t.pest ? 0.25 : 1));
      }
      var gain = offlineRate() * elapsed;
      if (gain >= 1) state.modal = { type: 'offline', coins: Math.round(gain), secs: elapsed };
      else if (elapsed > 30) showToast('欢迎回来 · 离线 ' + fmtTime(elapsed), C.cyan);
    }
  } else if (!info){
    showToast('选择作物，点击空地开始播种', C.cyan);
  }
  computeGeom();
  requestAnimationFrame(function(n){ last = n; frame(n); });
}
boot();
</script>
