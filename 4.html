<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>方块农场 Block Farm</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#07090f;overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

/* =========================================================
   0. 基础工具
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const rnd   = (a,b)=>a+Math.random()*(b-a);
const ri    = (a,b)=>Math.floor(rnd(a,b+1));
const pick  = (arr)=>arr[Math.floor(Math.random()*arr.length)];

const CO = {
  bg:'#07090f', surf:'#12141c', surf2:'#1a2130', edge:'#233047', edge2:'#2c3542',
  ink:'#eaf6e4', dim:'#7f9a8c', gold:'#ffd23f', green:'#35e06b', lime:'#b8ff34',
  cyan:'#43d9ff', violet:'#c56bff', red:'#ff5d5d', brown:'#7a4d2b'
};

/* =========================================================
   1. 配置表（数值驱动）
   ========================================================= */
const CROPS = [
  { id:'radish',     name:'萝卜',     cost:5,   grow:6,  sell:12,  unlock:0,    body:'#ff8fb1', leaf:'#35e06b', glow:'rgba(255,143,177,.75)' },
  { id:'pumpkin',    name:'南瓜',     cost:18,  grow:16, sell:42,  unlock:120,  body:'#ff9f43', leaf:'#35e06b', glow:'rgba(255,159,67,.75)' },
  { id:'strawberry', name:'草莓',     cost:45,  grow:32, sell:110, unlock:500,  body:'#ff4d6d', leaf:'#35e06b', glow:'rgba(255,77,109,.8)'  },
  { id:'melon',      name:'金色西瓜', cost:120, grow:65, sell:320, unlock:1500, body:'#c9e86a', leaf:'#35e06b', glow:'rgba(255,210,63,.9)'  }
];

const HELPERS = {
  sprinkler:{ name:'洒水器', desc:'加速所有作物生长',
    costs:[80,260,720], mult:[1,1.35,1.8,2.5],
    effect:(l)=>'生长速度 ×'+[1,1.35,1.8,2.5][l].toFixed(2) },
  scarecrow:{ name:'稻草人', desc:'自动收获成熟作物',
    costs:[150,450,1100], interval:[0,4.5,3.0,1.8],
    effect:(l)=> l===0 ? '尚未雇佣' : '每 '+HELPERS.scarecrow.interval[l].toFixed(1)+' 秒自动收获' }
};

const EXPAND_COST = [350, 900];   // 4→5, 5→6
const OFFLINE_CAP = 8*3600;       // 8 小时

/* =========================================================
   2. 游戏状态 + 持久化
   ========================================================= */
const KEY = 'blockfarm_v1';

function makePlot(){ return { crop:null, progress:0, stage:0, pest:false, phase:Math.random()*6.283 }; }
function defaults(){
  const plots = [];
  for(let i=0;i<36;i++) plots.push(makePlot());
  return {
    coins:0, total:0, level:1, xp:0,
    gridN:4, cropSel:0,
    sprinkler:0, scarecrow:0,
    plots, harvests:0, best:0,
    muted:false, lastTs:Date.now()
  };
}
const S = defaults();

function save(){
  S.lastTs = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.plots || !d.plots.length) return false;
    Object.assign(S, defaults(), d);
    for(let i=0;i<36;i++){
      const p = S.plots[i] || makePlot();
      if(p.crop!==null && (p.crop<0 || p.crop>=CROPS.length)) p.crop = null;
      p.phase = p.phase || Math.random()*6.283;
      S.plots[i] = p;
    }
    S.gridN = clamp(S.gridN|0, 4, 6);
    return true;
  }catch(e){ return false; }
}

function offlineResult(){
  const now = Date.now();
  let secs = (now - (S.lastTs||now))/1000;
  if(!(secs > 20)) return null;
  const capped = Math.min(secs, OFFLINE_CAP);
  const rate = (0.25 + S.scarecrow*0.55) * HELPERS.sprinkler.mult[S.sprinkler] * (1 + Math.min(2, S.total/8000));
  const gain = Math.min(Math.floor(capped*rate), 2200 + Math.floor(S.total*0.4));
  if(gain <= 0) return null;
  return { secs:capped, gain };
}

/* =========================================================
   3. 音频（Web Audio 合成）
   ========================================================= */
let AC = null, MASTER = null;
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.22;
    MASTER.connect(AC.destination);
  }catch(e){ AC = null; }
}
function tone(freq, dur, type, vol, slideTo, delay){
  if(!AC || S.muted) return;
  const t = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.28, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(MASTER);
  o.start(t); o.stop(t+dur+0.03);
}
const sfx = {
  click(){ tone(520,0.05,'square',0.18); },
  plant(){ tone(300,0.09,'triangle',0.22,520); tone(660,0.06,'square',0.12,null,0.05); },
  harvest(){ tone(420,0.08,'square',0.22,760); tone(880,0.10,'triangle',0.18,1180,0.06); },
  coin(){ tone(880,0.05,'square',0.16); tone(1320,0.06,'square',0.12,null,0.045); },
  error(){ tone(190,0.14,'sawtooth',0.18,110); },
  level(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'square',0.2,null,i*0.085)); },
  upgrade(){ tone(360,0.12,'triangle',0.22,720); tone(720,0.12,'square',0.14,1080,0.09); },
  event(){ tone(220,0.32,'sawtooth',0.12,520); },
  pest(){ tone(680,0.07,'square',0.18,320); }
};

/* =========================================================
   4. 特效系统
   ========================================================= */
let parts = [], floats = [], rings = [], toasts = [];
let shakeMag = 0, shakeX = 0, shakeY = 0, flashA = 0, flashCol = CO.green;

function shake(m){ shakeMag = Math.min(22, shakeMag + m); }
function flash(col, a){ flashCol = col||CO.green; flashA = Math.max(flashA, a||0.22); }
function toast(text, color){
  toasts.push({ text, color:color||CO.ink, t:0, life:2.6 });
  if(toasts.length>5) toasts.shift();
}
function floatText(x,y,text,color,size){
  floats.push({ x, y, text, color:color||CO.gold, t:0, life:1.15, size:size||18, vy:-42 });
}
function ringFx(x,y,color,max){
  rings.push({ x, y, t:0, life:0.55, color:color||CO.lime, max:max||70 });
}
function coinBurst(x,y,count,targetX,targetY){
  for(let i=0;i<count;i++){
    const a = rnd(-Math.PI*0.85, -Math.PI*0.15);
    const sp = rnd(180,420);
    parts.push({
      type:'coin', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rnd(0.8,1.25), max:1.25, r:rnd(3.2,6.4),
      ground:y+rnd(30,90), tx:targetX, ty:targetY, phase2:0
    });
  }
  for(let i=0;i<8;i++){
    parts.push({
      type:'spark', x, y, vx:rnd(-190,190), vy:rnd(-220,60),
      life:rnd(0.35,0.7), max:0.7, r:rnd(1.6,3.4), color:pick([CO.gold,CO.lime,CO.green])
    });
  }
}
function updateFx(dt){
  shakeMag *= Math.pow(0.0016, dt);
  if(shakeMag<0.25) shakeMag = 0;
  shakeX = rnd(-1,1)*shakeMag;
  shakeY = rnd(-1,1)*shakeMag;
  flashA = Math.max(0, flashA - dt*1.5);

  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.type==='coin'){
      if(p.phase2===0){
        p.vy += 980*dt;
        p.x += p.vx*dt; p.y += p.vy*dt;
        if(p.y > p.ground){ p.y = p.ground; p.vy *= -0.38; p.vx *= 0.72; }
        if(p.life < 0.55){ p.phase2 = 1; }
      }else{
        const k = 1-Math.pow(0.0008, dt);
        p.x = lerp(p.x, p.tx, k); p.y = lerp(p.y, p.ty, k);
        p.vx *= 0.9; p.vy *= 0.9;
      }
    }else{
      p.vy += (p.g||520)*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
    }
  }
  if(parts.length>320) parts.splice(0, parts.length-320);

  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i]; r.t += dt;
    if(r.t>=r.life) rings.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.t += dt;
    if(f.t>=f.life) floats.splice(i,1);
  }
  for(let i=toasts.length-1;i>=0;i--){
    const t = toasts[i]; t.t += dt;
    if(t.t>=t.life) toasts.splice(i,1);
  }
}

/* =========================================================
   5. 布局
   ========================================================= */
const L = {};
function layout(){
  const mobile = (W < 900) || (H > W*1.05);
  L.mobile = mobile;
  if(!mobile){
    L.topH = 92;
    L.botH = 56;
    L.railW = clamp(W*0.19, 216, 292);
    const availH = H - L.topH - L.botH - 28;
    const availW = W - 2*(L.railW + 26);
    const side = Math.floor(Math.min(availW, availH));
    L.side = side;
    L.cell = side/6;
    L.gx = Math.floor((W - side)/2);
    L.gy = Math.floor(L.topH + 16 + (availH - side)/2);
    L.leftX = 18; L.rightX = W - L.railW - 18;
    L.railY = L.topH + 12;
    L.railH = H - L.topH - L.botH - 26;
  }else{
    L.topH = 96;
    L.botH = clamp(H*0.36, 236, 320);
    const availH = H - L.topH - L.botH - 10;
    const side = Math.floor(Math.min(W - 20, availH));
    L.side = side;
    L.cell = side/6;
    L.gx = Math.floor((W - side)/2);
    L.gy = Math.floor(L.topH + 6);
    L.leftX = 10; L.rightX = 10;
    L.railY = L.gy + side + 10;
    L.railH = H - L.railY - 8;
  }
}

function buildScan(){
  const c = document.createElement('canvas');
  c.width = 1; c.height = 3;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.30)';
  g.fillRect(0,2,1,1);
  scanPat = ctx.createPattern(c,'repeat');

  vignette = ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.18, W/2,H*0.5,Math.max(W,H)*0.78);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(0,0,0,0.55)');
}
let scanPat = null, vignette = null;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); buildScan();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));

/* =========================================================
   6. 绘图辅助
   ========================================================= */
function txt(str,x,y,size,color,align,shadow,outline){
  ctx.font = 'bold '+size+'px "Courier New","Microsoft YaHei",monospace';
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'middle';
  if(shadow!==false){
    ctx.lineWidth = Math.max(2, size*0.17);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = outline||'#05070c';
    ctx.strokeText(str,x,y);
  }
  ctx.fillStyle = color||CO.ink;
  ctx.fillText(str,x,y);
}
function fitSize(str, boxW, boxH, maxSize){
  const n = Math.max(1, String(str).length);
  return clamp(Math.min(maxSize||20, boxH*0.42, boxW/(n*0.92)), 10, maxSize||20);
}
function chamfer(x,y,w,h,c){
  c = c||8;
  ctx.beginPath();
  ctx.moveTo(x+c,y);
  ctx.lineTo(x+w-c,y); ctx.lineTo(x+w,y+c);
  ctx.lineTo(x+w,y+h-c); ctx.lineTo(x+w-c,y+h);
  ctx.lineTo(x+c,y+h); ctx.lineTo(x,y+h-c);
  ctx.lineTo(x,y+c);
  ctx.closePath();
}
function panel(x,y,w,h,opt){
  opt = opt||{};
  ctx.save();
  chamfer(x,y,w,h,opt.c||10);
  ctx.fillStyle = opt.fill||'rgba(18,20,28,0.92)';
  ctx.fill();
  ctx.lineWidth = opt.lw||2;
  ctx.strokeStyle = opt.stroke||CO.edge;
  ctx.stroke();
  if(opt.inner){
    chamfer(x+4,y+4,w-8,h-8,Math.max(2,(opt.c||10)-3));
    ctx.lineWidth = 1;
    ctx.strokeStyle = opt.inner;
    ctx.stroke();
  }
  ctx.restore();
}
function button(x,y,w,h,label,id,opt){
  opt = opt||{};
  const active = opt.active;
  const disabled = opt.disabled;
  const hover = pointer.x>=x && pointer.x<=x+w && pointer.y>=y && pointer.y<=y+h;
  ctx.save();
  chamfer(x,y,w,h,7);
  ctx.fillStyle = disabled ? 'rgba(28,34,44,0.75)'
    : active ? (opt.fill||'rgba(53,224,107,0.20)')
    : hover ? 'rgba(45,58,74,0.95)' : 'rgba(26,33,48,0.95)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = disabled ? '#242c3a'
    : active ? (opt.stroke||CO.lime) : (opt.stroke||CO.edge2);
  ctx.stroke();
  ctx.restore();
  const size = fitSize(label, w-14, h, opt.size||17);
  txt(label, x+w/2, y+h/2+1, size, disabled ? CO.dim : (opt.color||(active?CO.lime:CO.ink)), 'center');
  if(id) uiRects.push({x,y,w,h,id});
}

/* =========================================================
   7. 作物绘制（矢量贴纸）
   ========================================================= */
function drawCropIcon(id, stage, cx, cy, s, t, phase){
  const bob = (stage===3) ? Math.sin(t*2.2 + phase)*s*0.055 : 0;
  const sc = [0.26,0.54,0.8,1][clamp(stage,0,3)];
  const r = s*sc;
  cy += bob;

  // 地面阴影
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + s*0.44, r*0.62, r*0.15, 0, 0, Math.PI*2);
  ctx.fill();

  if(stage===0){
    ctx.fillStyle = '#8a6b42';
    for(let i=0;i<3;i++){
      const a = i*2.1 + phase;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a)*r*0.7, cy + s*0.26 + Math.sin(a)*r*0.3, r*0.2, r*0.13, a, 0, Math.PI*2);
      ctx.fill();
    }
    return;
  }
  if(stage===1){
    ctx.strokeStyle = CO.green;
    ctx.lineWidth = Math.max(2, r*0.2);
    ctx.beginPath(); ctx.moveTo(cx, cy+s*0.36); ctx.lineTo(cx, cy-s*0.12); ctx.stroke();
    ctx.fillStyle = CO.lime;
    ctx.beginPath(); ctx.ellipse(cx-r*0.46, cy-s*0.08, r*0.46, r*0.22, -0.55, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.46, cy-s*0.08, r*0.46, r*0.22, 0.55, 0, Math.PI*2); ctx.fill();
    return;
  }

  const crop = CROPS[id];
  const ripe = (stage===3);
  ctx.save();
  if(ripe){
    ctx.shadowColor = crop.glow;
    ctx.shadowBlur = 16;
  }

  if(id===0){ // 萝卜
    ctx.fillStyle = crop.leaf;
    for(const d of [-0.34,0,0.34]){
      ctx.beginPath();
      ctx.ellipse(cx + d*r*1.15, cy - r*0.78, r*0.32, r*0.16, d*1.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = crop.body;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.6, cy-r*0.5); ctx.lineTo(cx+r*0.6, cy-r*0.5);
    ctx.lineTo(cx, cy+r*0.9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd6e2';
    ctx.fillRect(cx-r*0.46, cy-r*0.42, r*0.92, r*0.16);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(cx-r*0.34, cy-r*0.2, r*0.2, r*0.42);
  }else if(id===1){ // 南瓜
    ctx.fillStyle = crop.body;
    ctx.beginPath(); ctx.ellipse(cx, cy+r*0.05, r*0.88, r*0.72, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e07b2c';
    ctx.beginPath(); ctx.ellipse(cx-r*0.3, cy+r*0.05, r*0.16, r*0.66, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.3, cy+r*0.05, r*0.16, r*0.66, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = CO.brown;
    ctx.fillRect(cx-r*0.12, cy-r*0.86, r*0.24, r*0.28);
    ctx.fillStyle = crop.leaf;
    ctx.beginPath(); ctx.ellipse(cx+r*0.28, cy-r*0.78, r*0.24, r*0.12, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.42, cy-r*0.22, r*0.14, r*0.26, -0.4, 0, Math.PI*2); ctx.fill();
  }else if(id===2){ // 草莓
    ctx.fillStyle = crop.body;
    ctx.beginPath();
    ctx.moveTo(cx, cy+r*0.92);
    ctx.bezierCurveTo(cx-r*0.86, cy+r*0.34, cx-r*0.76, cy-r*0.72, cx, cy-r*0.58);
    ctx.bezierCurveTo(cx+r*0.76, cy-r*0.72, cx+r*0.86, cy+r*0.34, cx, cy+r*0.92);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = crop.leaf;
    for(const d of [-0.42,0,0.42]){
      ctx.beginPath();
      ctx.ellipse(cx+d*r*1.05, cy-r*0.72, r*0.34, r*0.16, d*1.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffe07a';
    for(let i=0;i<6;i++){
      const a = i*1.05 + phase;
      ctx.beginPath();
      ctx.ellipse(cx+Math.cos(a)*r*0.42, cy+Math.sin(a)*r*0.36+r*0.1, r*0.09, r*0.06, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.3, cy-r*0.16, r*0.13, r*0.22, -0.5, 0, Math.PI*2); ctx.fill();
  }else{ // 金色西瓜
    const g = ctx.createRadialGradient(cx-r*0.3, cy-r*0.34, r*0.1, cx, cy, r*1.05);
    g.addColorStop(0, '#eaffa0');
    g.addColorStop(0.55, crop.body);
    g.addColorStop(1, '#7fbf3c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy+r*0.04, r*0.86, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(46,92,28,0.75)';
    ctx.lineWidth = Math.max(1.6, r*0.1);
    for(const d of [-0.52,-0.18,0.18,0.52]){
      ctx.beginPath();
      ctx.ellipse(cx + d*r*1.1, cy+r*0.04, r*0.12, r*0.78, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.36, cy-r*0.36, r*0.18, r*0.28, -0.6, 0, Math.PI*2); ctx.fill();
    if(ripe){
      ctx.fillStyle = CO.gold;
      star(cx + r*0.62, cy - r*0.66, r*0.2, r*0.09, 5);
    }
  }
  ctx.restore();
}
function star(cx,cy,r1,r2,pts){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const a = -Math.PI/2 + i*Math.PI/pts;
    const rr = (i%2===0)? r1 : r2;
    ctx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill();
}

function drawPest(cx,cy,s,t){
  const wob = Math.sin(t*7 + cx*0.1)*s*0.06;
  ctx.save();
  ctx.translate(cx, cy+wob);
  ctx.fillStyle = '#2a1220';
  ctx.beginPath(); ctx.ellipse(0,0,s*0.3,s*0.22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = CO.red;
  ctx.beginPath(); ctx.ellipse(0,-s*0.04,s*0.22,s*0.16,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = CO.red; ctx.lineWidth = Math.max(1.4,s*0.06);
  for(let i=-1;i<=1;i+=2){
    ctx.beginPath(); ctx.moveTo(i*s*0.26,-s*0.06); ctx.lineTo(i*s*0.46,-s*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i*s*0.2,s*0.1); ctx.lineTo(i*s*0.42,s*0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.1+i*s*0.16,-s*0.2); ctx.lineTo(-s*0.16+i*s*0.3,-s*0.42); ctx.stroke();
  }
  ctx.fillStyle = CO.gold;
  ctx.beginPath(); ctx.arc(-s*0.08,-s*0.1,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.08,-s*0.1,s*0.05,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* =========================================================
   8. 游戏逻辑
   ========================================================= */
function cropUnlocked(i){ return S.total >= CROPS[i].unlock; }
function isLocked(r,c){ return r >= S.gridN || c >= S.gridN; }
function plotAt(px,py){
  const c = Math.floor((px - L.gx)/L.cell);
  const r = Math.floor((py - L.gy)/L.cell);
  if(r<0||c<0||r>5||c>5) return null;
  return r*6+c;
}
function cellCenter(idx){
  const r = Math.floor(idx/6), c = idx%6;
  return { x: L.gx + c*L.cell + L.cell/2, y: L.gy + r*L.cell + L.cell/2 };
}

function plant(idx){
  const p = S.plots[idx];
  const crop = CROPS[S.cropSel];
  if(!cropUnlocked(S.cropSel)){
    toast('未解锁：累计 '+crop.unlock+' 金币', CO.red); sfx.error(); return;
  }
  if(S.coins < crop.cost){
    toast('金币不足，需要 '+crop.cost+' 金币', CO.red); sfx.error(); return;
  }
  S.coins -= crop.cost;
  p.crop = S.cropSel; p.progress = 0; p.stage = 0; p.pest = false;
  const c = cellCenter(idx);
  ringFx(c.x, c.y, CO.cyan, L.cell*0.8);
  floatText(c.x, c.y - L.cell*0.3, '播种 '+crop.name, CO.cyan, 15);
  sfx.plant(); shake(2.2); save();
}

function harvest(idx, auto){
  const p = S.plots[idx];
  if(p.crop===null || p.stage<3) return false;
  const crop = CROPS[p.crop];
  let amount = crop.sell * (1 + (S.level-1)*0.03);
  if(p.pest){ amount *= 0.5; p.pest = false; toast('害虫啃食，减产了', CO.red); }
  amount = Math.max(1, Math.round(amount));

  S.coins += amount;
  S.total += amount;
  S.harvests++;
  if(S.total > S.best) S.best = S.total;
  gainXp(Math.round(crop.sell*0.7));

  const c = cellCenter(idx);
  coinBurst(c.x, c.y - L.cell*0.15, auto?8:ri(13,18), L.mobile ? W*0.5 : L.leftX + 96, L.mobile ? 42 : L.railY + 58);
  floatText(c.x, c.y - L.cell*0.42, (auto?'自动 ':'')+'+'+amount, CO.gold, auto?16:20);
  ringFx(c.x, c.y, CO.gold, L.cell*1.1);
  if(!auto){ sfx.harvest(); shake(4.5); flash(CO.gold, 0.12); }
  else { sfx.coin(); }

  p.crop = null; p.progress = 0; p.stage = 0;
  save();
  return true;
}

function xpNeed(l){ return Math.round(60 * Math.pow(1.42, l-1)); }
function gainXp(n){
  S.xp += n;
  let ups = 0;
  while(S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level);
    S.level++;
    ups++;
  }
  if(ups>0){
    const bonus = 24 * S.level;
    S.coins += bonus; S.total += bonus;
    if(S.total > S.best) S.best = S.total;
    toast('升级！达到 '+S.level+' 级，奖励 '+bonus+' 金币', CO.lime);
    floatText(W/2, H*0.32, 'LEVEL UP', CO.lime, 30);
    sfx.level(); shake(8); flash(CO.green, 0.28);
    checkUnlocks();
    save();
  }
}
function checkUnlocks(){
  CROPS.forEach((c,i)=>{
    if(S.total >= c.unlock && S.total - 0 < c.unlock + 1) return;
  });
  for(let i=0;i<CROPS.length;i++){
    const c = CROPS[i];
    if(S.total >= c.unlock && !S['_u'+i]){
      S['_u'+i] = 1;
      if(c.unlock>0) toast('新作物解锁：'+c.name+'!', CO.violet);
    }
    if(S.total < c.unlock) S['_u'+i] = 0;
  }
}

function clearPest(idx){
  const p = S.plots[idx];
  if(!p.pest) return false;
  p.pest = false;
  const c = cellCenter(idx);
  for(let i=0;i<12;i++){
    parts.push({
      type:'spark', x:c.x, y:c.y, vx:rnd(-200,200), vy:rnd(-260,-40),
      life:rnd(0.3,0.6), max:0.6, r:rnd(1.8,3.6), color:CO.red
    });
  }
  floatText(c.x, c.y - L.cell*0.4, '清除害虫!', CO.green, 16);
  ringFx(c.x, c.y, CO.green, L.cell*0.9);
  sfx.pest(); shake(3);
  return true;
}

function interact(idx){
  const r = Math.floor(idx/6), c = idx%6;
  if(isLocked(r,c)){
    if(S.gridN>=6){ toast('农田已全部解锁', CO.dim); return; }
    const cost = EXPAND_COST[S.gridN-4];
    if(S.coins >= cost){
      S.coins -= cost; S.gridN++;
      toast('农田扩展到 '+S.gridN+'×'+S.gridN+'!', CO.lime);
      sfx.upgrade(); shake(9); flash(CO.green,0.22); save();
    }else{
      toast('扩展需要 '+cost+' 金币', CO.red); sfx.error();
    }
    return;
  }
  const p = S.plots[idx];
  if(p.pest){ clearPest(idx); return; }
  if(p.crop===null){ plant(idx); return; }
  if(p.stage>=3){ harvest(idx,false); return; }
  const pct = Math.round(p.progress*100);
  floatText(cellCenter(idx).x, cellCenter(idx).y - L.cell*0.35, '生长中 '+pct+'%', CO.cyan, 13);
  sfx.click();
}

function buyHelper(key){
  const H0 = HELPERS[key];
  const lvl = S[key];
  if(lvl >= 3){ toast(H0.name+' 已满级', CO.dim); return; }
  const cost = H0.costs[lvl];
  if(S.coins < cost){ toast('金币不足，需要 '+cost, CO.red); sfx.error(); return; }
  S.coins -= cost;
  S[key] = lvl+1;
  toast(H0.name+' 升到 '+S[key]+' 级!', CO.cyan);
  sfx.upgrade(); shake(5); flash(CO.cyan,0.18); save();
}

/* =========================================================
   9. 随机事件
   ========================================================= */
const EV = {
  cloudT: rnd(38,58),
  cloudActive: 0,
  pestT: rnd(26,44),
  scareT: 0
};
function updateEvents(dt){
  if(EV.cloudActive > 0){
    EV.cloudActive -= dt;
    if(EV.cloudActive <= 0){ toast('乌云散去', CO.dim); }
  }else{
    EV.cloudT -= dt;
    if(EV.cloudT <= 0){
      EV.cloudT = rnd(45,72);
      EV.cloudActive = 18;
      toast('乌云飘来！生长速度提升', CO.cyan);
      sfx.event();
    }
  }
  EV.pestT -= dt;
  if(EV.pestT <= 0){
    EV.pestT = rnd(34,58);
    const candidates = [];
    for(let i=0;i<36;i++){
      const r = Math.floor(i/6), c = i%6;
      if(isLocked(r,c)) continue;
      const p = S.plots[i];
      if(p.crop!==null && p.stage<3 && !p.pest) candidates.push(i);
    }
    if(candidates.length){
      const idx = pick(candidates);
      S.plots[idx].pest = true;
      toast('害虫出现！点击清除', CO.red);
      sfx.pest(); shake(2.5);
    }
  }
  if(S.scarecrow > 0){
    EV.scareT -= dt;
    if(EV.scareT <= 0){
      EV.scareT = HELPERS.scarecrow.interval[S.scarecrow];
      const ripe = [];
      for(let i=0;i<36;i++){
        const r = Math.floor(i/6), c = i%6;
        if(isLocked(r,c)) continue;
        if(S.plots[i].crop!==null && S.plots[i].stage>=3) ripe.push(i);
      }
      if(ripe.length) harvest(pick(ripe), true);
    }
  }
}

   10. 渲染
   ========================================================= */
let uiRects = [];
const pointer = { x:-999, y:-999, down:false, sx:0, sy:0, drag:false, swipeX:0, swipeY:0 };

function render(){
  uiRects = [];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  // 背景
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#080b12');
  bg.addColorStop(0.55,'#07090f');
  bg.addColorStop(1,'#05070c');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  drawBackgroundGrid();

  if(S.screen==='boot'){ drawBoot(); drawOverlayFx(); return; }
  if(S.screen==='title'){ drawTitle(); drawOverlayFx(); return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);
  drawStage();
  drawParticles();
  drawFloats();
  ctx.restore();

  if(L.mobile) drawMobileHUD(); else drawDesktopHUD();

  drawToasts();
  if(modal==='offline') drawOfflineModal();
  if(modal==='pause') drawPauseModal();
  if(modal==='reset') drawResetModal();
  if(modal==='upgrade' && L.mobile) drawUpgradeModal();

  drawOverlayFx();
}

function drawBackgroundGrid(){
  ctx.save();
  ctx.strokeStyle = 'rgba(53,224,107,0.045)';
  ctx.lineWidth = 1;
  const step = 46;
  for(let x=0;x<W;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  const g = ctx.createRadialGradient(W/2, H*0.55, 20, W/2, H*0.55, Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(53,224,107,0.07)');
  g.addColorStop(1,'rgba(53,224,107,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawStage(){
  const side = L.side;
  // 舞台底板
  ctx.save();
  ctx.shadowColor = 'rgba(53,224,107,0.28)';
  ctx.shadowBlur = 32;
  panel(L.gx-16, L.gy-16, side+32, side+32, { fill:'#0c1219', stroke:CO.edge, inner:'rgba(53,224,107,0.16)', c:14 });
  ctx.restore();

  for(let r=0;r<6;r++){
    for(let c=0;c<6;c++){
      const idx = r*6+c;
      const x = L.gx + c*L.cell, y = L.gy + r*L.cell;
      drawTile(x, y, L.cell, idx, r, c);
    }
  }

  // 乌云
  if(EV.cloudActive > 0){
    const a = clamp(Math.min(EV.cloudActive, 18-EV.cloudActive)*0.6, 0, 1);
    ctx.save();
    chamfer(L.gx-16, L.gy-16, side+32, side+32, 14);
    ctx.clip();
    ctx.fillStyle = 'rgba(40,64,110,'+(0.16*a)+')';
    ctx.fillRect(L.gx-16, L.gy-16, side+32, side+32);
    for(let i=0;i<5;i++){
      const cx = L.gx + ((i*137 + S.time*26) % (side+220)) - 110;
      const cy = L.gy + 40 + i*(side/5.4);
      ctx.fillStyle = 'rgba(150,180,215,'+(0.10*a)+')';
      ctx.beginPath();
      ctx.ellipse(cx, cy, L.cell*1.15, L.cell*0.42, 0, 0, Math.PI*2);
      ctx.ellipse(cx-L.cell*0.5, cy+L.cell*0.16, L.cell*0.7, L.cell*0.34, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    txt('乌云 · 生长加速 ×1.8', L.gx + side/2, L.gy - 26, L.mobile?13:15, CO.cyan, 'center');
  }
}

function drawTile(x,y,s,idx,r,c){
  const locked = isLocked(r,c);
  const p = S.plots[idx];
  const pad = Math.max(3, s*0.055);
  const tx = x+pad, ty = y+pad, tw = s-pad*2, th = s-pad*2;

  if(locked){
    ctx.fillStyle = 'rgba(14,18,26,0.85)';
    ctx.fillRect(tx,ty,tw,th);
    ctx.save();
    ctx.beginPath(); ctx.rect(tx,ty,tw,th); ctx.clip();
    ctx.strokeStyle = 'rgba(60,74,96,0.30)';
    ctx.lineWidth = 1;
    const gap = Math.max(7, s*0.14);
    for(let d=-th; d<tw+th; d+=gap){
      ctx.beginPath(); ctx.moveTo(tx+d, ty); ctx.lineTo(tx+d+th, ty+th); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(50,62,82,0.7)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(tx+0.5,ty+0.5,tw-1,th-1);
    // 锁
    const cx = tx+tw/2, cy = ty+th/2;
    ctx.strokeStyle = CO.dim; ctx.lineWidth = Math.max(1.6, s*0.035);
    ctx.beginPath(); ctx.arc(cx, cy - s*0.055, s*0.075, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = CO.dim;
    ctx.fillRect(cx - s*0.1, cy - s*0.055, s*0.2, s*0.15);
    return;
  }

  const worked = p.crop!==null;
  const g = ctx.createLinearGradient(tx,ty,tx,ty+th);
  g.addColorStop(0, worked ? '#1b2631' : '#141b25');
  g.addColorStop(1, worked ? '#111a22' : '#0e141c');
  ctx.fillStyle = g;
  ctx.fillRect(tx,ty,tw,th);

  ctx.strokeStyle = (p.stage>=3) ? 'rgba(255,210,63,0.55)' : 'rgba(35,48,71,0.95)';
  ctx.lineWidth = 2;
  ctx.strokeRect(tx+1,ty+1,tw-2,th-2);

  ctx.strokeStyle = 'rgba(44,53,66,0.75)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(tx+3,ty+th-3); ctx.lineTo(tx+tw-3,ty+th-3); ctx.stroke();

  if(!worked){
    ctx.strokeStyle = 'rgba(60,80,70,0.35)';
    ctx.lineWidth = 1;
    for(let i=1;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(tx + tw*i/4, ty+4);
      ctx.lineTo(tx + tw*i/4, ty+th-4);
      ctx.stroke();
    }
    return;
  }

  // 作物
  drawCropIcon(p.crop, p.stage, tx+tw/2, ty+th*0.52, s*0.42, S.time, p.phase);

  // 生长进度条
  if(p.stage < 3){
    const bw = tw*0.72, bh = Math.max(3, s*0.05);
    const bx = tx + (tw-bw)/2, by = ty + th - s*0.11;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx,by,bw,bh);
    const pg = ctx.createLinearGradient(bx,0,bx+bw,0);
    pg.addColorStop(0, CO.green); pg.addColorStop(1, CO.lime);
    ctx.fillStyle = pg;
    ctx.fillRect(bx,by,bw*clamp(p.progress,0,1),bh);
  }else{
    const bw = tw*0.72, bh = Math.max(3, s*0.05);
    const bx = tx + (tw-bw)/2, by = ty + th - s*0.11;
    ctx.fillStyle = 'rgba(255,210,63,0.22)';
    ctx.fillRect(bx,by,bw,bh);
  }

  if(p.pest) drawPest(tx+tw*0.78, ty+th*0.24, s*0.2, S.time);
}

function drawParticles(){
  for(const p of parts){
    const a = clamp(p.life/p.max, 0, 1);
    if(p.type==='coin'){
      // 拖影
      ctx.fillStyle = 'rgba(255,210,63,'+(a*0.22)+')';
      ctx.beginPath(); ctx.arc(p.x - p.vx*0.012, p.y - p.vy*0.012, p.r*0.9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,210,63,'+a+')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,105,10,'+a+')';
      ctx.lineWidth = Math.max(1, p.r*0.3);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*0.62, 0, Math.PI*2); ctx.stroke();
    }else{
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2);
      ctx.globalAlpha = 1;
    }
  }
  for(const r of rings){
    const k = r.t/r.life;
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = (1-k)*0.65;
    ctx.lineWidth = 3*(1-k)+1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.max*k, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawFloats(){
  for(const f of floats){
    const k = f.t/f.life;
    f.y += f.vy*0.016;
    ctx.globalAlpha = 1-k*k;
    txt(f.text, f.x, f.y, f.size, f.color, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawXpBar(x,y,w,h){
  const need = xpNeed(S.level);
  const k = clamp(S.xp/need,0,1);
  ctx.fillStyle = 'rgba(12,18,24,0.95)';
  chamfer(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle = CO.edge; ctx.lineWidth = 1.5; ctx.stroke();

  const g = ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0, CO.green); g.addColorStop(0.6, CO.lime); g.addColorStop(1, CO.gold);
  chamfer(x+2,y+2,(w-4)*k,h-4,4);
  ctx.fillStyle = g; ctx.fill();

  txt('LV.'+S.level, x+10, y+h/2+1, Math.min(15,h*0.62), CO.ink, 'left');
  txt(S.xp+' / '+need+' EXP', x+w-10, y+h/2+1, Math.min(13,h*0.54), CO.dim, 'right');
}

/* ---------- 作物卡片 ---------- */
function cropCard(i,x,y,w,h){
  const c = CROPS[i];
  const unlocked = cropUnlocked(i);
  const sel = (S.cropSel===i);
  ctx.save();
  chamfer(x,y,w,h,7);
  ctx.fillStyle = sel ? 'rgba(53,224,107,0.14)' : 'rgba(20,26,36,0.92)';
  ctx.fill();
  ctx.lineWidth = sel?2:1.5;
  ctx.strokeStyle = sel ? CO.lime : (unlocked?CO.edge:'#1c2432');
  ctx.stroke();
  ctx.restore();

  const iconS = Math.min(w*0.24, h*0.42);
  drawCropIcon(i, 3, x + w*0.17, y + h*0.5, iconS, S.time, i*1.7);

  const tx = x + w*0.32;
  txt(c.name, tx, y + h*0.28, Math.min(16, h*0.26), unlocked?CO.ink:CO.dim, 'left');

function drawCursor(){
  const r = Math.floor(selIdx/6), c = selIdx%6;
  if(isLocked(r,c)) return;
  const x = L.gx + c*L.cell, y = L.gy + r*L.cell;
  const t = S.time;
  const pulse = 0.55 + Math.sin(t*6)*0.35;
  ctx.save();
  ctx.strokeStyle = 'rgba(184,255,52,'+pulse+')';
  ctx.lineWidth = 3;
  const m = 2, len = L.cell*0.26;
  const x1=x+m, y1=y+m, x2=x+L.cell-m, y2=y+L.cell-m;
  ctx.beginPath();
  ctx.moveTo(x1,y1+len); ctx.lineTo(x1,y1); ctx.lineTo(x1+len,y1);
  ctx.moveTo(x2-len,y1); ctx.lineTo(x2,y1); ctx.lineTo(x2,y1+len);
  ctx.moveTo(x1,y2-len); ctx.lineTo(x1,y2); ctx.lineTo(x1+len,y2);
  ctx.moveTo(x2-len,y2); ctx.lineTo(x2,y2); ctx.lineTo(x2,y2-len);
  ctx.stroke();
  ctx.restore();
}

let selIdx = 7;
function clampSel(){
  const r = clamp(Math.floor(selIdx/6), 0, S.gridN-1);
  const c = clamp(selIdx%6, 0, S.gridN-1);
  selIdx = r*6+c;
}
function ptFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function hitUI(x,y){
  for(let i=uiRects.length-1;i>=0;i--){
    const r = uiRects[i];
    if(x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h) return r.id;
  }
  return null;
}
function doAction(id){
  if(!id) return false;
  if(id==='start'){ startGame(); return true; }
  if(id.startsWith('crop')){ S.cropSel = parseInt(id.slice(4),10); sfx.click(); save(); return true; }
  if(id==='buy_sprinkler'){ buyHelper('sprinkler'); return true; }
  if(id==='buy_scarecrow'){ buyHelper('scarecrow'); return true; }
  if(id==='expand'){ interact(-1); return true; }
  if(id==='mute'){ S.muted = !S.muted; if(!S.muted) sfx.click(); save(); return true; }
  if(id==='pause'){ if(S.screen==='playing'){ modal = (modal==='pause')?null:'pause'; sfx.click(); } return true; }
  if(id==='resume'){ modal = null; sfx.click(); return true; }
  if(id==='reset'){ modal = 'reset'; sfx.click(); return true; }
  if(id==='cancelReset'){ modal = null; sfx.click(); return true; }
  if(id==='confirmReset'){ resetGame(); return true; }
  if(id==='upgrade'){ modal = 'upgrade'; sfx.click(); return true; }
  if(id==='closeUpgrade'){ modal = null; sfx.click(); return true; }
  if(id==='claimOffline'){
    if(offline){ S.coins += offline.gain; S.total += offline.gain; if(S.total>S.best) S.best=S.total;
      coinBurst(W/2, H*0.5, 22, W*0.86, 60); toast('离线收益已到账', CO.gold); sfx.level(); }
    offline = null; modal = null; save(); return true;
  }
  if(id==='act'){ interact(selIdx); return true; }
  return false;
}

canvas.addEventListener('pointerdown', e=>{
  initAudio();
  const p = ptFromEvent(e);
  pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  pointer.sx = p.x; pointer.sy = p.y; pointer.drag = false;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
});
canvas.addEventListener('pointermove', e=>{
  const p = ptFromEvent(e);
  pointer.x = p.x; pointer.y = p.y;
  if(pointer.down){
    const dx = p.x - pointer.sx, dy = p.y - pointer.sy;
    if(Math.abs(dx) > 22 || Math.abs(dy) > 22){
      pointer.drag = true;
      if(S.screen==='playing' && !modal && p.x < W*0.55){
        const r = Math.floor(selIdx/6), c = selIdx%6;
        if(Math.abs(dx) > Math.abs(dy)) selIdx = r*6 + clamp(c + (dx>0?1:-1), 0, S.gridN-1);
        else selIdx = clamp(r + (dy>0?1:-1), 0, S.gridN-1)*6 + c;
        clampSel();
        sfx.click();
        pointer.sx = p.x; pointer.sy = p.y;
      }else{
        pointer.sx = p.x; pointer.sy = p.y;
      }
    }
  }
});
canvas.addEventListener('pointerup', e=>{
  const p = ptFromEvent(e);
  pointer.down = false;
  handleTap(p.x, p.y);
});
canvas.addEventListener('pointercancel', ()=>{ pointer.down = false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

function handleTap(x,y){
  initAudio();
  const id = hitUI(x,y);
  if(doAction(id)) return;

  if(S.screen==='boot') return;
  if(S.screen==='title'){ startGame(); return; }
  if(modal) return;

  const idx = plotAt(x,y);
  if(idx!==null){
    selIdx = idx;
    interact(idx);
    return;
  }
  // 左半屏点击：移动光标
  if(x < W*0.5){
    const cx = L.gx + L.side/2, cy = L.gy + L.side/2;
    const r = Math.floor(selIdx/6), c = selIdx%6;
    if(Math.abs(x-cx) > Math.abs(y-cy)) selIdx = r*6 + clamp(c + (x>cx?1:-1), 0, S.gridN-1);
    else selIdx = clamp(r + (y>cy?1:-1), 0, S.gridN-1)*6 + c;
    clampSel(); sfx.click();
  }else{
    interact(selIdx);
  }
}

window.addEventListener('keydown', e=>{
  initAudio();
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','spacebar','enter'].includes(k)) e.preventDefault();

  if(k==='m'){ S.muted = !S.muted; if(!S.muted) sfx.click(); save(); return; }

  if(S.screen==='boot') return;
  if(S.screen==='title'){
    if(k===' '||k==='spacebar'||k==='enter') startGame();
    return;
  }
  if(modal){
    if(k==='escape'||k==='p'){
      if(modal==='pause'){ modal = null; }
      else if(modal==='upgrade'){ modal = null; }
      else if(modal==='reset'){ modal = null; }
      return;
    }
    if(modal==='offline' && (k===' '||k==='spacebar'||k==='enter')){ doAction('claimOffline'); return; }
    return;
  }

  const r = Math.floor(selIdx/6), c = selIdx%6;
  if(k==='arrowup'||k==='w'){ selIdx = clamp(r-1,0,S.gridN-1)*6 + c; clampSel(); sfx.click(); return; }
  if(k==='arrowdown'||k==='s'){ selIdx = clamp(r+1,0,S.gridN-1)*6 + c; clampSel(); sfx.click(); return; }
  if(k==='arrowleft'||k==='a'){ selIdx = r*6 + clamp(c-1,0,S.gridN-1); clampSel(); sfx.click(); return; }
  if(k==='arrowright'||k==='d'){ selIdx = r*6 + clamp(c+1,0,S.gridN-1); clampSel(); sfx.click(); return; }
  if(k===' '||k==='spacebar'||k==='enter'){ interact(selIdx); return; }
  if(k>='1'&&k<='4'){ S.cropSel = parseInt(k,10)-1; sfx.click(); save(); return; }
  if(k==='u'){ modal = (modal==='upgrade')?null:'upgrade'; sfx.click(); return; }
  if(k==='e'){ doAction('expand'); return; }
  if(k==='p'||k==='escape'){ modal = 'pause'; sfx.click(); return; }
  if(k==='r'){ modal = 'reset'; sfx.click(); return; }
});

/* =========================================================
   12. 生命周期
   ========================================================= */
function startGame(){
  S.screen = 'playing';
  modal = null;
  sfx.click();
  save();
}
function resetGame(){
  const keepBest = Math.max(S.best, S.total);
  const keepMuted = S.muted;
  const fresh = defaults();
  fresh.best = keepBest;
  fresh.muted = keepMuted;
  Object.assign(S, fresh);
  offline = null;
  modal = null;
  S.screen = 'title';
  parts.length = 0; floats.length = 0; rings.length = 0; toasts.length = 0;
  EV.cloudActive = 0; EV.cloudT = rnd(38,58); EV.pestT = rnd(26,44);
  toast('新农场已建立', CO.lime);
  save();
}

window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) save();
  else if(AC && AC.state==='suspended') AC.resume();
});

/* =========================================================
   13. 主循环（固定时间步长）
   ========================================================= */
const STEP = 1/60;
let acc = 0, lastT = performance.now(), autosaveT = 0;

function update(dt){
  S.time += dt;

  if(S.screen!=='playing' || modal){
    updateFx(dt);
    return;
  }

  const spMult = HELPERS.sprinkler.mult[S.sprinkler];
  const cloudMult = EV.cloudActive>0 ? 1.8 : 1;

  for(let i=0;i<36;i++){
    const r = Math.floor(i/6), c = i%6;
    if(isLocked(r,c)) continue;
    const p = S.plots[i];
    if(p.crop===null || p.stage>=3) continue;
    const crop = CROPS[p.crop];
    const rate = (1/crop.grow) * spMult * cloudMult * (p.pest?0.78:1);
    const before = p.progress;
    p.progress += rate*dt;
    if(p.progress>=1){
      p.progress = 1; p.stage = 3;
      const cc = cellCenter(i);
      ringFx(cc.x, cc.y, CO.green, L.cell*0.9);
      floatText(cc.x, cc.y - L.cell*0.4, '成熟!', CO.gold, 15);
      tone(560,0.09,'triangle',0.16,820);
    }else{
      const st = p.progress<0.12 ? 0 : (p.progress<0.45 ? 1 : 2);
      if(st !== p.stage && before>0){
        p.stage = st;
        const cc = cellCenter(i);
        ringFx(cc.x, cc.y, CO.green, L.cell*0.55);
      }
    }
  }

  updateEvents(dt);
  updateFx(dt);

  autosaveT += dt;
  if(autosaveT > 15){ autosaveT = 0; save(); }
}

function frame(now){
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while(acc >= STEP && guard < 12){
    if(S.screen==='boot'){
      bootT += STEP;
      if(bootT > 1.7){ S.screen = 'title'; }
      updateFx(STEP);
      acc -= STEP;
    }else{
      update(STEP);
      acc -= STEP;
    }
    guard++;
  }
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   14. 启动
   ========================================================= */
resize();
const hadSave = load();
S.screen = 'boot';
bootT = 0;
checkUnlocks();

if(hadSave){
  const off = offlineResult();
  if(off && off.gain>0){
    offline = off;
    modal = 'offline';
  }
}
save();
requestAnimationFrame(frame);

// 首次交互时解锁音频
window.addEventListener('pointerdown', initAudio, { once:true });
window.addEventListener('keydown', initAudio, { once:true });

})();
</script>
